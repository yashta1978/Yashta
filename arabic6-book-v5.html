<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>اللغة العربية ٦ — كتاب</title>
<style>
:root{--o:#e8890c;--ob:#fff1dc;--b:#1f6fd1;--bb:#e4eefc;--g:#13803a;--gb:#e1f5e8;--r:#c62828;--rb:#fde7e7;--m:#7b3fb0;--ink:#1c2430;--mut:#5b6573;--line:#d5dbe3;--bg:#f4f6f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.7 "Geeza Pro","Noto Naskh Arabic",Tahoma,-apple-system,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.tabs{position:sticky;top:0;z-index:30;display:flex;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:48px;border:0;background:#fff;font-size:16px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;padding:6px 2px}
.tabs button.on{color:var(--b);border-bottom-color:var(--b)}
#bkbtn{display:none;flex:1 1 150px;min-height:44px}#bkbtn.show{display:block}.bar.bk .cnt{display:none}
.pane{display:none;padding:10px 0 80px}.pane.on{display:block}
.wrap{max-width:900px;margin:0 auto;padding:0 10px}
.bar{position:sticky;top:48px;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.cnt{font-size:16px;font-weight:600}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:600}
.btn.pri{background:var(--b);border-color:var(--b);color:#fff}
.btn.sm{min-height:44px}.btn.lnk{background:none;border:none;text-decoration:underline;color:#555;font-weight:500}.pcrop{width:100%;max-width:230px;margin:8px auto;border:1px solid #ccc;border-radius:10px;background-repeat:no-repeat;height:0}details.more>summary,details.whr>summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer;color:#444}.btn.big{width:100%;font-size:18px}
.btn[disabled]{opacity:.5}
.legend{font-size:15px;color:var(--mut);padding:8px 10px;line-height:1.7}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;text-align:center;line-height:20px;font-size:13px;border:2px solid;vertical-align:middle;background:#fff}
.dot.o{border-color:var(--o)}.dot.b{border-color:var(--b)}.dot.r{border-color:var(--r);color:var(--r);font-weight:700}
.pgw{scroll-margin-top:120px;margin:14px 0 6px}
.ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px}
.ph b{font-size:18px}
.tag{font-size:14px;padding:2px 8px;border-radius:999px;background:#e9edf3;color:var(--mut)}
.tag.ctx{background:#eee6f7;color:var(--m)}
.sp{flex:1}
.sc{overflow-x:hidden}
body.z .sc{overflow-x:auto}
.pg{padding-right:9%;background:#fff;width:100%}
body.z .pg{width:210%}
.im{position:relative;width:100%;background:#fff}
.im img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.hl{position:absolute;pointer-events:none;mix-blend-mode:multiply;border-bottom:2px solid}
.hl.o{background:rgba(255,170,0,.32);border-color:var(--o)}
.hl.b{background:rgba(60,140,255,.22);border-color:var(--b)}
.hl.r{background:rgba(220,40,40,.2);border-color:var(--r)}
.gi{position:absolute;right:-5.2%;width:44px;height:44px;margin:-22px -22px 0 0;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;z-index:5}
.gi i{display:flex;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid;align-items:center;justify-content:center;font-style:normal;font-size:15px;line-height:1}
.gi.o i{border-color:var(--o);background:var(--ob)}.gi.b i{border-color:var(--b);background:var(--bb)}.gi.r i{border-color:var(--r);color:var(--r);font-weight:800;background:var(--rb)}.gi.e i{border-color:var(--mut);background:#fff}
.gi.done i{background:var(--gb);border-color:var(--g)}
svg.cn{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}
svg.cn line{stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.5;mix-blend-mode:multiply}
.op{position:absolute;border:0;background:transparent;padding:0;z-index:4}
.op.ok{background:rgba(19,128,58,.2);outline:2px solid var(--g)}
.op.bad{background:rgba(198,40,40,.2);outline:2px solid var(--r)}
.op.rev{background:rgba(19,128,58,.12);outline:2px dashed var(--g)}
.mk{position:absolute;font-weight:800;font-size:18px;line-height:1;z-index:6;pointer-events:none;transform:translate(-100%,-50%)}
.mk.in{transform:translate(0,-50%);background:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;font-size:15px;box-shadow:0 0 0 1px currentColor}.mk.ok{color:var(--g)}.mk.bad{color:var(--r)}
@media (prefers-reduced-motion:no-preference){.op.bad{animation:fl .3s}@keyframes fl{from{opacity:.2}to{opacity:1}}}
.panel{margin:6px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.panel summary{min-height:44px;padding:10px 12px;font-weight:600;cursor:pointer;list-style:none}
.panel summary::-webkit-details-marker{display:none}
.row{border-top:1px solid var(--line);padding:10px 12px}
.row .qh{display:flex;gap:8px;align-items:flex-start}
.row .qh span{flex:1;font-size:16px}
.ans{margin-top:8px;padding:10px 12px;border-radius:10px;background:#f1f4f8;border-right:5px solid var(--mut);font-size:16px}
.ans.t{background:var(--gb);border-color:var(--g)}.ans.o{background:var(--ob);border-color:var(--o)}
.ans .src{display:block;font-size:14px;color:var(--mut);margin-top:6px}
.gi .gb.df{color:#b36b00;border-color:#b36b00}
.gi .gb{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);background:#fff;color:#c62828;border:1px solid #c62828;border-radius:6px;font-size:10px;line-height:12px;padding:0 3px;font-weight:700}
.badge.err{background:#fdecea;color:#b71c1c;border:1px solid #c62828;margin-left:6px}
.sf{position:absolute;border:2px solid #d81b60;background:rgba(216,27,96,.14);border-radius:3px;z-index:4;pointer-events:none;box-sizing:border-box}
.sf.rel{border-style:dashed}
.ar{position:absolute;z-index:6;pointer-events:none;transform:translate(-100%,-50%);width:36px;height:22px}
#gotop{min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 8px}
.srcbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 10px;padding:6px 10px;border:2px solid #d81b60;border-radius:10px;background:#fff0f5;font-size:15px;font-weight:600}
.acts .src{border-color:#d81b60;color:#8e0e3d}
#mds{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ans .ask{display:block;margin-top:6px;font-weight:600;color:#8a4b00}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:999px;margin-bottom:4px}
.badge.t{background:var(--g);color:#fff}.badge.b{background:#5b6573;color:#fff}.badge.o{background:var(--o);color:#fff}
.mine{color:var(--m);font-weight:700}
/* modal */
.bq{position:absolute;display:flex;align-items:center;justify-content:center;border:2px dashed #0b57d0;background:rgba(255,255,255,.55);color:#0b57d0;font-weight:800;font-size:clamp(18px,3.4cqw,30px);z-index:4;padding:0;border-radius:999px;cursor:pointer}
.bq.tag{width:44px;height:44px;margin:-22px -22px 0 0;border-radius:50%;background:transparent;border:0;font-size:18px}
.bq.tag::before{content:'';position:absolute;width:26px;height:26px;border-radius:50%;border:2px dashed #0b57d0;background:rgba(255,255,255,.9);z-index:-1}
.bq.tag{isolation:isolate}
.bq.done{display:none}.bq:not(.tag){font-size:0;line-height:0}.bq:not(.tag)::after{content:"?";font-size:clamp(18px,3.4cqw,30px);line-height:1;pointer-events:none;position:absolute}
.bf{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:max(12px,1.9cqw);line-height:1.05;color:#1b5e20;background:rgba(255,255,255,.9);border-radius:12px;z-index:3;padding:1px 4px;box-sizing:border-box}
.bf.seen{color:#4a148c}
.bf.tagt{border:2px solid #1b5e20;white-space:nowrap}
.bf.tagt.seen{border-color:#4a148c}
#bki{width:100%;box-sizing:border-box;font-size:18px;padding:10px;border:2px solid var(--mut);border-radius:10px;margin:6px 0}
.md{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.md.on{display:flex}
.lpv{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:90;flex-direction:column}.lpv.on{display:flex}.lpvh{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--line);align-items:center}.lpvs{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}.lpvw{width:100%}.lpv.z .lpvw{width:220%}.lpv .hl.foc{outline:3px solid #d81b60}.lpl{padding:10px 12px 30px}.lpl .hi{display:block;width:100%;text-align:right;min-height:48px;margin:6px 0;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:17px}.lpl .hi.o{border-color:var(--o);background:var(--ob)}.lpl .hi.b{border-color:var(--b);background:var(--bb)}.lpl .hi.r{border-color:var(--r);background:var(--rb)}.lpl .hx{white-space:pre-line;font-size:17px;margin:6px 0 0}.snip{margin:6px 0}.ans,.lb .q,.eq .q,.facts div,.rv div,.pt div{white-space:pre-line}.pn{font-size:15px;color:#555;margin:6px 0}.pt{margin:8px 0;padding:8px 10px;border-left:6px solid;border-radius:6px;background:#fff}.pt .ph{display:block;margin-bottom:4px;font-size:18px}.pt.c0{border-color:#00838f}.pt.c0 .ph{color:#00838f}.pt.c1{border-color:#6d4c41}.pt.c1 .ph{color:#6d4c41}.pt.c2{border-color:#3949ab}.pt.c2 .ph{color:#3949ab}.pt.c3{border-color:#827717}.pt.c3 .ph{color:#827717}.snip canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block}
.mdc{background:#fff;width:100%;max-width:560px;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 22px;border-top:6px solid var(--b)}
.mdc.o{border-top-color:var(--o)}.mdc.r{border-top-color:var(--r)}
.mdc h3{margin:0 0 6px;font-size:20px}
.mdc p{margin:0 0 14px;font-size:17px;white-space:pre-line}
/* learn */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chip{min-height:44px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-right:8px solid var(--tc,#888);border-radius:12px;padding:12px;margin:10px 0}
.card .meta{font-size:14px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card .tt{font-size:13px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--tc,#888);color:#fff}
.card .q{margin:6px 0 8px;font-size:17px}
.card ol{margin:8px 0;padding-right:22px;font-size:16px}
.t1{--tc:#1f6fd1}.t2{--tc:#13803a}.t3{--tc:#b8590a}.t4{--tc:#7b3fb0}.t5{--tc:#0f7f86}.t6{--tc:#a3294a}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.hid{display:none}
h2{font-size:22px;margin:8px 0}
.note{font-size:15px;color:var(--mut)}
/* exam */
.eq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.opt{display:block;width:100%;text-align:right;min-height:48px;padding:10px 12px;margin:8px 0;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:17px}
.opt.sel{border-color:var(--b);background:var(--bb)}
.opt.good{border-color:var(--g);background:var(--gb)}.opt.wrong{border-color:var(--r);background:var(--rb)}
input[type=text],textarea,select{width:100%;font-size:17px;padding:10px;border:2px solid var(--line);border-radius:10px;font-family:inherit;background:#fff}
textarea{min-height:110px}
.wf{min-height:70px;margin:8px 0}.rate{margin-top:8px}.rate .btn.sel{background:var(--bb);border-color:var(--b)}
.hq{letter-spacing:2px;color:#777}.bs{margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:10px}.bs .opt{display:inline-block;width:auto;min-height:44px;margin:4px 4px 0 0}.cf .btn.on{background:var(--bb);border-color:var(--b)}.lv{font-size:15px;color:#555;margin:4px 0}
.mtr{display:grid;grid-template-columns:1fr;gap:6px;margin:10px 0}
.pb{height:10px;background:#e3e8ef;border-radius:99px;overflow:hidden;margin:8px 0}
.pb>div{height:100%;background:var(--b);width:0}
.res{font-size:30px;font-weight:800}
.rv{border-top:1px solid var(--line);padding:10px 0}
.rv.ok .h{color:var(--g)}.rv.no .h{color:var(--r)}
.rv .h{font-weight:700}
.ck{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:6px 0;font-size:16px}
.ck input{width:24px;height:24px;margin-top:2px}
.fc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.fc .term{font-size:19px;font-weight:700}
.fc.k{border-color:var(--g);background:var(--gb)}
.facts div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:16px}
.lh{margin:16px 0 4px;font-size:18px;display:flex;gap:8px;align-items:center}
.lq{background:#fff;border:1px solid var(--line);border-radius:12px;margin:6px 0}
.lq summary{min-height:48px;padding:10px 12px;font-size:16px;cursor:pointer;list-style:none}
.lq summary::-webkit-details-marker{display:none}
.lq summary.rdy{border-right:5px solid var(--g)}
.btn.on{background:var(--gb);border-color:var(--g)}
.lq summary.seen{border-right:6px solid var(--g);border-radius:12px}
.lq .lb{padding:0 12px 12px}
.lq .q{margin:0 0 8px;font-size:17px}
.cvr{display:flex;justify-content:space-between;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;margin:4px 0;font-size:16px}
.okc{color:var(--g)}
.eq .q{font-size:18px}
.pa-bar{height:12px;background:#e7ebf0;border-radius:6px;overflow:hidden;margin:6px 0}.pa-bar i{display:block;height:100%;background:var(--g)}
input.pa-in{width:auto;height:auto;display:inline-block;font:inherit;font-size:17px;padding:4px 6px;border:2px solid var(--line);border-radius:8px;margin:0 2px;min-height:40px;max-width:100%}
.pa-in.ok{border-color:var(--g);background:var(--gb)}.pa-in.no{border-color:var(--r);background:var(--rb)}
.pa-cz{line-height:2.4;font-size:18px;white-space:pre-wrap}
.opt.bad{border-color:var(--r);background:var(--rb)}.opt.good{border-color:var(--g);background:var(--gb)}
.opt:disabled{opacity:.55}
.pa-st{display:flex;justify-content:space-between;gap:8px}
.tabs{display:flex}#lpvb{display:none!important}
#menub{position:static;display:block;margin:28px auto 24px;opacity:.6;font-size:14px;padding:8px 18px;min-height:44px}
.pa-top{margin-bottom:6px}.pa-top .btn.sm{margin-bottom:6px}
.mpan{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;overflow:auto}.mbox{background:#fff;margin:24px 12px;padding:14px;border-radius:12px;max-width:560px}.mbox input[type=password]{width:100%;margin:6px 0;font-size:17px;padding:10px;border:2px solid var(--line);border-radius:10px}
</style>
</head>

<section class="pane on" id="p-path"><div class="wrap" id="path"></div></section>

<section class="pane" id="p-book">
 <div class="bar"><button class="btn pri" id="bkbtn" type="button">عودة</button><div class="cnt" id="cnt"></div><div style="display:flex;gap:8px;align-items:center"><select id="gotop" aria-label="اذهبي إلى الصفحة"></select><button class="btn" id="zoom">تكبير</button></div></div>
 <div class="wrap">
  <div class="legend">
   <span class="dot o">&#128161;</span> المطلوب &nbsp; <span class="dot b">&#128161;</span> بقية الصفحة &nbsp; <span class="dot r">!</span> خطأ محتمل في الكتاب &nbsp; <span class="dot" style="border-color:#5b6573">&#128065;</span> أظهري الجواب. اضغطي على جواب في الصفحة لتتحقّقي منه.
  </div>
 </div>

</section>

<div class="md" id="bkd"><div class="mdc o" id="bkc"><h3 id="bkt"></h3><p id="bkq"></p><input id="bki" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="جوابكِ"><p id="bkm"></p><div class="acts"><button class="btn pri" id="bkok">تحقّقي</button><button class="btn" id="bkeye">👁 أظهري الجواب</button><button class="btn" id="bkx">إغلاق</button></div></div></div>

      if(new Set(c.opts.map(norm)).size!==c.opts.length) errs.push(c.id+': repeated options');
    }
    if(c.type==='fl'){
      if(!c.keys||!c.keys.length) errs.push(c.id+': no keys');

function applySnap(o){
  function fill(dst,src){Object.keys(dst).forEach(function(k){delete dst[k]});if(src&&typeof src==='object'){Object.keys(src).forEach(function(k){dst[k]=src[k]})}}

  Object.keys(REV).forEach(function(id){var r=REV[id];if(!LB[id]||!r||typeof r.b!=='number'||typeof r.d!=='string')delete REV[id]});
}

var STG=GO.filter(function(g){return D.EX.some(function(q){return gOf(q)===g})});
var PSEQ=[];UNITS.forEach(function(u){STG.filter(function(g){return uOf(g)===u}).forEach(function(g){PSEQ.push({k:'s',g:g})});PSEQ.push({k:'u',u:u})});PSEQ.push({k:'b'});
function psOf(g){var s=PS.s[g];if(!s){s=PS.s[g]={rd:{},q:{},d:{},m:{n:0,best:0,ok:false}}}if(!s.rd)s.rd={};if(!s.p)s.p={};if(!s.q)s.q={};if(!s.d)s.d={};if(!s.m)s.m={n:0,best:0,ok:false};return s}
function stageCnt(u){return STG.filter(function(g){return uOf(g)===u}).length}
function pDone(x){
  if(x.k==='s')return !!psOf(x.g).m.ok&&stagePagesDone(x.g);
  if(x.k==='u'){var o=PS.u[x.u];return !!(o&&o.ok&&o.sig===stageCnt(x.u))}
  return !!(PS.b&&PS.b.ok&&PS.b.sig===PSEQ.length-1);
}
function pUnlocked(i){return true;var x=PSEQ[i];if(x.k==='s')return true;
  if(x.k==='u')return STG.every(function(g){return uOf(g)!==x.u||pDone({k:'s',g:g})});
  return PSEQ.every(function(y){return y.k==='b'||pDone(y)})}
function pLast(){var i=PS.last;return (typeof i==='number'&&i>=0&&i<PSEQ.length&&!pDone(PSEQ[i]))?i:pCur()}
function pStarted(x){if(x.k!=='s')return false;return stagePages(x.g).some(function(pg){return PS.v[pg]})}
function pState(x,i){if(pDone(x))return 'أتقنتِ';if(x.k==='s')return pStarted(x)?'قيد الإنجاز':'جديد';return pUnlocked(i)?'افتحي':'أكملي الأقسام أولاً'}
function pCur(){for(var i=0;i<PSEQ.length;i++)if(!pDone(PSEQ[i]))return i;return -1}
function pathDone(){return pCur()===-1}
function pLabel(x){return x.k==='s'?GN[x.g]:(x.k==='u'?('الوحدة '+x.u+''):'فحص الواجب اليومي')}
function stageQs(g){return D.EX.filter(function(q){return gOf(q)===g}).sort(function(a,b){var A=LB[a.l],B=LB[b.l];return (A?A.pg:0)-(B?B.pg:0)})}
function stagePages(g){var o=[];cardsAll().forEach(function(c){if(c.id.split('-')[0]===g&&o.indexOf(c.pg)<0)o.push(c.pg)});return o.sort(function(a,b){return a-b})}

function clozeBox(text,frac,onPass,onGiveUp,key){

  var top=cand.slice().sort(function(a,b){return b.len-a.len||a.i-b.i}).slice(0,Math.min(cand.length,n+2));
  var pick=shuffle(top).slice(0,n).map(function(c){return c.i});

  });

  });

async function bkEncode(obj,pass){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));var k=await bkKey(pass,salt);var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj))));var all=new Uint8Array(28+ct.length);all.set(salt,0);all.set(iv,16);all.set(ct,28);return 'BKS1.'+bkB64u(all)}
async function bkDecode(code,pass){code=String(code||'').trim();if(code.indexOf('BKS1.')!==0)throw new Error('This is not a setup code.');var all=bkUnb64u(code.slice(5));var k=await bkKey(pass,all.slice(0,16));try{var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},k,all.slice(28));return JSON.parse(new TextDecoder().decode(pt))}catch(e){throw new Error('Wrong passphrase or damaged code.')}}

  if(x.k==='s'){var pgs=stagePages(x.g),k=0,pa=-1;while(k<pgs.length&&pageState(x.g,pgs[k]).done){if(k%2===1&&!ppOk(x.g,pgs[k-1],pgs[k])){pa=k;break}k++}o.pk=pa>=0?pa:k;o.pn=pgs.length;
    if(pa>=0){o.pg=pgs[pa];o.step='pair check'}else if(k<pgs.length){var st=pageState(x.g,pgs[k]);o.pg=pgs[k];o.step=!st.rd?'reading':((!(st.q&&st.d)||!roundsOk(x.g,pgs[k]))?'round':'page check');if(st.rd&&o.step==='round'){var _r=rnCur(x.g,pgs[k]);o.rn=_r+1;o.rt=roundsOf(x.g,pgs[k]).length}}else o.step='section check'}

function stDetail(){return GO.filter(function(g){return STG.indexOf(g)>-1||stagePages(g).length}).map(function(g){

    return {p:pg,r:st.rd?1:0,rn:rd,rt:R.length,q:st.q?1:0,qt:st.qs.length,d:st.d?1:0,dt:st.df.length,c:st.o.ok?1:0,cn:st.o.n||0}});
  return {n:GN[g],u:SUOF[g],hw:(D.meta.hw||[]).indexOf(g)>-1?1:0,pg:pgs,m:{ok:!!sp.m.ok,n:sp.m.n||0,best:sp.m.best||0}}})}

    days[k]={sec:L.sec||0,read:Object.keys(L.pg||{}).filter(function(b){return L.pg[b]>=Math.max(READ_MIN,1)}).map(Number),a:L.a||0,w:L.w||0,f:L.f||0,ms:L.ms||0}});

async function ghReq(method,path,body){var d=devGet();return fetch((d.api||'https://api.github.com')+'/repos/'+d.repo+'/contents/'+path,{method:method,headers:{'Authorization':'Bearer '+d.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
function markDirty(){if(!canReport())return;SYNC.dirty=true;if(!SYNC.t)SYNC.t=setTimeout(function(){SYNC.t=null;syncNow()},SYNC.delay)}
async function syncNow(){
  if(!canReport()||SYNC.busy)return;
  if(navigator.onLine===false){SYNC.err='offline';SYNC.dirty=true;return}
  SYNC.busy=true;SYNC.dirty=false;var fail=false;
  try{
    var path='reports/'+D.meta.book+'.json',b64=btoa(unescape(encodeURIComponent(JSON.stringify(buildReport()))));
    for(var tr=0;tr<3;tr++){
      if(SYNC.sha===null){var g=await ghReq('GET',path);if(g.status===200)SYNC.sha=(await g.json()).sha;else if(g.status===404)SYNC.sha='';else throw new Error('GET '+g.status)}
      var pr=await ghReq('PUT',path,{message:'report '+D.meta.book,content:b64,sha:SYNC.sha||undefined});
      if(pr.status===200||pr.status===201){SYNC.sha=(await pr.json()).content.sha;SYNC.last=Date.now();SYNC.err='';break}
      if(pr.status===409||pr.status===422){SYNC.sha=null;continue}
      throw new Error('PUT '+pr.status);
    }
  }catch(e){fail=true;SYNC.err=String(e&&e.message||e);SYNC.dirty=true}
  SYNC.busy=false;
  if(fail){if(!SYNC.t)SYNC.t=setTimeout(function(){SYNC.t=null;syncNow()},SYNC.retry)}else if(SYNC.dirty)markDirty();
}

// Arabic-Indic digits for all visible text (the book prints ٠١٢...)
(function(){var M='٠١٢٣٤٥٦٧٨٩',busy=false;
function cv(n){var v=n.nodeValue;if(v&&/[0-9]/.test(v)){var w=v.replace(/[0-9]/g,function(d){return M[d]});if(w!==v)n.nodeValue=w}}
function walk(r){if(r.nodeType===3){cv(r);return}var t=r.nodeName;if(t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA')return;for(var c=r.firstChild;c;c=c.nextSibling)walk(c)}
function all(){busy=true;try{walk(document.body)}finally{busy=false}}
new MutationObserver(function(ms){if(busy)return;busy=true;try{ms.forEach(function(m){if(m.type==='characterData')cv(m.target);else m.addedNodes.forEach(function(n){walk(n)})})}finally{busy=false}}).observe(document.body,{subtree:true,childList:true,characterData:true});
all()})();
