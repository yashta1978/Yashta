<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وانەیێن ئایینی</title>
<style>
:root{
  --frame:#cfe0e0; --leaf:#f4faf9; --paper:#fffefb; --ink:#1d1d1d;
  --blue:#3f82c4; --bar:#2f4a52; --orange:#c1693b; --teal:#1f7f7a;
  --gold:#c9a45c; --ok:#1f7a3a; --okbg:#d9f2e0; --bad:#b3261e; --badbg:#fadad7;
  --hl:#fff1b8; --line:#7a7a7a;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0; color:var(--ink); line-height:2.1; font-size:19px;
  font-family:"Noto Naskh Arabic","Noto Sans Arabic","Segoe UI","Tahoma","Arial",sans-serif;
  background-color:var(--frame);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'><g fill='%23f4faf9' opacity='0.85'><path d='M45 6c9 10 9 22 0 34-9-12-9-24 0-34z'/><path d='M45 6c9 10 9 22 0 34-9-12-9-24 0-34z' transform='rotate(72 45 45)'/><path d='M45 6c9 10 9 22 0 34-9-12-9-24 0-34z' transform='rotate(144 45 45)'/><path d='M45 6c9 10 9 22 0 34-9-12-9-24 0-34z' transform='rotate(216 45 45)'/><path d='M45 6c9 10 9 22 0 34-9-12-9-24 0-34z' transform='rotate(288 45 45)'/></g></svg>");
}
#progress{position:fixed;top:0;right:0;height:5px;background:var(--blue);width:0;z-index:30}
header.top{
  position:sticky;top:0;z-index:20;background:var(--bar);color:#fff;
  padding:8px 12px;border-bottom:3px solid var(--gold);
}
header.top h1{margin:0 0 4px;font-size:18px;line-height:1.6;text-align:center}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
nav button{
  font:inherit;font-size:15px;line-height:1.5;padding:4px 12px;border:2px solid var(--gold);
  background:transparent;color:#fff;border-radius:18px;cursor:pointer;
}
nav button[aria-selected="true"]{background:var(--gold);color:#222;font-weight:700}
#total{font-size:14px;text-align:center;margin-top:2px;line-height:1.6}
main{padding:14px 10px 40px;max-width:820px;margin:0 auto}

/* the book page */
.sheet{
  position:relative;background:var(--paper);border-radius:34px;margin:0 0 26px;
  padding:18px 22px 54px;
  border:1px solid #b9cccc;
  box-shadow:0 0 0 6px rgba(255,255,255,.55), 0 3px 10px rgba(0,0,0,.18);
}
.orn{display:block;margin:0 auto 4px;width:min(360px,80%);height:auto}
.sheet h2.lt{margin:0;text-align:center;color:var(--blue);font-size:22px;line-height:1.7}
.sheet h3.lt{margin:0 0 10px;text-align:center;color:var(--blue);font-size:21px;line-height:1.8}
.bar{
  display:inline-block;background:var(--bar);color:#fff;border-radius:10px;
  padding:0 16px;margin:10px 0 6px;font-weight:700;font-size:18px;line-height:2
}
.sheet p{margin:0 0 8px;text-align:justify}
.sheet p.sub{margin:6px 0 2px}
.sheet .lab{color:var(--orange);font-weight:700}
.verse{
  color:var(--teal);font-size:23px;line-height:2.3;text-align:center;margin:6px 0 8px;
  font-family:"Amiri","Scheherazade New","Noto Naskh Arabic","Noto Sans Arabic","Traditional Arabic",serif;
}
.verse small{font-size:16px;color:#333;font-family:inherit}
.item{margin:0 0 8px}
.hl{background:var(--hl);border-bottom:2px solid var(--line);padding:0 2px}
.hidehl .hl:not(.shown){filter:blur(7px);cursor:pointer;user-select:none}
.pg{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  background:var(--bar);color:#fff;border-radius:20px;min-width:74px;text-align:center;
  font-size:18px;line-height:1.7;padding:0 14px;border:2px solid #6b8a90
}
.pagenote{font-size:15px;color:#444;text-align:center;margin:0 0 6px}

.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 14px}
button.act{
  font:inherit;font-size:16px;line-height:1.6;padding:3px 14px;border-radius:10px;
  background:#fff;color:var(--bar);border:2px solid var(--bar);cursor:pointer
}
button.act:hover{background:#eef5f5}


/* guided mode */
.gate textarea{
  width:100%;min-height:90px;font:inherit;font-size:18px;line-height:1.9;padding:6px 10px;
  border:2px solid #8aa;border-radius:12px;background:#fff;color:var(--ink);resize:vertical
}
.reveal{background:#eef6f6;border:2px solid var(--teal);border-radius:12px;padding:6px 14px;margin:8px 0}
.step{border-top:2px dashed #9db8b8;margin-top:12px;padding-top:8px}
.step h4{margin:0 0 4px;color:var(--orange);font-size:20px;line-height:1.8}
.mine{font-size:17px;background:#f3f0e4;border-radius:10px;padding:4px 12px}
.conf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.conf .cl{font-size:16px;color:#333}
.cbtn{
  font:inherit;font-size:16px;line-height:1.6;padding:1px 12px;border-radius:14px;cursor:pointer;
  background:#fff;border:2px solid var(--bar);color:var(--bar)
}
.cbtn.on{background:var(--bar);color:#fff}
.cbtn:disabled{cursor:default}
.hintbox{margin:4px 0;font-size:17px;color:#5b3a00;background:#fff4d6;border-radius:10px;padding:2px 12px}
.opt:disabled.wait{opacity:.55}
.why{margin:4px 0 8px;font-size:17px;line-height:1.9;padding:4px 12px;border-radius:10px}
.why.ok{background:var(--okbg);color:#0b3d1a}
.why.bad{background:var(--badbg);color:#5b0f0a}
.gsum{background:#eef3fb;border:2px solid var(--blue);border-radius:12px;padding:6px 14px;margin:10px 0;line-height:2}

/* exercises */
.ex{border-top:2px dashed #9db8b8;margin-top:12px;padding-top:10px}
.ex .qn{font-weight:700;color:var(--orange)}
.q{margin:0 0 6px}
.note{font-size:15px;color:#555;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:6px;margin:4px 0 4px}
.opt{
  font:inherit;font-size:18px;line-height:1.8;text-align:right;padding:2px 14px;
  background:#fff;border:2px solid #8aa;border-radius:12px;cursor:pointer;color:var(--ink)
}
.opt.sel{border-color:var(--blue);background:#e6f0fa}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#0b3d1a;font-weight:700}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:#5b0f0a}
.opt:disabled{cursor:default}
select{
  font:inherit;font-size:17px;max-width:100%;padding:0 6px;border:2px solid #8aa;border-radius:8px;
  background:#fff;color:var(--ink);line-height:1.8
}
select.ok{background:var(--okbg);border-color:var(--ok)}
select.bad{background:var(--badbg);border-color:var(--bad)}
.fix{color:var(--ok);font-weight:700;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.row .l{flex:1 1 200px;font-weight:700}
.fb{font-size:16px;margin:0 0 8px;line-height:1.8}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.score{
  position:sticky;bottom:8px;margin:12px auto 0;max-width:300px;background:var(--bar);color:#fff;
  text-align:center;border-radius:14px;padding:2px 10px;font-weight:700;border:2px solid var(--gold);line-height:1.8
}
.final{background:var(--okbg);border:2px solid var(--ok);border-radius:12px;padding:6px 12px;margin:10px 0;font-weight:700;color:#0b3d1a}
footer.src{font-size:14px;color:#2b3a3d;text-align:center;line-height:1.8;padding:0 14px 30px;max-width:820px;margin:0 auto}
@media (max-width:480px){
  body{font-size:18px}
  .sheet{padding:14px 14px 52px;border-radius:26px}
  .verse{font-size:21px}
}
</style>
</head>

var AR = "٠١٢٣٤٥٦٧٨٩";
function ar(n){ return String(n).replace(/[0-9]/g, function(d){ return AR[d]; }); }
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
/* rich text: «...» = pen-marked part of the book */
function rich(parent, s){
  var parts = s.split(/(«[^»]*»)/);
  parts.forEach(function(p){
    if (!p) return;
    if (p.charAt(0) === "«"){
      var m = el("span", "hl", p.slice(1, -1));
      m.addEventListener("click", function(){ m.classList.toggle("shown"); });
      parent.appendChild(m);
    } else parent.appendChild(document.createTextNode(p));
  });
}

function renderSheet(L, pg, idx){
  var sh = el("section", "sheet");
  var o = el("div"); o.innerHTML = ORN; sh.appendChild(o.firstChild);
  if (idx === 0){
    sh.appendChild(el("h2", "lt", L.title));
    sh.appendChild(el("h3", "lt", L.sub));
  }
  pg.blocks.forEach(function(b){
    var e;
    if (b.t === "p"){ e = el("p"); rich(e, b.s); }
    else if (b.t === "bar"){ e = el("div"); e.appendChild(el("span", "bar", b.s)); }
    else if (b.t === "verse"){ e = el("div", "verse"); e.setAttribute("lang","ar"); e.appendChild(document.createTextNode(b.s)); if (b.ref){ e.appendChild(document.createTextNode(" ")); e.appendChild(el("small","", b.ref)); } }
    else if (b.t === "li"){ e = el("p", "item"); e.appendChild(el("span","lab", b.n + "- ")); rich(e, b.s); }
    sh.appendChild(e);
  });
  sh.appendChild(el("div", "pg", ar(pg.num)));
  return sh;
}

function renderExercises(L, host){
  host.textContent = "";
  var tr = { total:0, correct:0 };
  trackers[L.id] = tr;
  var scoreEl = el("div", "score");
  function upd(){ scoreEl.textContent = "ڕاهێنان: " + ar(tr.correct) + " ژ " + ar(tr.total); updateTotal(); }
  function report(ok){ if (ok) tr.correct++; upd(); }

  host.appendChild(el("h3", "lt", "ڕاهێنان – " + L.title));
  host.appendChild(el("p", "note", "تنێ ل سەر بەشێن نیشانکری یێن د کتێبێدا. ئەگەر بەرسڤ خەلەت بیت، دێ سۆر ببیت و بەرسڤا ڕاست دێ سەوز ببیت."));

  L.ex.forEach(function(x, i){
    var box = el("div", "ex");
    var q = el("p", "q");
    q.appendChild(el("span", "qn", ar(i + 1) + ". "));
    if (x.k === "fill"){
      var parts = x.q.split("___");
      var bi = 0;
      parts.forEach(function(seg, si){
        q.appendChild(document.createTextNode(seg));
        if (si < parts.length - 1){
          (function(ans){
            tr.total++;
            var s = el("select");
            var ph = el("option", "", "..."); ph.value = ""; s.appendChild(ph);
            x.opts.forEach(function(w){ var op = el("option", "", w); op.value = w; s.appendChild(op); });
            s.addEventListener("change", function(){
              if (!s.value) return;
              s.disabled = true;
              var ok = s.value === ans;
              s.className = ok ? "ok" : "bad";
              if (!ok){ var f = el("span", "fix", " ← " + ans); s.parentNode.insertBefore(f, s.nextSibling); }
              report(ok);
            });
            q.appendChild(s);
          })(x.blanks[bi++]);
        }
      });
      box.appendChild(q);
    } else if (x.k === "mcq" || x.k === "tf"){
      tr.total++;
      q.appendChild(document.createTextNode(x.q));
      box.appendChild(q);
      var opts = x.k === "tf" ? ["ڕاستە","نەڕاستە"] : x.opts;
      var ai = x.k === "tf" ? (x.a ? 0 : 1) : x.a;
      var wrap = el("div", "opts"), btns = [];
      opts.forEach(function(t, oi){
        var b = el("button", "opt", t); b.type = "button";
        b.addEventListener("click", function(){
          btns.forEach(function(bb){ bb.disabled = true; });
          if (oi === ai){ b.classList.add("ok"); report(true); }
          else { b.classList.add("bad"); btns[ai].classList.add("ok"); report(false); }
        });
        btns.push(b); wrap.appendChild(b);
      });
      box.appendChild(wrap);
    } else if (x.k === "multi"){
      tr.total++;
      q.appendChild(document.createTextNode(x.q));
      box.appendChild(q);
      var w2 = el("div", "opts"), bs = [], chosen = {};
      x.opts.forEach(function(t, oi){
        var b = el("button", "opt", t); b.type = "button";
        b.addEventListener("click", function(){ chosen[oi] = !chosen[oi]; b.classList.toggle("sel", !!chosen[oi]); });
        bs.push(b); w2.appendChild(b);
      });
      box.appendChild(w2);
      var chk = el("button", "act", "بەرسڤێ بپشکنە"); chk.type = "button";
      var fb = el("p", "fb");
      chk.addEventListener("click", function(){
        chk.disabled = true; var all = true;
        bs.forEach(function(b, oi){
          b.disabled = true; b.classList.remove("sel");
          var should = x.a.indexOf(oi) >= 0, did = !!chosen[oi];
          if (should) b.classList.add("ok");
          else if (did) b.classList.add("bad");
          if (should !== did) all = false;
        });
        fb.textContent = all ? "ڕاستە، هەمی دروستن." : "ئەوێن سەوز ڕاستن؛ ئەوێن سۆر خەلەتن.";
        fb.className = "fb " + (all ? "ok" : "bad");
        report(all);
      });
      box.appendChild(chk); box.appendChild(fb);
    } else if (x.k === "match"){
      q.appendChild(document.createTextNode(x.q));
      box.appendChild(q);
      x.left.forEach(function(lt, li){
        tr.total++;
        var r = el("div", "row"); r.appendChild(el("span", "l", lt));
        var s = el("select");
        var ph = el("option", "", "..."); ph.value = ""; s.appendChild(ph);
        x.right.forEach(function(w, wi){ var op = el("option", "", w); op.value = String(wi); s.appendChild(op); });
        s.addEventListener("change", function(){
          if (!s.value) return;
          s.disabled = true;
          var ok = Number(s.value) === li;
          s.className = ok ? "ok" : "bad";
          if (!ok) r.appendChild(el("span", "fix", " ← " + x.right[li]));
          report(ok);
        });
        r.appendChild(s); box.appendChild(r);
      });
    }
    host.appendChild(box);
  });

  var again = el("button", "act", "ڕاهێنانان ژ نوی دەستپێ بکە"); again.type = "button";
  again.addEventListener("click", function(){ renderExercises(L, host); });
  host.appendChild(el("p")); host.lastChild.appendChild(again);
  host.appendChild(scoreEl);
  upd();
}

function askItem(x, gs, onDone){
  var box = el("div", "ex");
  var q = el("p", "q");
  q.appendChild(document.createTextNode(x.q));
  box.appendChild(q);
  gs.total++;
  var conf = -1;
  var crow = el("div", "conf");
  crow.appendChild(el("span", "cl", "بەری بەرسڤێ، تو چەند ب باوەرییە؟"));
  var cl = [["پێ دلنیامە", 2], ["نیمچە", 1], ["نزانم", 0]];
  var cb = [];
  var wrap = el("div", "opts"), btns = [];
  cl.forEach(function(c){
    var b = el("button", "cbtn", c[0]); b.type = "button";
    b.addEventListener("click", function(){
      conf = c[1];
      cb.forEach(function(bb){ bb.disabled = true; bb.classList.remove("on"); });
      b.classList.add("on");
      btns.forEach(function(ob){ ob.disabled = false; ob.classList.remove("wait"); });
    });
    cb.push(b); crow.appendChild(b);
  });
  box.appendChild(crow);
  var hintHost = el("div"), hi = 0, hbtn = null;
  var fb = el("p", "why");
  fb.hidden = true;
  x.opts.forEach(function(t, oi){
    var b = el("button", "opt wait", t); b.type = "button"; b.disabled = true;
    b.addEventListener("click", function(){
      btns.forEach(function(bb){ bb.disabled = true; bb.classList.remove("wait"); });
      if (hbtn) hbtn.disabled = true;
      var ok = oi === x.a;
      var msg;
      if (ok){ b.classList.add("ok"); gs.correct++; msg = x.right || "ڕاستە."; if (conf === 0) gs.lowRight++; }
      else {
        b.classList.add("bad"); btns[x.a].classList.add("ok");
        msg = (x.why && x.why[oi]) || "بەرسڤا ڕاست سەوزە.";
        if (conf === 2){ gs.hiWrong++; msg += " تە ب باوەری بەرسڤ دا و خەلەت بوو؛ باشە ئەڤ بەشە دووبارە بخوینی."; }
      }
      fb.textContent = msg; fb.className = "why " + (ok ? "ok" : "bad"); fb.hidden = false;
      gs.update(); if (onDone) onDone(ok);
    });
    btns.push(b); wrap.appendChild(b);
  });
  box.appendChild(wrap);
  if (x.hints && x.hints.length){
    hbtn = el("button", "act", "تلميح"); hbtn.type = "button";
    hbtn.addEventListener("click", function(){
      if (hi >= x.hints.length) return;
      hintHost.appendChild(el("p", "hintbox", ar(hi + 1) + ". " + x.hints[hi]));
      hi++; gs.hints++; gs.update();
      if (hi >= x.hints.length) hbtn.disabled = true;
    });
    box.appendChild(hbtn); box.appendChild(hintHost);
  }
  box.appendChild(fb);
  return box;
}

function buildGuided(L, sec, rest, tr){
  var G = L.guided;
  var gate = el("section", "sheet gate");
  var o = el("div"); o.innerHTML = ORN; gate.appendChild(o.firstChild);
  gate.appendChild(el("h2", "lt", L.title));
  gate.appendChild(el("h3", "lt", L.sub));
  gate.appendChild(el("div")).appendChild(el("span", "bar", "ئێکەم: بیرا خۆ بکە"));
  gate.appendChild(el("p", "q", G.gate.q));
  var ta = el("textarea"); ta.id = "gate-box"; ta.setAttribute("placeholder", "بنڤێسە ل ڤێرێ...");
  gate.appendChild(ta);
  var rev = el("div", "reveal"); rev.hidden = true;
  rev.appendChild(el("p", "", G.gate.a));
  var show = el("button", "act", "بەرسڤێ ببینە"); show.type = "button";
  var go = el("button", "act", "بەردەوام بە بۆ دەقی"); go.type = "button"; go.hidden = true;
  var skip = el("button", "act", "ڕاستەڕاست بچە دەقی"); skip.type = "button";
  show.addEventListener("click", function(){ rev.hidden = false; go.hidden = false; show.hidden = true; skip.hidden = true; });
  function open(){ rest.hidden = false; gate.hidden = true; window.scrollTo(0, 0); }
  go.addEventListener("click", open); skip.addEventListener("click", open);
  var row = el("div", "tools"); row.appendChild(show); row.appendChild(skip); row.appendChild(go);
  gate.appendChild(row); gate.appendChild(rev);
  sec.appendChild(gate);

  var gs = { total:0, correct:0, hints:0, hiWrong:0, lowRight:0 };
  var scoreEl = el("div", "score");
  gs.update = function(){
    scoreEl.textContent = "ڕاهێنان: " + ar(gs.correct) + " ژ " + ar(gs.total) + " · تلميح: " + ar(gs.hints);
    tr.total = gs.total + (tr.extraTotal || 0); tr.correct = gs.correct + (tr.extraCorrect || 0);
    updateTotal();
  };

  var stepsSheet = el("section", "sheet");
  var o2 = el("div"); o2.innerHTML = ORN; stepsSheet.appendChild(o2.firstChild);
  stepsSheet.appendChild(el("h3", "lt", "دووێ: ب پێنگاڤان فێربە"));
  stepsSheet.appendChild(el("p", "note", "هەر ئەرکەکێ: دەقێ کتێبێ، پاشی ڕوونکرنەکا کورت (ژ لایێ منڤە)، پاشی پرسیارەک."));
  G.steps.forEach(function(st){
    var d = el("div", "step");
    d.appendChild(el("h4", "", st.title));
    var p = el("p"); rich(p, st.book); d.appendChild(p);
    d.appendChild(el("p", "mine", "ڕوونکرن (ژ لایێ منڤە): " + st.mine));
    d.appendChild(askItem(st.q, gs));
    stepsSheet.appendChild(d);
  });
  rest.appendChild(stepsSheet);

  var prac = el("section", "sheet");
  var o3 = el("div"); o3.innerHTML = ORN; prac.appendChild(o3.firstChild);
  prac.appendChild(el("h3", "lt", "سێیێ: خۆ تاقی بکە"));
  G.practice.forEach(function(x, i){
    var it = askItem(x, gs);
    var qn = it.querySelector(".q"); qn.insertBefore(el("span", "qn", ar(i + 1) + ". "), qn.firstChild);
    prac.appendChild(it);
  });
  var sum = el("div", "gsum"); sum.textContent = "دوماهیک: ب هەمی پرسیاران هنگی ئەنجامێ تە و باوەریا تە ل ڤێرێ دێ دیار بیت.";
  var sumBtn = el("button", "act", "ئەنجامێ باوەریێ ببینە"); sumBtn.type = "button";
  sumBtn.addEventListener("click", function(){
    var t = "تە " + ar(gs.correct) + " ژ " + ar(gs.total) + " ڕاست بەرسڤ دان، و " + ar(gs.hints) + " تلميح بکار ئینان.";
    if (gs.hiWrong > 0) t += " " + ar(gs.hiWrong) + " جاران ب باوەری بەرسڤ دا و خەلەت بوو؛ دووبارە دەقێ ڤان بەشان بخوینە.";
    else t += " چ جاران ب باوەریا بلند خەلەت نەبوویە.";
    if (gs.lowRight > 0) t += " " + ar(gs.lowRight) + " جاران گۆت «نزانم» و ڕاست بوو؛ تو ژ خۆ پتر دزانی.";
    sum.textContent = t;
  });
  prac.appendChild(sumBtn); prac.appendChild(sum);
  prac.appendChild(scoreEl);
  rest.appendChild(prac);
  gs.update();
}

function buildLesson(L){
  var sec = el("div"); sec.id = L.id; sec.hidden = true;
  var tools = el("div", "tools");
  var hide = el("button", "act", "ئێتمەوە: بەشێن نیشانکری بشێرە"); hide.type = "button";
  var read = el("div");
  hide.addEventListener("click", function(){
    var on = read.classList.toggle("hidehl");
    if (!on) Array.prototype.forEach.call(read.querySelectorAll(".hl"), function(m){ m.classList.remove("shown"); });
    hide.textContent = on ? "هەمیان نیشان بدە" : "ئێتمەوە: بەشێن نیشانکری بشێرە";
  });
  tools.appendChild(hide);
  var rest = sec;
  if (L.guided){ rest = el("div"); rest.hidden = true; }
  else sec.appendChild(tools);
  if (L.guided){ rest.appendChild(tools); }
  if (L.pagenote) rest.appendChild(el("p", "pagenote", L.pagenote));
  L.pages.forEach(function(pg, idx){ read.appendChild(renderSheet(L, pg, idx)); });
  if (L.guided){
    var tr0 = { total:0, correct:0 };
    trackers[L.id + "g"] = tr0;
    buildGuided(L, sec, rest, tr0);
    rest.insertBefore(read, tools.nextSibling);
  } else {
    rest.appendChild(read);
  }
  var exSheet = el("section", "sheet");
  var o = el("div"); o.innerHTML = ORN; exSheet.appendChild(o.firstChild);
  var host = el("div"); exSheet.appendChild(host);
  rest.appendChild(exSheet);
  if (L.guided) sec.appendChild(rest);
  main.appendChild(sec);
  renderExercises(L, host);
}

LESSONS.forEach(function(L, i){
  buildLesson(L);
  var b = el("button", "", L.tab); b.type = "button"; b.setAttribute("role", "tab");
  b.addEventListener("click", function(){ show(i); window.scrollTo(0, 0); });
  nav.appendChild(b);
});
function show(i){
  LESSONS.forEach(function(L, j){ document.getElementById(L.id).hidden = (i !== j); });
  Array.prototype.forEach.call(nav.children, function(b, j){ b.setAttribute("aria-selected", String(i === j)); });
  window.scrollTo(0, 0);
}
show(0);
window.addEventListener("scroll", function(){
  var h = document.documentElement.scrollHeight - window.innerHeight;
  document.getElementById("progress").style.width = (h > 0 ? (window.scrollY / h * 100) : 0) + "%";
});
</script>
