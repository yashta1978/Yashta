<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>گۆتی و میتانی</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#eef1f5;color:#1b2430;font-family:'Geeza Pro','Noto Naskh Arabic','Tahoma',sans-serif;font-size:18px;line-height:1.7;touch-action:manipulation}
button{font:inherit;cursor:pointer;touch-action:manipulation}
header{position:sticky;top:0;z-index:30;background:#12395f;color:#fff;padding:8px 12px 0}
header h1{font-size:19px;margin:0;line-height:1.4}
#cnt{font-size:15px;opacity:.92}
nav{display:flex;gap:6px;margin-top:6px}
nav button{flex:1;border:0;border-radius:10px 10px 0 0;background:#2a5a8c;color:#fff;font-size:16px;padding:9px 4px;min-height:44px}
nav button.on{background:#eef1f5;color:#12395f;font-weight:700}
.tab{display:none;padding:10px 0 90px}.tab.on{display:block}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px}
.tools button{border:1px solid #12395f;background:#fff;color:#12395f;border-radius:10px;padding:8px 12px;font-size:16px;min-height:44px}
#wrap{overflow-x:hidden}
#wrap.zoom{overflow-x:auto}
#wrap.zoom .pg{width:200%}
.pg{position:relative;width:100%;margin:0 0 8px;container-type:inline-size;direction:ltr;background:#fff}
.pg img{display:block;width:100%;height:auto}
.pg svg.arr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ul{position:absolute;height:3px;background:#f08c00;border-radius:2px;opacity:.9;pointer-events:none}
.ring{position:absolute;border:2px solid #f08c00;border-radius:7px;background:transparent;padding:0}
.ring::after{content:"";position:absolute;inset:-9px}
.ring.ok{border:2px solid #1f9d55;background:rgba(31,157,85,.08)}
.ul.wv{height:6px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 3 Q2.5 0 5 3 T10 3' fill='none' stroke='%23f08c00' stroke-width='1.6'/></svg>") repeat-x}
.ring .q{position:absolute;top:-14px;right:-9px;width:14px;height:14px;border-radius:50%;background:#f08c00;color:#fff;font:700 10px/14px sans-serif;text-align:center;pointer-events:none}
.ring.ok .q{background:#1f9d55}
.sol{position:absolute;color:#12703c;background:#e7f7ee;border:1px solid #1f9d55;border-radius:5px;font-weight:700;font-size:max(10px,2.5cqw);line-height:1.25;padding:0 4px;white-space:nowrap;direction:rtl;pointer-events:none;transform:translate(-50%,0)}
.hint{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:transparent;padding:0}
.hint i{display:block;width:30px;height:30px;margin:7px;border-radius:50%;font-style:normal;font-size:17px;line-height:30px;text-align:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.hint.o i{background:#f08c00}.hint.b i{background:#2b7de9}
.err{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:transparent;padding:0}
.err i{display:block;width:26px;height:26px;margin:9px;border-radius:50%;background:#d63031;color:#fff;font:700 17px/26px sans-serif;text-align:center;border:2px solid #fff;font-style:normal}
.eb{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:transparent;padding:0}
.eb i{display:block;width:30px;height:30px;margin:7px;border-radius:50%;background:#f08c00;color:#fff;font:700 18px/30px sans-serif;text-align:center;border:2px solid #fff;font-style:normal}
.eb.ok i{background:#1f9d55}
.flash{position:absolute;border:3px solid #d63031;border-radius:6px;pointer-events:none;animation:fl 1.6s ease-out forwards}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;opacity:.8}}
.card{background:#fff;border-radius:14px;margin:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card h3{margin:0 0 6px;font-size:19px;color:#12395f}
.tag{display:inline-block;font-size:14px;border-radius:12px;padding:1px 10px;margin:0 0 6px 6px;background:#fdecc8;color:#7a4b00}
.tag.mine{background:#ece3fb;color:#4b2a8a}
.tag.t{background:#ffe3b8}
.tag.b{background:#d9e8ff;color:#12395f}
.tag.red{background:#ffd9d9;color:#8a1111}
.btn{border:1px solid #12395f;background:#fff;color:#12395f;border-radius:10px;padding:8px 14px;font-size:16px;min-height:44px;margin:4px 0 4px 6px}
.btn.pri{background:#12395f;color:#fff}
.btn.g{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.sel{outline:3px solid #f08c00}
.btn[disabled]{opacity:.45}
.mine-box{background:#f4efff;border:1px dashed #7a4fd0;border-radius:10px;padding:8px 10px;margin:8px 0}
.req{font-size:21px;line-height:2;padding:4px 2px}
.hid{display:inline-block;min-width:34px;border-bottom:2px solid #2b7de9;color:transparent;user-select:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid #12395f;background:#fff;border-radius:10px;padding:6px 10px;font-size:18px;min-height:44px}
.chip.used{opacity:.3}
.chip.bad{background:#ffd9d9;border-color:#d63031}
.chip.good{background:#d4f3e0;border-color:#1f9d55}
.ans{width:100%;font:inherit;font-size:18px;padding:8px;border:2px solid #9bb3cc;border-radius:10px;min-height:48px;direction:rtl}
.ok{color:#12703c}.no{color:#b32020}
.fb{margin:8px 0;padding:8px 10px;border-radius:10px;background:#f1f5f9}
.fb.ok{background:#e0f6e9;color:#12703c}.fb.no{background:#fde4e4;color:#8a1111}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;z-index:51;padding:14px 14px 28px;display:none;box-shadow:0 -4px 16px rgba(0,0,0,.3)}
#sheet h3{margin:0 0 6px;font-size:19px;color:#12395f}
.src{font-size:14px;color:#556;margin:2px 0 8px}
table.kw{width:100%;border-collapse:collapse;font-size:17px}
table.kw td{border-bottom:1px solid #dde4ec;padding:6px 4px;vertical-align:top}
table.kw td:first-child{font-weight:700;color:#12395f;white-space:nowrap;padding-left:10px}
ol.tl{padding-right:22px;margin:6px 0}
.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #e3e8ee;padding:4px 0;font-size:17px}
@media (min-width:700px){.tab>*{max-width:760px;margin-left:auto;margin-right:auto}#wrap{max-width:900px;margin:auto}}
</style>
</head>

   const pa=document.createElementNS(ns,'path');pa.setAttribute('d','M0,0 L6,3 L0,6 z');pa.setAttribute('fill',c==='o'?'#f08c00':'#2b7de9');m.appendChild(pa);defs.appendChild(m)});svg.appendChild(defs);
  D.hints.filter(h=>h.pg===i).forEach(h=>{const pl=document.createElementNS(ns,'polyline');pl.setAttribute('points',h.path.map(q=>q[0]+','+q[1]).join(' '));pl.setAttribute('fill','none');

   else if(m.k==='hl'){const pl=document.createElementNS(ns,'path');let d='M'+m.x0+' '+m.y;for(let x=m.x0+10,j=0;x<m.x1;x+=10,j++)d+=' L'+x+' '+(m.y+Math.sin(x*0.21+m.x0)*0.9);d+=' L'+m.x1+' '+(m.y-0.4);if(m.cap)d+=' M'+m.x1+' '+m.y+' q 7 0 8 -9';

   else if(m.k==='note'){const t=document.createElementNS(ns,'text');t.setAttribute('x',m.x);t.setAttribute('y',m.y);t.setAttribute('fill','#c25e00');t.setAttribute('font-size',m.fs||17);t.setAttribute('font-style','italic');t.setAttribute('font-family','Noteworthy,"Bradley Hand","Segoe Script","Geeza Pro",cursive');t.setAttribute('direction','rtl');t.setAttribute('text-anchor','middle');t.setAttribute('transform','rotate('+(m.r||-6)+' '+m.x+' '+m.y+')');t.textContent=m.t;svg.appendChild(t);

  D.items.filter(x=>x.pg===i&&x.badge).forEach(it=>{const b=el('button','eb');b.id='eb_'+it.id;b.appendChild(el('i',null,'؟'));b.style.left=px(it.badge[0]);b.style.top=py(it.badge[1]);b.onclick=()=>openGroup(it.grp);pg.appendChild(b)});

  D.errs.filter(e=>e.pg===i).forEach(e=>{const b=el('button','err');b.appendChild(el('i',null,'!'));b.style.left=px(e.ic[0]);b.style.top=py(e.ic[1]);b.onclick=()=>openSheet(sh=>{sh.appendChild(el('h3',null,S.errTitle));sh.appendChild(el('div','tag red',e.kind));sh.appendChild(el('div',null,e.t));const m=el('div','mine-box',S.mine);sh.appendChild(m);closeBtn(sh)});pg.appendChild(b);
   if(e.box){const r=el('div');r.style.cssText='position:absolute;border:2px dotted #d63031;border-radius:5px;pointer-events:none;left:'+px(e.box[0]-1)+';top:'+py(e.box[1]+2)+';width:'+((e.box[2]-e.box[0]+2)/PW*100)+'%;height:'+((e.box[3]-e.box[1]-4)/PH*100)+'%';pg.appendChild(r)}});
  w.appendChild(pg);PGEL.push(pg)});

$('tb1').onclick=()=>tab(1);$('tb2').onclick=()=>tab(2);$('tb3').onclick=()=>tab(3);

 const f=el('div','flash');f.style.left='3%';f.style.width='94%';f.style.top=py(Math.max(0,y-14));f.style.height=(32/PH*100)+'%';e.appendChild(f);setTimeout(()=>f.remove(),1800)},50)}
/* ---------- learn ---------- */
function hideText(text,lv){const w=text.split(' ');if(lv===0)return null;return w.map((x,i)=>{const hide=lv===1?i%4===3:lv===2?i%2===1:true;
  if(lv===3)return x.charAt(0)+'…';if(lv===4||hide)return '\u0000'+x;return x})}
function renderHide(box,text,lv){box.textContent='';if(lv===0){box.textContent=text;return}
 const w=text.split(' ');w.forEach((x,i)=>{let hide=lv===1?i%4===3:lv===2?i%2===1:lv>=3;let s;
  if(lv===3){s=el('span',null,x.charAt(0)+'… ');box.appendChild(s);return}
  if(hide){s=el('span','hid',x);box.appendChild(s);box.appendChild(document.createTextNode(' '))}else{box.appendChild(document.createTextNode(x+' '))}})}
function reqCard(c){const card=el('div','card');card.appendChild(el('h3',null,c.title));card.appendChild(el('span','tag t',S.teacherReq));if(c.note)card.appendChild(el('span','tag red',c.note));
 card.appendChild(el('div','src',c.src));
 c.texts.forEach((t,ti)=>{const key=c.id+'_'+ti;st.lvl[key]=st.lvl[key]||0;const row=el('div');if(c.texts.length>1)row.appendChild(el('div','src',ad(ti+1)+'.'));
  const box=el('div','req');row.appendChild(box);renderHide(box,t,st.lvl[key]);
  const mo=el('button','btn',S.hideMore),le=el('button','btn',S.showMore),bs=el('button','btn',S.build),kn=el('button','btn g',S.know),ag=el('button','btn',S.again);
  mo.onclick=()=>{st.lvl[key]=Math.min(4,st.lvl[key]+1);renderHide(box,t,st.lvl[key])};le.onclick=()=>{st.lvl[key]=Math.max(0,st.lvl[key]-1);renderHide(box,t,st.lvl[key])};
  bs.onclick=()=>buildSentence(t);kn.onclick=()=>{st.know[key]=true;kn.classList.add('sel');upd2()};ag.onclick=()=>{st.know[key]=false;st.lvl[key]=0;renderHide(box,t,0);kn.classList.remove('sel');upd2()};
  [mo,le,bs,kn,ag].forEach(b=>row.appendChild(b));card.appendChild(row)});
 if(c.pg!=null){const g=el('button','btn',S.openBook);g.onclick=()=>gotoPg(c.pg,c.y);card.appendChild(g)}
 return card}
function upd2(){const n=Object.values(st.know).filter(Boolean).length;const e=$('kn');if(e)e.textContent=S.knowCount+' '+ad(n)}
function buildSentence(t){const w=t.split(' ');const sh=w.map((x,i)=>({x:x,i:i}));const mix=sh.slice(2).concat(sh.slice(0,2)).reverse();
 openSheet(box=>{box.appendChild(el('h3',null,S.build));const out=el('div','req');out.style.minHeight='56px';out.style.borderBottom='2px solid #9bb3cc';box.appendChild(out);const chips=el('div','chips');let next=0;const fb=el('div');
  mix.forEach(m=>{const c=el('button','chip',m.x);c.onclick=()=>{if(c.classList.contains('used'))return;if(m.x===w[next]||nz(m.x)===nz(w[next])){c.classList.add('used');out.textContent=(out.textContent+' '+m.x).trim();next++;if(next===w.length){fb.textContent='';fb.appendChild(el('div','fb ok',S.right))}}else{c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),600);fb.textContent='';fb.appendChild(el('div','fb no',S.wrong))}};chips.appendChild(c)});
  box.appendChild(chips);box.appendChild(fb);closeBtn(box)})}
function whyCard(c){const card=el('div','card');card.appendChild(el('h3',null,c.title));card.appendChild(el('span','tag mine',S.mine));card.appendChild(el('div',null,c.q));
 const ta=el('textarea','ans');ta.rows=3;ta.setAttribute('dir','rtl');card.appendChild(ta);const out=el('div');
 const b=el('button','btn pri',S.reveal);b.onclick=()=>{out.textContent='';if(!nz(ta.value)){out.appendChild(el('div','fb no',S.writeFirst));return}
  const m=el('div','fb ok',S.pageAnswer+': '+c.a);out.appendChild(m);const n=score(ta.value,c.groups||[]);if(c.groups&&c.groups.length){out.appendChild(el('div','fb',n===c.groups.length?S.close_enough:S.compare))}};
 card.appendChild(b);card.appendChild(out);if(c.src)card.appendChild(el('div','src',c.src));return card}

 card.appendChild(chips);card.appendChild(fb);return card}
function buildLearn(){const L=$('learn');L.textContent='';
 D.lessons.forEach((ls,li)=>{const hd=el('div','card');hd.appendChild(el('h3',null,ls.name));L.appendChild(hd);
 const w=ls.warm;const wc=el('div','card');wc.appendChild(el('h3',null,S.warmT));wc.appendChild(el('span','tag mine',S.mine));wc.appendChild(el('div',null,S.warmI));

 const c1=el('div','card');c1.appendChild(el('h3',null,S.progress));[[S.task,ad(D.items.filter(i=>st.ok[i.id]).length)+' / '+ad(D.items.length)],[S.solvedBy,ad(D.items.filter(i=>st.solved[i.id]).length)],[S.sureRight,ad(st.conf.filter(c=>c.sure&&c.ok).length)],[S.sureWrong,ad(st.conf.filter(c=>c.sure&&!c.ok).length)]].forEach(r=>{const x=el('div','row');x.appendChild(el('span',null,r[0]));x.appendChild(el('b',null,r[1]));c1.appendChild(x)});M.appendChild(c1);

 sb.forEach(c=>{if(seen[c.id])return;seen[c.id]=1;const it=D.items.find(i=>i.id===c.id);const x=el('div','row');x.appendChild(el('span',null,it.short));const b=el('button','btn',S.openItem);b.onclick=()=>openItem(it.id);x.appendChild(b);c2.appendChild(x)});M.appendChild(c2);

 const c7=el('div','card');c7.appendChild(el('h3',null,S.revT));c7.appendChild(el('span','tag mine',S.mine));c7.appendChild(el('div',null,S.revI));
