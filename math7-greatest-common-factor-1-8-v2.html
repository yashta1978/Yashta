<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<title>1-8 Greatest Common Factor (GCF) - pp. 36-39</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef1f5;color:#1b2430;font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input,textarea{font-family:inherit}
header{position:sticky;top:0;z-index:20;background:#0f3d6e;color:#fff;padding:8px 10px 0}
header h1{font-size:16px;margin:0 0 4px;font-weight:700}
#counter{font-size:14px;margin:0 0 6px;opacity:.95}
.tabs{display:flex;gap:6px}
.tab{flex:1;min-height:44px;border:0;border-radius:10px 10px 0 0;background:#2b5f93;color:#fff;font-size:16px;font-weight:600}
.tab.on{background:#eef1f5;color:#0f3d6e}
.panel{display:none;padding:8px 8px 300px}
.panel.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.btn{min-height:44px;padding:0 14px;border:1px solid #2b5f93;background:#fff;color:#0f3d6e;border-radius:10px;font-size:16px;font-weight:600}
.btn.pri{background:#0f3d6e;color:#fff}
.btn:disabled{opacity:.5}
.pagewrap{overflow-x:auto;background:#fff;border-radius:6px;border:1px solid #cfd6df}
.page{position:relative;width:100%;container-type:inline-size;border-bottom:3px solid #cfd6df}
.pagewrap.zoom .page{width:250%}
.page img{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none}
.zone{position:absolute;background:transparent;border:0;border-bottom:2px dotted rgba(26,115,232,.55);padding:0;margin:0;cursor:pointer;border-radius:3px}
.zone.bad{animation:flash .3s 1;background:rgba(220,40,40,.28)}
@keyframes flash{from{background:rgba(220,40,40,.55)}to{background:rgba(220,40,40,0)}}
@media (prefers-reduced-motion:reduce){.zone.bad{animation:none}}
.sol{white-space:pre;position:absolute;font-weight:700;color:#0d7a35;font-size:max(7px,1.5cqw);line-height:1;pointer-events:none;transform:translateY(-50%)}
.sol.sm{font-size:max(6px,1.3cqw)}
.sol.mn{color:#7b3fc4}
.ring{position:absolute;width:3.6cqw;height:3.6cqw;border:2px solid #0d7a35;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.hint-ic{position:absolute;min-width:44px;min-height:44px;width:max(44px,4cqw);height:max(44px,4cqw);transform:translate(-50%,-50%);border:2px solid #1a73e8;background:#e8f1ff;border-radius:50%;font-size:max(20px,2.2cqw);line-height:1;padding:0}
svg.ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.guide{background:#fff;border:1px solid #cfd6df;border-radius:10px;padding:10px;margin:0 0 8px}
.guide p{margin:0 0 8px;font-size:17px;line-height:1.4}
.tlist{display:none;margin-top:6px}
.tlist.on{display:block}
.trow{display:block;width:100%;text-align:left;min-height:48px;margin:5px 0;border:1px solid #9fb2c8;background:#f3f6fa;border-radius:10px;font-size:15px;padding:6px 10px;line-height:1.3}
.trow b{color:#0f3d6e}
.tag{display:inline-block;min-height:32px;padding:4px 10px;border:1px solid #7b3fc4;background:#f3ecfb;color:#5a2a9a;border-radius:8px;font-size:14px;font-weight:700}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid #0f3d6e;box-shadow:0 -4px 16px rgba(0,0,0,.2);padding:10px 12px calc(12px + env(safe-area-inset-bottom));max-height:62vh;overflow:auto;display:none}
#sheet.on{display:block}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.sh-head b{font-size:17px}
#shPrompt{font-size:16px;margin:4px 0 8px;line-height:1.35}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.flab{font-size:15px;font-weight:600;margin:6px 0 2px}
input[type=text],textarea{flex:1;min-width:140px;min-height:48px;font-size:18px;padding:6px 10px;border:2px solid #9fb2c8;border-radius:10px;width:100%}
textarea{min-height:90px}
input.ok{border-color:#0d7a35;background:#e7f6ec}
input.no{border-color:#c62828;background:#fdeaea}
.key{min-width:48px;min-height:48px;font-size:20px;border:1px solid #9fb2c8;background:#f3f6fa;border-radius:10px}
#shMsg{min-height:24px;font-size:16px;margin:6px 0;line-height:1.35}
#shMsg.ok{color:#0d7a35;font-weight:700}
#shMsg.no{color:#b3261e}
#shMsg.info{color:#0f3d6e}
.mine{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:#8a4fd1;border-radius:6px;padding:2px 8px;margin-left:6px}
.warnbox{background:#fff3e0;border:1px solid #c25e00;color:#7a3d00;border-radius:8px;padding:6px 10px;font-size:15px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin:6px 0 14px}
.gb{min-height:50px;border:1px solid #9fb2c8;background:#fff;border-radius:8px;font-size:16px;font-weight:700;color:#0f3d6e;line-height:1.1;padding:2px}
.gb small{display:block;font-size:11px;font-weight:600;color:#5a2a9a}
.gb.done{background:#d9f2e1;border-color:#0d7a35;color:#0d7a35}
.gb.rev{background:#fff0d9;border-color:#c25e00;color:#8a4500}
h2{font-size:18px;margin:12px 0 6px;color:#0f3d6e}
.card{background:#fff;border:1px solid #cfd6df;border-radius:10px;padding:10px;margin:8px 0}
.card p{margin:0 0 8px;font-size:17px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;min-height:46px;margin:6px 0;border:2px solid #9fb2c8;background:#fff;border-radius:10px;font-size:17px;padding:6px 12px}
.opt.sel{border-color:#0f3d6e;background:#e8f1ff}
.opt.ok{border-color:#0d7a35;background:#e7f6ec}
.opt.no{border-color:#c62828;background:#fdeaea}
.fb{font-size:16px;margin-top:6px;line-height:1.35}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:16px;line-height:1.35}
.chk input{width:24px;height:24px;margin-top:2px;flex:none}
#pop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#pop.on{display:flex}
#pop .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:16px;border-top:6px solid #1a73e8;max-height:84vh;overflow:auto}
#wk{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;border-top:5px solid #7b3fc4;box-shadow:0 -4px 16px rgba(0,0,0,.25);padding:10px 12px calc(12px + env(safe-area-inset-bottom));max-height:52vh;overflow:auto;display:none}
#wk.on{display:block}
#wkQ{font-size:15px;margin:0 0 6px;line-height:1.35;color:#1b2430}
.pill{pointer-events:auto;border:0;font-family:inherit;position:absolute;transform:translateY(-50%);color:#fff;font-weight:700;border-radius:4px;padding:1px 3px;line-height:1.2;white-space:nowrap;font-size:max(5px,.95cqw);cursor:pointer;padding:0 2px}
.pill.rep{pointer-events:auto;border:0;font-family:inherit;box-shadow:0 0 0 1.5px #fff,0 0 0 3.5px var(--c)}
.pill::after{content:'';position:absolute;left:-4px;right:-4px;top:-6px;bottom:-6px}
.pill.rep::after{content:'';position:absolute;left:-10px;right:-10px;top:-14px;bottom:-14px}
.zone.rep{outline:2px solid var(--c);background:rgba(255,255,255,0)}
.zone.hl{box-shadow:0 0 0 4px var(--c)}
#pop h3,#wk h3{margin:0 0 8px;font-size:19px;color:#0b4aa8}
#pop p{font-size:17px;line-height:1.45;margin:0 0 10px}
.stp{margin:0 0 10px;padding:8px 10px;border-radius:8px;background:#f3f6fa;font-size:17px;line-height:1.4}
.stp i{display:block;font-size:15px;color:#4a5a6e;margin-top:4px}
.stp.cur{background:#e8f1ff;border:1px solid #1a73e8}
.pcount{font-size:14px;color:#4a5a6e;margin:0 0 6px}
</style>

  ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);ln.setAttribute('x2',bx);ln.setAttribute('y2',by);

// ---------- sheet ----------
var cur=null,inputs={};
var sheet=document.getElementById('sheet'),shMsg=document.getElementById('shMsg');
function setMsg(t,c){shMsg.textContent=t;shMsg.className=c||''}
function isChoiceOnly(e){return e.fields.length===1&&e.fields[0].kind==='choice'}
function openSheet(n){
  cur=byN(n);var s=S[n];inputs={};
  document.getElementById('shTitle').textContent='Exercise '+n;
  var tb=document.getElementById('shType');tb.textContent='Type '+cur.type;tb.onclick=function(){openEx(cur.n)};
  document.getElementById('shPrompt').textContent=cur.prompt;
  var body=document.getElementById('shBody');body.textContent='';
  cur.fields.forEach(function(f){
    if(cur.fields.length>1||f.kind==='three'||f.kind==='open'){var lb=el('div','flab',body);lb.textContent=f.label}
    if(f.kind==='choice'){
      var box=el('div','',body);inputs[f.id]={kind:'choice',btns:[]};
      f.opts.forEach(function(t,k){var b=el('button','opt',box);b.type='button';b.textContent=t;
        if(s.sel[f.id]===k)b.classList.add('sel');
        b.addEventListener('click',function(){if(s.done||s.rev)return;s.sel[f.id]=k;inputs[f.id].btns.forEach(function(x,j){x.classList.toggle('sel',j===k);x.classList.remove('no')});if(isChoiceOnly(cur))checkCur()});
        inputs[f.id].btns.push(b)});
      if(f.note){var w=el('div','warnbox',body);w.textContent=f.note}
    }else if(f.kind==='open'){
      var ta=el('textarea','',body);ta.setAttribute('aria-label','Your explanation');ta.value=s.vals[f.id]||'';inputs[f.id]={kind:'open',ta:ta,boxes:[]};
      var mb=el('span','mine',body);mb.textContent='Mine, not from the book';
      f.checks.forEach(function(t,k){var r=el('label','chk',body);var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!s.chk[k];cb.addEventListener('change',function(){s.chk[k]=cb.checked});r.appendChild(cb);r.appendChild(document.createTextNode(t));inputs[f.id].boxes.push(cb)});
    }else{
      var r=el('div','row',body);
      var inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;
      inp.setAttribute('inputmode',(f.kind==='num')?'numeric':'text');inp.setAttribute('aria-label',f.label||'Your answer');inp.value=s.vals[f.id]||'';
      r.appendChild(inp);inputs[f.id]={kind:f.kind,inp:inp};
      if(f.kind==='fact'){['×','^'].forEach(function(k){var b=el('button','key',r);b.type='button';b.textContent=k;b.setAttribute('aria-label','Insert '+k);
        b.addEventListener('click',function(){var a=inp.selectionStart==null?inp.value.length:inp.selectionStart,z=inp.selectionEnd==null?a:inp.selectionEnd;inp.value=inp.value.slice(0,a)+k+inp.value.slice(z);inp.focus();var q=a+1;try{inp.setSelectionRange(q,q)}catch(x){}})})}
      if(f.kind==='three'){inp.placeholder='e.g. 4, 9, 25'}

function showAnswerMsg(){var s=S[cur.n];setMsg((s.done&&!s.rev?'Correct! ':'Answer: ')+cur.show,s.done&&!s.rev?'ok':'info')}
function levelHint(e,w){
  var t=typeOf(e.type);
  if(w===1)return (e.type>=9?'This is a Spiral Review exercise. ':'')+'Not correct yet. Re-read the exercise on the page, then try again.';
  if(w===2)return t.h2+' (Press the Type '+e.type+' tag to see the worked example.)';
  return 'Last try, then press \u{1F441} Show answer to see the solution.';
}
function evalField(e,f,raw,s){
  var i;
  if(f.kind==='num'){
    var x=parseInt0(raw);if(x===null)return {ok:false,msg:'Type a whole number.'};
    if(x===f.v)return {ok:true};
    if(f.of&&x>0){
      for(i=0;i<f.of.length;i++){if(f.of[i]%x!==0)return {ok:false,msg:x+' is not a factor of '+fmt(f.of[i])+', so it is not a common factor.'}}
      if(x<f.v)return {ok:false,msg:x+' is a common factor, but it is not the greatest one.'};
    }
    return {ok:false,msg:''};
  }
  if(f.kind==='fact'){
    var p=parseExpr(raw);if(!p)return {ok:false,msg:'Write it like 2 × 2 × 3 or 2² × 3. Use the × and ^ keys.'};
    var ff=expandF(p),bad=null;for(i=0;i<ff.length;i++){if(!isPrime(ff[i])){bad=ff[i];break}}
    if(bad!==null)return {ok:false,msg:(bad<2?'1 is not a prime number':bad+' is not prime yet')+'. Keep factoring it.'};
    var pr=product(p);if(pr!==f.v)return {ok:false,msg:'Your factors multiply to '+fmt(pr)+', not '+fmt(f.v)+'.'};
    return {ok:true};
  }
  if(f.kind==='choice'){
    var k=s.sel[f.id];if(k===undefined)return {ok:false,msg:'Choose an answer.'};
    if(k===f.a)return {ok:true};
    return {ok:false,msg:f.wrong||''};
  }
  if(f.kind==='three'){
    var nums=toLatin(raw).split(/[^0-9]+/).filter(function(t){return t.length}).map(function(t){return parseInt(t,10)});
    if(nums.length!==3)return {ok:false,msg:'Type exactly three numbers separated by commas.'};
    if(nums[0]===nums[1]||nums[1]===nums[2]||nums[0]===nums[2])return {ok:false,msg:'The three numbers must be different.'};
    for(i=0;i<3;i++){if(nums[i]<4||isPrime(nums[i]))return {ok:false,msg:nums[i]+' is not a composite number (a composite number has a factor other than 1 and itself).'}}
    var g=gcd(gcd(nums[0],nums[1]),nums[2]);
    if(g!==1)return {ok:false,msg:'These numbers have a common factor of '+g+', so the GCF is '+g+', not 1. Choose numbers with no prime factor in common.'};
    return {ok:true};
  }
  return {ok:false,msg:''};
}
function mark(n){var z=document.getElementById('z'+n);z.classList.remove('bad');void z.offsetWidth;z.classList.add('bad');setTimeout(function(){z.classList.remove('bad')},400)}
function checkCur(){
  var e=cur,s=S[e.n];
  if(s.done||s.rev){showAnswerMsg();return}
  if(e.fields[0].kind==='open'){
    var f0=e.fields[0],io=inputs[f0.id];s.vals[f0.id]=io.ta.value;
    var all=io.boxes.every(function(b){return b.checked});
    if(!io.ta.value.trim()){setMsg('Write your explanation first.','no');return}
    if(!all){setMsg('Tick every point in the self-check list when your explanation covers it.','no');return}
    s.done=true;setMsg('Self-check complete. '+e.show,'ok');paint(e.n);updCounter();return;
  }
  var msgs=[],allOk=true;
  e.fields.forEach(function(f){
    var io=inputs[f.id],raw=io.inp?io.inp.value:'';if(io.inp)s.vals[f.id]=raw;
    var r=evalField(e,f,raw,s);
    if(io.inp)io.inp.className=r.ok?'ok':'no';
    if(io.kind==='choice'){io.btns.forEach(function(b,j){b.classList.remove('no','ok');if(s.sel[f.id]===j)b.classList.add(r.ok?'ok':'no')})}
    if(!r.ok){allOk=false;if(r.msg)msgs.push((e.fields.length>1?f.label+': ':'')+r.msg);else if(e.fields.length>1)msgs.push(f.label+': not correct yet.')}
  });
  if(allOk){s.done=true;setMsg('Correct! '+e.show,'ok');paint(e.n);updCounter();return}
  s.wrong++;mark(e.n);
  var h=levelHint(e,Math.min(s.wrong,3));
  setMsg(msgs.length?msgs.join(' ')+(s.wrong>=2?' '+h:''):h,'no');
}

var qDone={},qOk=0;

(function(){
  var L=document.getElementById('qList');qUpd();

        b.addEventListener('click',function(){if(qDone[i])return;var ok=(k===q.a);b.classList.add(ok?'ok':'no');if(!ok)btns[q.a].classList.add('ok');finish(ok)});btns.push(b)});
    }else{
      var r=el('div','row',c);var t=document.createElement('input');t.type='text';t.setAttribute('inputmode','numeric');t.setAttribute('aria-label','Your answer');r.appendChild(t);
      var b=el('button','btn pri',r);b.type='button';b.textContent='Check';

    }

  });
})();
