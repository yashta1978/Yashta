var EX=[{"n": 44, "type": 7, "lab": "Think and Discuss 1", "prompt": "Think and Discuss 1: write each expression in another way. (a) 12x   (b) 4/y   (c) 3xy/2", "fields": [{"id": "a", "kind": "expr", "v": "12×x", "alts": ["12(x)", "12*x"], "label": "a) 12x"}, {"id": "b", "kind": "expr", "v": "4÷y", "alts": ["4/y"], "label": "b) 4/y"}, {"id": "c", "kind": "expr", "v": "3×x×y÷2", "alts": ["3xy÷2"], "label": "c) 3xy/2"}], "show": "a) 12 × x, or 12(x)   b) 4 ÷ y   c) 3 × x × y ÷ 2", "count": true, "steps": [{"t": "Use the table on page 51. Multiplication of variables: 7t = 7 × t = 7(t). So 12x = ⟦12 × x⟧ = 12(x).", "why": "A number next to a letter means multiply."}, {"t": "Division: q/2 and q ÷ r are the same idea. A fraction bar means divide. So 4/y = ⟦4 ÷ y⟧.", "why": "Keep the order: the top number comes first."}, {"t": "Combine both: 3xy/2 means 3 × x × y, divided by 2. So 3xy/2 = ⟦3 × x × y ÷ 2⟧.", "why": "The top of the fraction is multiplied, then divided by the bottom."}], "sim": {"q": "Write 5k another way (use ×).", "t": ["5×k"]}, "chk": "Test by substituting x = 2 and y = 3: 12x = 24 and 12 × x = 24.", "mis": "Do not change the order of a division: 4/y is 4 ÷ y, not y ÷ 4.", "label": null, "pill": [932, 1315], "pg": 2, "zone": [329, 1296, 598, 38], "rep": true}, {"n": 45, "type": 8, "lab": "Think and Discuss 2", "prompt": "Think and Discuss 2: explain the difference between a variable and a constant.", "fields": [{"id": "a", "kind": "open", "label": "Your answer", "checks": ["Says a variable can change or vary", "Says a constant cannot change", "Gives an example"]}], "show": "A variable is a letter whose value can change (for example a in 1954 + a). A constant is a number whose value cannot change (for example 1954).", "count": true, "steps": [{"t": "A variable is a letter that represents a number that can vary (page 50).", "why": "Its value can change from one situation to another."}, {"t": "A constant is a number that cannot change. In 1954 + a, the year 1 // ---------- answer checking (by value) ----------
function normS(s){return toLatin(s).toLowerCase().replace(/\s+/g,'').replace(/[·*]/g,'×').replace(/\//g,'÷')}
function tokK(q){var m=q.replace(/[×()]/g,'').match(/\d+|[a-z]/g)||[];return m.slice().sort().join(',')}
function exprKey(s){s=normS(s);if(/[^0-9a-z×÷()]/.test(s))return null;var p=s.split('÷');if(p.length>2)return null;var a=tokK(p[0]),b=p.length>1?tokK(p[1]):'';if(!a)return null;return a+'|'+b}
function facParse(s){s=normS(s).replace(/[()]/g,'');if(!s)return null;var p=s.split('×'),nums=[],lets=[];for(var i=0;i<p.length;i++){if(/^\d+$/.test(p[i]))nums.push(parseInt(p[i],10));else if(/^[a-z]$/.test(p[i]))lets.push(p[i]);else return null}return {nums:nums.sort(function(a,b){return a-b}),lets:lets.sort()}}
function isPrimeN(n){if(n<2)return false;for(var d=2;d*d<=n;d++)if(n%d===0)return false;return true}
function pfParse(raw){var s=toLatin(raw).replace(/\s+/g,'').replace(/[·*xX]/g,'×').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,function(r){return '^'+r.split('').map(function(c){return SUP[c]}).join('')});if(!s)return null;var out=[],ps=s.split('×');for(var i=0;i<ps.length;i++){var m=/^(\d+)(?:\^(\d+))?$/.exec(ps[i]);if(!m)return null;var b=parseInt(m[1],10),e=m[2]?parseInt(m[2],10):1;if(e<1||e>20)return null;for(var j=0;j<e;j++)out.push(b)}return out.sort(function(a,b){return a-b})}
function intParse(raw){var s=toLatin(raw).replace(/\s+/g,'').replace(/[−–—]/g,'-');if(!/^-?\d{1,9}$/.test(s))return null;return parseInt(s,10)}
function simOk(e,raw){
  var t=e.sim.t;if(!t)return null;
  if(e.n===26){var a=facParse(raw),b=facParse(t[0]);return !!a&&a.nums.join()===b.nums.join()&&a.lets.join()===b.lets.join()}
  if(e.n>=35&&e.n<=38){var p=pfParse(raw);return !!p&&p.join()===pfParse(t[0]).join()}
  var k=exprKey(raw);return k!==null&&k===exprKey(t[0]);
}
function evalField(f,raw,sel){
  var i;
  if(f.kind==='int'){var z=intParse(raw);if(z===null)return {ok:false,msg:'Type a whole number. Use the − key for a negative number.'};return z===f.v?{ok:true}:{ok:false,msg:z===-f.v?'The size is right, but check the sign: is the result positive or negative?':''}}
  if(f.kind==='expr'){var k=exprKey(raw);if(k===null)return {ok:false,msg:'Write it with × and ÷ signs, for example 3 × x ÷ 2.'};var good=[f.v].concat(f.alts||[]).some(function(a){return exprKey(a)===k});return good?{ok:true}:{ok:false,msg:''}}
  if(f.kind==='fac'){var fp=facParse(raw),fv=facParse(f.v);if(!fp)return {ok:false,msg:'Write the factors with × between them, for example 2 × 3 × a × a.'};
    var prod=fp.nums.reduce(function(a,b){return a*b},1),want=fv.nums.reduce(function(a,b){return a*b},1);
    if(fp.lets.join()===fv.lets.join()&&prod===want){if(fp.nums.every(isPrimeN))return {ok:true};return {ok:false,msg:'Break the number into prime factors, like 6 = 2 × 3.'}}
    if(fp.lets.join()!==fv.lets.join())return {ok:false,msg:'Check the letters: c³ means c × c × c, and d² means d × d.'};return {ok:false,msg:''}}
  if(f.kind==='pf'){var pp=pfParse(raw);if(!pp)return {ok:false,msg:'Write the primes with × between them, for example 2 × 3 × 3 or 2 × 3^2.'};
    if(pp.join()===f.v.join())return {ok:true};
    if(!pp.every(isPrimeN))return {ok:false,msg:'Every factor must be a prime number. Keep dividing the factors that are not prime.'};
    return {ok:false,msg:''}}
  if(f.kind==='num'){
    if(f.unit)raw=String(raw).replace(/[^\d]+$/,'');
    var x=parseInt0(raw);if(x===null)return {ok:false,msg:'Type a whole number'+(f.unit?' (the unit is not needed).':'.')};
    if(x===f.v)return {ok:true};
    var nr=f.near||[];for(i=0;i<nr.length;i++)if(nr[i].v===x)return {ok:false,msg:nr[i].msg};
    if(f.mode==='lcm'&&f.of){
      if(x<=0)return {ok:false,msg:'The LCM is a positive number.'};
      for(i=0;i<f.of.length;i++){if(x%f.of[i]!==0)return {ok:false,msg:fmt(x)+' is not a multiple of '+fmt(f.of[i])+', so it is not a common multiple.'}}
      if(x>f.v)return {ok:false,msg:fmt(x)+' is a common multiple, but it is not the least one.'};
    }
    return {ok:false,msg:''};
  }
  if(f.kind==='dec'){var d=parseDec(raw);if(d===null)return {ok:false,msg:'Type a number, for example 3.5.'};return Math.abs(d-f.v)<1e-9?{ok:true}:{ok:false,msg:''}}
  if(f.kind==='std'){var y=parseInt0(raw);if(y===null)return {ok:false,msg:'Type the ordinary number, with no powers of 10.'};return y===f.v?{ok:true}:{ok:false,msg:''}}
  if(f.kind==='sci'){
    var p=parseSci(raw);if(!p)return {ok:false,msg:'Write it like 3.4 × 10^2. Use the × and ^ keys.'};
    var val=p.m*Math.pow(10,p.e);var same=Math.abs(val-f.v)<=1e-9*Math.abs(f.v);
    if(same&&(p.m<1||p.m>=10))return {ok:false,msg:'The value is right, but the first number must be at least 1 and less than 10.'};
    return same?{ok:true}:{ok:false,msg:''};
  }
  if(f.kind==='choice'){if(sel===undefined)return {ok:false,msg:'Choose an answer.'};return sel===f.a?{ok:true}:{ok:false,msg:''}}
  return {ok:false,msg:''};
}

      inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')checkQ(c)});
      r2.appendChild(inp);c.inputs[f.id]={kind:f.kind,inp:inp};
      var KEYS={sci:['×','^'],expr:['×','÷','(',')'],fac:['×'],pf:['×','^'],int:['−']}[f.kind];
      if(KEYS){KEYS.forEach(function(k){var b=el('button','key',r2);b.type='button';b.textContent=k;b.setAttribute('aria-label','Insert '+k);b.addEventListener('click',function(){insertKey(inp,k)})})}
    }
  });
  var cfr=el('div','acts cf',tf);txt('span','note','How sure are you?',cfr);
  [['Sure','s'],['Not sure','n']].forEach(function(x){var b=txt('button','btn'+(s.conf===x[1]?' on':''),x[0],cfr);b.type='button';b.addEventListener('click',function(){if(s.done||s.rev)return;s.conf=(s.conf===x[1]?null:x[1]);Array.prototype.forEach.call(cfr.querySelectorAll('.btn'),function(bb){bb.classList.toggle('on',bb.textContent===(s.conf==='s'?'Sure':(s.conf==='n'?'Not sure':'')))})})});
  txt('span','mine','Mine, not from the book',cfr);
  c.msg=el('div','qmsg',tf);c.msg.setAttribute('role','status');
  var rw=el('div','row',tf);var cb1=txt('button','btn pri','Check',rw);cb1.addEventListener('click',function(){checkQ(c)});
  var cb2=txt('button','btn','\u{1F441} Show answer',rw);cb2.addEventListener('click',function(){revealQ(c)});
  if(s.done||s.rev)showAnswerMsg(c);
  // methods of this type
  var dt=el('details','altm',card);if(openM)dt.open=true;txt('summary','','Methods of this type ('+t.bk.length+' from the book, '+t.mn.length+' from me)',dt);
  if(t.bk.length){var bh=txt('b','','From the book',dt);bh.style.display='block';t.bk.forEach(function(x){txt('div','',x,dt)});(t.method||[]).forEach(function(x){var p=txt('p','',x,dt);p.style.fontSize='15px'})}
  var mh=txt('b','','Mine, not from the book',dt);mh.style.cssText='display:block;margin-top:6px;color:#b45309';t.mn.forEach(function(x){txt('div','',x,dt)});
  if(!t.bk.length)(t.method||[]).forEach(function(x){var p=txt('p','',x,dt);p.style.fontSize='15px'});
  // solution
  c.sol=el('div','solbox',card);renderSol(c);
  return c;
}

// =====================================================================
// LEARN: a walk through the book, question by question
// =====================================================================
var LQ=0,LST={},LSEEN={},LCHK={},EXAMDONE=false,BEST=null;
function typeCount(id){return EX.filter(function(x){return x.type===id}).length}
function posInType(n){var e=byN(n);return EX.filter(function(x){return x.type===e.type}).map(function(x){return x.n}).indexOf(n)+1}
function nSeen(){return Object.keys(LSEEN).length}
function secOf(n){for(var i=0;i<SECT.length;i++)if(SECT[i][2].indexOf(n)>-1)return SECT[i][0];return 'GP'}
function secName(g){for(var i=0;i<SECT.length;i++)if(SECT[i][0]===g)return SECT[i][1];return g}
function buildGrid(){
  var g=document.getElementById('exGrid');if(!g)return;g.textContent='';
  EX.forEach(function(e,i){var s=S[e.n],b=el('button','gb'+(LSEEN[e.n]?' done':'')+(i===LQ?' cur':''),g);b.type='button';b.appendChild(document.createTextNode(e.n));txt('small','','T'+e.type,b);b.setAttribute('aria-label','Question '+e.n+', Type '+e.type);
    b.addEventListener('click',function(){LQ=i;renderCard();buildGrid();var c=document.getElementById('lcard');window.scrollTo(0,Math.max(0,c.getBoundingClientRect().top+window.pageYOffset-130))})});
}
function buildLearn(){
  var h=$('#learn');h.textContent='';
  txt('h2','','Learn',h);
  txt('p','note','Follow the book question by question, from 1 to '+EX.length+'. Each card shows the question, its type, and the solution step by step.',h);
  var w=el('details','altm',h);w.id='warm';w.open=true;txt('summary','','Warm-up: what do you remember? (mine)',w);
  txt('p','note','Before you read, write what you already know. Mistakes are fine. This helps your memory more than reading again.',w);
  var WQ=[['What is a variable?',0],['What is a constant?',1],['What does it mean to evaluate an algebraic expression?',3]];
  WQ.forEach(function(q){txt('b','',q[0],w);var ta=el('textarea','',w);ta.setAttribute('aria-label',q[0]);ta.style.cssText='width:100%;min-height:54px;font-size:16px;margin:4px 0 8px'});
  var cr=el('div','row',w);txt('span','','How sure are you, from 0 to 100? ',cr);var ci=el('input','',cr);ci.type='text';ci.setAttribute('inputmode','numeric');ci.setAttribute('aria-label','Confidence from 0 to 100');ci.style.cssText='font-size:18px;width:70px;padding:6px;margin:0 6px';
  var wb=txt('button','btn pri','Show what the book says',w);wb.type='button';var wr=el('div','',w);
  wb.addEventListener('click',function(){wr.textContent='';
    var any=false;Array.prototype.forEach.call(w.querySelectorAll('textarea'),function(t){if(t.value.trim())any=true});
    if(!any){var m=txt('p','','Write something first, even a guess.',wr);m.style.color='#c62828';return}
    txt('p','note','Compare with your words. Fix what is missing or wrong.',wr);
    [0,1,2,3].forEach(function(i){var d=el('div','stp',wr);txt('b','',FACTS[i][0]+': ',d);d.appendChild(document.createTextNode(FACTS[i][1]))});
    var v=parseInt0(ci.value);if(v!==null&&v>=0&&v<=100){txt('p','note','You said '+v+'. After you compare, would you give a different number? Fix your notes, then start the questions below.',wr)}});
  txt('span','mine','Mine, not from the book',w);
  var pr=txt('p','cnt','',h);pr.id='lprog';
  var c=el('div','',h);c.id='lcard';
  txt('h2','','All questions',h);
  txt('p','note','Tap a number to jump to that question.',h);
  var g=el('div','grid',h);g.id='exGrid';
  renderCard();buildGrid();
}
function learnProg(){var p=document.getElementById('lprog');if(p)p.textContent='Questions walked through: '+nSeen()+' of '+EX.length}
function goQ(i){LQ=i;renderCard();buildGrid();var c=document.getElementById('lcard');window.scrollTo(0,Math.max(0,c.getBoundingClientRect().top+window.pageYOffset-130))}
function renderCard(){
  var host=document.getElementById('lcard');if(!host)return;host.textContent='';
  var e=EX[LQ],col=COL[e.type-1],n=e.n,N=EX.length;
  function nav(){var r=el('div','acts');var pv=txt('button','btn','Previous question',r);pv.disabled=LQ===0;pv.addEventListener('click',function(){goQ(LQ-1)});
    var nx=txt('button','btn pri',LQ===N-1?'Finish':'Next question',r);nx.addEventListener('click',function(){if(LQ===N-1){finishLearn()}else goQ(LQ+1)});return r}
  host.appendChild(nav());
  var card=el('div','fc',host);card.style.borderLeft='8px solid '+col;
  txt('div','cnt','Question '+(LQ+1)+' of '+N+'  •  '+nm(e)+'  •  '+secName(secOf(n)),card);
  var inner=el('div','',card);renderQ(inner,e,'learn',false);
  host.appendChild(nav());
  learnProg();
}
function finishLearn(){
  var host=document.getElementById('lcard');host.textContent='';
  var c=el('div','fc k',host);txt('div','term','You reached the end of the book questions',c);
  txt('p','',nSeen()===EX.length?'You walked through all '+EX.length+' questions. '+praise():'You walked through '+nSeen()+' of '+EX.length+' questions. Open the grid below to finish the rest.',c);
  var a=el('div','acts',c);var b1=txt('button','btn pri','Open Summary',a);b1.addEventListener('click',function(){tab(3);buildSum()});
  var b2=txt('button','btn','Back to question 1',a);b2.addEventListener('click',function(){goQ(0)});
}

var bvBody=document.getElementById('bvB');
function bvOn(){return document.getElementById('bv').classList.contains('on')}
function bvScroll(n){var z=document.getElementById('z'+n);var r=z.getBoundingClientRect(),c=bvBody.getBoundingClientRect();bvBody.scrollTop+=r.top-c.top-110}

function bvTitle(){var c=bvBody.getBoundingClientRect(),cur=1;[1,2,3,4].forEach(function(i){if(pages[i].el.getBoundingClientRect().top<=c.top+60)cur=i});document.getElementById('bvT').textContent='Book page '+(PG0+cur);return cur}
function bvPage(d){var cur=bvTitle(),nx=Math.min(4,Math.max(1,cur+d));var c=bvBody.getBoundingClientRect();bvBody.scrollTop+=pages[nx].el.getBoundingClientRect().top-c.top;setTimeout(bvTitle,60)}
bvBody.addEventListener('scroll',bvTitle);
document.getElementById('bvX').addEventListener('click',closeBV);
document.getElementById('bvP').addEventListener('click',function(){bvPage(-1)});
document.getElementById('bvN').addEventListener('click',function(){bvPage(1)});
document.getElementById('bvZ').addEventListener('click',function(){zoomed=!zoomed;wrap.classList.toggle('zoom',zoomed);this.textContent=zoomed?'Zoom out':'Zoom';document.getElementById('zoomB').textContent=zoomed?'Zoom out':'Zoom'});

function buildSum(){
  var h=$('#sum');h.textContent='';txt('h2','','Summary',h);
  var dn=0,ys=0;EX.forEach(function(e){var s=S[e.n];if(s.done||s.rev)dn++;if(s.done&&!s.rev)ys++});
  var pc=el('div','fc',h);txt('div','term','Your progress',pc);
  [['Exercises done',dn+' / '+TOTAL],['Solved yourself',String(ys)],['Questions walked through in Learn',nSeen()+' / '+EX.length],['Answered "Sure" and were right',String(CONF.sr||0)],['Answered "Sure" and were wrong',String(Object.keys(SBW).length)]].forEach(function(x){var r=el('div','cvr',pc);txt('span','',x[0],r);txt('b','',x[1],r)});
  var sb=Object.keys(SBW);
  if(sb.length){txt('h2','','Sure but wrong ('+sb.length+')',h);txt('p','note','You were sure, but the answer was wrong. These are the most important to fix. (Mine, not from the book)',h);
    sb.forEach(function(k){var b=txt('button','btn','See '+nm(byN(parseInt(k,10)))+' on the book page',h);b.style.margin='4px 6px 4px 0';b.addEventListener('click',function(){goEx(parseInt(k,10),true)})})}
  txt('h2','','Review plan (mine, not from the book)',h);
  txt('p','note','Coming back after a break helps you remember. Try 5 questions from memory each time, without looking at the solutions. Work days are Sunday to Thursday.',h);
  (function(){var d0=new Date(),offs=[1,3,7,14];offs.forEach(function(o){var d=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+o);while(d.getDay()===5||d.getDay()===6)d.setDate(d.getDate()+1);
      var dd=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();var r=el('div','cvr',h);txt('span','','Review '+(offs.indexOf(o)+1),r);txt('b','',dd,r)})})();
  txt('p','note','Everything important in one place. Read the facts, check the question types, then read the mistakes in the book.',h);
  txt('h2','','Key facts',h);
  var f=el('div','facts',h);FACTS.forEach(function(x){var d=el('div','',f);txt('b','',x[0]+': ',d);d.appendChild(document.createTextNode(x[1]));if(x[1].indexOf('Mine, not from the book')===0)txt('span','mine','Mine, not from the book',d)});
  txt('h2','','Question types ('+TYPES.length+')',h);
  TYPES.forEach(function(t){var d=el('div','fc',h);d.style.borderLeft='6px solid '+COL[t.id-1];txt('div','term','T'+t.id+': '+t.name,d);txt('p','',typeCount(t.id)+(typeCount(t.id)===1?' question':' questions')+': exercises '+t.ex+(t.mine?'. Main solution: mine, not from the book.':'. Main solution: method from the book.'),d);var ml2=txt('p','',methodsLine(t)+'.',d);ml2.style.fontWeight='700';t.bk.forEach(function(x){txt('div','','Book: '+x,d)});t.mn.forEach(function(x){var q=txt('div','','Mine: '+x,d);q.style.color='#b45309'});
    var b=txt('button','btn sm','See the steps (Exercise '+t.rep+')',d);b.addEventListener('click',function(){goEx(t.rep,true)})});
  txt('h2','','Mistakes in the book ('+MARKS.length+')',h);
  txt('p','note','Do not copy these mistakes. Each one is marked with a red or orange ! on its page. The book is not changed.',h);
  MARKS.forEach(function(m){var d=el('div','fc',h);txt('div','term',m.title,d);m.body.forEach(function(t){txt('p','',t,d)});txt('span','mine','Mine, not from the book',d);
    var b=txt('button','btn sm','Show on the book page',d);b.style.display='block';b.style.marginTop='8px';b.addEventListener('click',function(){goBook(m.pg,m.y-120)})});
  txt('h2','','Questions to ask the teacher ('+ASK.length+')',h);
