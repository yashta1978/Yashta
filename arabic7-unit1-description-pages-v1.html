<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آرا — الوحدة الأولى: الوصف — ص٢٩ و٣٢ وصورتان</title>
<style>
:root{--ink:#14181f;--muted:#4a5363;--line:#cfd5df;--bg:#eef0f4;--acc:#1f4fa8;--acc2:#e3ebfb;--ok:#137a3a;--okbg:#e2f4e8;--bad:#b3261e;--badbg:#fbe4e2;--warn:#a85a00;--warnbg:#fdf0dc}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Geeza Pro","Noto Naskh Arabic","Traditional Arabic",Tahoma,sans-serif;font-size:18px;line-height:1.7;padding-bottom:40px}
button,input,textarea{font:inherit;touch-action:manipulation}
button{cursor:pointer}
header.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--line);padding:6px 10px 6px}
.top h1{margin:0;font-size:18px;line-height:1.4}
.prog{font-size:16px;color:var(--muted);margin:2px 0}
.bar{height:8px;background:#e1e5ec;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
.tabs{display:flex;gap:8px;margin-top:6px}
.tabs button{flex:1;min-height:44px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;font-weight:700;font-size:18px}
.tabs button.on{background:var(--acc);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.b{min-height:44px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:4px 12px;font-size:16px;font-weight:700}
.b.main{background:var(--acc);color:#fff}
.b.on{background:var(--acc2)}
main{max-width:900px;margin:0 auto;padding:8px 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.phead b{font-size:17px}
.note{font-size:15px;color:var(--muted);margin:4px 0}
.ext{border:2px dashed var(--warn);background:var(--warnbg);border-radius:10px;padding:8px 10px;margin:4px 0 8px}
.ext textarea{width:100%;min-height:90px;font-size:18px;border:2px solid var(--line);border-radius:8px;padding:6px;background:#fff;color:var(--ink)}
.pgwrap{overflow-x:auto}
body.zoom .pg{min-width:900px}
.pg{position:relative;padding-right:max(48px,11%)}
.in{position:relative;container-type:inline-size;border-radius:8px;overflow:visible}
.in img{display:block;width:100%;height:auto;border-radius:8px;user-select:none;-webkit-user-select:none}
.in svg.ln{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.in svg.ln line{stroke:var(--ok);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round}
.fw{position:absolute}
.fw input{width:100%;height:100%;min-height:24px;border:2px dashed #7d93c4;border-radius:6px;background:rgba(255,255,255,.18);color:#0b2a6b;font-size:max(16px,3cqw);text-align:center;padding:0 4px;direction:rtl}
.fw input:focus{outline:2px solid var(--acc);background:rgba(255,255,255,.7)}
.fw.ok input{border:2px solid var(--ok);background:rgba(226,244,232,.8);color:var(--ok);font-weight:700}
.fw .tick{position:absolute;left:3px;top:50%;transform:translateY(-50%);color:var(--ok);font-size:max(16px,3cqw);font-weight:700;pointer-events:none}
.fw.show input{display:none}
.sol{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.93);border:2px solid var(--ok);border-radius:6px;color:var(--ok);font-weight:700;font-size:max(16px,3cqw);padding:0 4px;white-space:nowrap;overflow:hidden}
.sol.warn{border-color:var(--warn);color:var(--warn)}
.fw.show .sol{display:flex}
.fw.ok.show .sol{display:flex}
.msg{position:absolute;left:0;right:0;top:100%;z-index:6;font-size:15px;line-height:1.4;background:#fff;border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:2px 6px;display:none;font-weight:700}
.msg.on{display:block}
.eye{position:absolute;right:2px;width:44px;height:44px;margin-top:-22px;border:2px solid var(--acc);background:#fff;border-radius:12px;font-size:20px;line-height:1;padding:0;z-index:5}
.eye.gone{display:none}
.dot{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:0;background:transparent;padding:0;z-index:4}
.dot.sel{outline:3px solid var(--acc);background:rgba(31,79,168,.18)}
.dot.bad{outline:3px solid var(--bad);background:rgba(179,38,30,.25)}
.dot.ok{outline:2px solid var(--ok);background:rgba(19,122,58,.12)}
.tag{display:inline-block;font-size:13px;border-radius:6px;padding:0 6px;border:1px solid var(--warn);color:var(--warn);background:var(--warnbg)}
/* game */
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gcols button{display:block;width:100%;min-height:48px;margin:6px 0;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:22px;color:var(--ink);padding:2px 6px}
.gcols button.sel{border-color:var(--acc);background:var(--acc2)}
.gcols button.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.gcols button.bad{border-color:var(--bad);background:var(--badbg)}
.gcols button:disabled{opacity:1}
.gst{font-size:17px;font-weight:700;margin:6px 0}
.res{font-size:18px;font-weight:700;color:var(--ok);margin:4px 0}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>آرا — الوحدة الأولى: الوصف</h1>
  <div class="prog"><span id="progTxt"></span></div>
  <div class="bar"><i id="progBar"></i></div>
  <div class="res" id="finalRes"></div>
  <div class="tabs"><button type="button" id="tabBook" class="on">صفحة الكتاب</button><button type="button" id="tabQ">الأسئلة</button></div>
  <div class="tools" id="tools">
    <button class="b" type="button" id="showAll">أظهر كل الحلول</button>
    <button class="b" type="button" id="zoomB">تكبير</button>
  </div>
</header>
<main>
<div id="secBook"></div>
<div id="secQ" class="hidden">
  <section class="card">
    <div class="phead"><b>لعبة التوصيل من قائمتي ص٣٢</b><button class="b" type="button" id="gReset">إعادة</button></div>
    <p class="note">اضغط كلمة من العمود الأيمن ثم مرادفها من العمود الأيسر. الكلمات نفسها الموجودة في تمرين الكتاب.</p>
    <div class="gst" id="gst"></div>
    <div id="gameBox"></div>
  </section>
</div>
</main>

 ["p33","u33f","e33",[.075,.825,.80,.856],"كاللؤلؤ",[["كاللؤلؤ"]],null,0],
 ["p33","u33g","e33",[.075,.862,.72,.893],"كستنائية",[["كستنائية"]],null,0],
 ["p34","u34a","e34",[.455,.760,.525,.796],"ه",null,["ه","لأنه"],0],
 ["p34","u34b","e34",[.315,.792,.386,.828],"ها",null,["ها","لأنها"],0],
 ["p34","u34c","e34",[.80,.898,.878,.930],"هما",null,["هما","نقطفهما"],0],
 ["p34","u34d","e34",[.262,.944,.36,.980],"هن",null,["هن","بهن"],0]
];
/* matching: [page, set, rightDots(5), leftDots(5), pairs rightIndex->leftIndex, words] */
var MATCH=[
 {p:"p32",s:"A",R:[[.690,.584],[.693,.614],[.693,.645],[.697,.6775],[.699,.7075]],L:[[.615,.588],[.615,.619],[.617,.649],[.618,.681],[.620,.712]],pair:[2,0,1,4,3],
  rw:["تَتَجاوَزُ","عامٌ","وَهَبَ","غَدا","نَسيمٌ"],lw:["سَنَةٌ","أَعْطى","تَتَعَدّى","هَواءٌ","أَصْبَحَ"]},
 {p:"p32",s:"B",R:[[.2387,.621],[.2387,.653],[.241,.6875],[.245,.720],[.245,.7525]],L:[[.150,.625],[.150,.6575],[.1533,.6915],[.1567,.726],[.1567,.759]],pair:[2,0,1,4,3],
  rw:["الغَمُّ","الحَديقَةُ","بُرْهَةٌ","صَحا","قَضى"],lw:["البُسْتانُ","لَحْظَةٌ","الحُزْنُ","أَمْضى","أَفاقَ"]}
];

var state={};      /* unit -> 0 none,1 self,2 revealed */
var UNITS_ALL=[];  /* {id,page} */
var unitFills={};  /* unit -> [fill objs] */
var pageUnits={};  /* page -> [unit ids] */
var groupEyes={};  /* group -> button */
var groupUnits={}; /* group -> unit ids */
var revealFns={};  /* unit -> fn */
var resetFns={};   /* page -> [fn] */
function regUnit(id,p,g){UNITS_ALL.push({id:id,page:p});state[id]=0;(pageUnits[p]=pageUnits[p]||[]).push(id);(groupUnits[g]=groupUnits[g]||[]).push(id);}
function updProg(){
  var N=UNITS_ALL.length,d=0,s=0;UNITS_ALL.forEach(function(u){if(state[u.id]>0)d++;if(state[u.id]===1)s++;});
  $("progTxt").textContent="أنجزت "+ar(d)+" من "+ar(N)+" • حللتَ بنفسك: "+ar(s);
  $("progBar").style.width=(N?d/N*100:0)+"%";
  $("finalRes").textContent=(d===N&&N>0)?("النتيجة النهائية: "+ar(s)+" من "+ar(N)):"";
}

/* ---------- build book pages ---------- */
var book=$("secBook");
function buildPage(p){
  var card=el("section","card"),h=el("div","phead");h.appendChild(el("b",null,TITLES[p]));
  var rb=el("button","b","إعادة الصفحة");rb.type="button";rb.onclick=function(){(resetFns[p]||[]).forEach(function(f){f();});updProg();};h.appendChild(rb);card.appendChild(h);
  if(p==="p32"){
    var ex=el("div","ext");ex.appendChild(el("div",null,"نص «ابنتي هدى» لمؤلفة خارجية، فلا يُضمَّن هنا نصاً ولا صورة. اقرأه من كتابك، أو ألصقه هنا للقراءة فقط."));
    var ta=el("textarea");ta.setAttribute("dir","rtl");ta.setAttribute("lang","ar");ta.setAttribute("placeholder","ألصق النص هنا (لا يُحفظ)");ta.spellcheck=false;ex.appendChild(ta);card.appendChild(ex);
  }
  var wrap=el("div","pgwrap"),pg=el("div","pg"),inn=el("div","in");pg.id="pg-"+p;
  var img=el("img");img.src=IMGS[p];img.alt=TITLES[p];inn.appendChild(img);
  var svgNS="http://www.w3.org/2000/svg",svg=document.createElementNS(svgNS,"svg");svg.setAttribute("class","ln");svg.setAttribute("viewBox","0 0 100 100");svg.setAttribute("preserveAspectRatio","none");inn.appendChild(svg);
  pg.appendChild(inn);wrap.appendChild(pg);card.appendChild(wrap);book.appendChild(card);
  return {pg:pg,inn:inn,svg:svg,svgNS:svgNS};
}
var PG={};["p29","p32","p33","p34"].forEach(function(p){PG[p]=buildPage(p);resetFns[p]=[];});

/* eyes */
Object.keys(EYES).forEach(function(g){var p=EYES[g][0],y=EYES[g][1];
  var b=el("button","eye","👁");b.type="button";b.setAttribute("aria-label","👁 عرض الإجابة");b.style.top=PY(p,y)+"%";
  b.onclick=function(){(groupUnits[g]||[]).forEach(function(u){if(state[u]===0){revealFns[u]();}});b.classList.add("gone");updProg();};
  PG[p].pg.appendChild(b);groupEyes[g]=b;
  resetFns[p].push(function(){b.classList.remove("gone");});
});

/* fills */
var fillObjs={};
FILLS.forEach(function(f){
  var p=f[0],u=f[1],g=f[2],bx=f[3];
  if(!unitFills[u]){unitFills[u]=[];regUnit(u,p,g);}
  var w=el("div","fw");w.style.left=PX(p,bx[0])+"%";w.style.top=PY(p,bx[1])+"%";w.style.width=(PX(p,bx[2])-PX(p,bx[0]))+"%";w.style.height=(PY(p,bx[3])-PY(p,bx[1]))+"%";
  var inp=el("input");inp.type="text";inp.setAttribute("dir","rtl");inp.setAttribute("lang","ar");inp.setAttribute("autocomplete","off");inp.setAttribute("autocorrect","off");inp.setAttribute("autocapitalize","off");inp.spellcheck=false;inp.setAttribute("aria-label","اكتب الإجابة");
  var tick=el("span","tick","✔");tick.style.display="none";
  var sol=el("div","sol"+(f[7]?" warn":""),f[4]);
  var msg=el("div","msg");
  w.appendChild(inp);w.appendChild(tick);w.appendChild(sol);w.appendChild(msg);PG[p].inn.appendChild(w);
  var o={w:w,inp:inp,tick:tick,msg:msg,ok:false,tries:0,f:f};unitFills[u].push(o);
  function good(v){return f[6]?exactOk(v,f[6]):keysOk(v,f[5]);}
  function unitDone(){return unitFills[u].every(function(x){return x.ok;});}
  function mark(){o.ok=true;w.classList.add("ok");tick.style.display="";inp.readOnly=true;msg.classList.remove("on");
    if(unitDone()&&state[u]===0){state[u]=1;updProg();}}
  function ladder(){
    o.tries++;var t=o.tries,k=f[4];
    var txt;
    if(t===1)txt="ليست صحيحة بعد. أعد قراءة السؤال في الكتاب ثم حاول مرة أخرى.";
    else if(t===2){var nw=f[4].split(" ").length;txt="الإجابة من "+ar(nw)+(nw===1?" كلمة":" كلمات")+" وأول حرف فيها «"+f[4].charAt(0)+"».";}
    else txt="حاول مرة أخيرة، فإن لم تنجح اضغط 👁 لتشاهد الحل.";
    msg.textContent=txt;msg.classList.add("on");
  }
  inp.addEventListener("input",function(){if(o.ok)return;msg.classList.remove("on");if(good(inp.value))mark();});
  function chk(){if(o.ok||!inp.value.trim())return;if(good(inp.value))mark();else ladder();}
  inp.addEventListener("change",chk);inp.addEventListener("keydown",function(e){if(e.key==="Enter"){chk();inp.blur();}});
  o.reveal=function(){if(!o.ok){w.classList.add("show");}};
  o.reset=function(){o.ok=false;o.tries=0;w.classList.remove("ok","show");tick.style.display="none";inp.readOnly=false;inp.value="";msg.classList.remove("on");};
});
Object.keys(unitFills).forEach(function(u){
  revealFns[u]=function(){unitFills[u].forEach(function(o){o.reveal();});if(state[u]===0)state[u]=2;};
  var p=null;UNITS_ALL.forEach(function(x){if(x.id===u)p=x.page;});
  resetFns[p].push(function(){unitFills[u].forEach(function(o){o.reset();});state[u]=0;});
});

/* matching on the page */
var matchUnits=[];
MATCH.forEach(function(M){
  var p=M.p,inn=PG[p].inn,svg=PG[p].svg,sel=null,units=[];
  var dots=[];
  function mk(side,i,xy){var b=el("button","dot");b.type="button";b.style.left=PX(p,xy[0])+"%";b.style.top=PY(p,xy[1])+"%";b.setAttribute("aria-label",side==="R"?M.rw[i]:M.lw[i]);
    var d={b:b,side:side,i:i,xy:xy,done:false};b.onclick=function(){pick(d);};inn.appendChild(b);dots.push(d);return d;}
  var Rd=M.R.map(function(xy,i){return mk("R",i,xy);}),Ld=M.L.map(function(xy,i){return mk("L",i,xy);});
  M.R.forEach(function(xy,i){var id="m"+M.s+i;regUnit(id,p,"e32");units.push(id);matchUnits.push(id);
    revealFns[id]=function(){draw(i);if(state[id]===0)state[id]=2;};});
  var lines={};
  function draw(i){if(lines[i])return;var r=M.R[i],l=M.L[M.pair[i]];var ln=document.createElementNS(PG[p].svgNS,"line");
    ln.setAttribute("x1",PX(p,r[0]));ln.setAttribute("y1",PY(p,r[1]));ln.setAttribute("x2",PX(p,l[0]));ln.setAttribute("y2",PY(p,l[1]));svg.appendChild(ln);lines[i]=ln;
    Rd[i].done=true;Ld[M.pair[i]].done=true;Rd[i].b.classList.add("ok");Ld[M.pair[i]].b.classList.add("ok");}
  function clearSel(){dots.forEach(function(d){d.b.classList.remove("sel","bad");});sel=null;}
  function pick(d){
    if(d.done)return;
    if(!sel||sel.side===d.side){clearSel();sel=d;d.b.classList.add("sel");return;}
    var r=sel.side==="R"?sel:d,l=sel.side==="L"?sel:d;
    if(M.pair[r.i]===l.i){clearSel();draw(r.i);var id="m"+M.s+r.i;if(state[id]===0)state[id]=1;updProg();}
    else{var a=sel;a.b.classList.add("bad");d.b.classList.add("bad");setTimeout(function(){a.b.classList.remove("bad");d.b.classList.remove("bad");},300);sel=null;a.b.classList.remove("sel");}
  }
  resetFns[p].push(function(){while(svg.firstChild)svg.removeChild(svg.firstChild);lines={};dots.forEach(function(d){d.done=false;d.b.classList.remove("sel","bad","ok");});sel=null;units.forEach(function(id){state[id]=0;});});
});
/* show-all */
$("showAll").onclick=function(){UNITS_ALL.forEach(function(u){if(state[u.id]===0)revealFns[u.id]();});Object.keys(groupEyes).forEach(function(g){groupEyes[g].classList.add("gone");});updProg();};
$("zoomB").onclick=function(){document.body.classList.toggle("zoom");$("zoomB").textContent=document.body.classList.contains("zoom")?"تصغير":"تكبير";};
/* tabs */
$("tabBook").onclick=function(){$("secBook").classList.remove("hidden");$("secQ").classList.add("hidden");$("tabBook").classList.add("on");$("tabQ").classList.remove("on");$("tools").classList.remove("hidden");window.scrollTo(0,0);};
$("tabQ").onclick=function(){$("secQ").classList.remove("hidden");$("secBook").classList.add("hidden");$("tabQ").classList.add("on");$("tabBook").classList.remove("on");$("tools").classList.add("hidden");window.scrollTo(0,0);};
updProg();

/* ---------- game (tab 2): the two synonym lists on p32 ---------- */
var game={sel:null,ok:0,wrong:0};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildGame(){
  var box=$("gameBox");box.textContent="";game={sel:null,ok:0,wrong:0};
  MATCH.forEach(function(M){
    var cols=el("div","gcols"),cr=el("div"),cl=el("div");
    var order=shuffle(M.lw.map(function(_,i){return i;}));
    M.rw.forEach(function(w,i){var b=el("button",null,w);b.type="button";b.dataset.s=M.s;b.dataset.side="R";b.dataset.i=i;cr.appendChild(b);});
    order.forEach(function(i){var b=el("button",null,M.lw[i]);b.type="button";b.dataset.s=M.s;b.dataset.side="L";b.dataset.i=i;cl.appendChild(b);});
    cols.appendChild(cr);cols.appendChild(cl);box.appendChild(cols);
    if(M.s==="A")box.appendChild(el("hr"));
  });
  box.querySelectorAll("button").forEach(function(b){b.onclick=function(){gpick(b);};});
  gst();
}
function gst(){var t=ar(game.ok)+" صحيحة من "+ar(10)+" • محاولات خاطئة: "+ar(game.wrong);if(game.ok===10)t+=" • أحسنت، أكملت الأزواج كلها.";$("gst").textContent=t;}
function gpick(b){
  if(b.disabled)return;var s=game.sel;
  if(!s||s.dataset.side===b.dataset.side||s.dataset.s!==b.dataset.s){if(s)s.classList.remove("sel");game.sel=b;b.classList.add("sel");return;}
  var r=s.dataset.side==="R"?s:b,l=s.dataset.side==="L"?s:b,M=MATCH.filter(function(m){return m.s===b.dataset.s;})[0];
  s.classList.remove("sel");game.sel=null;
  if(M.pair[+r.dataset.i]===+l.dataset.i){r.classList.add("ok");l.classList.add("ok");r.disabled=true;l.disabled=true;game.ok++;}
  else{game.wrong++;r.classList.add("bad");l.classList.add("bad");setTimeout(function(){r.classList.remove("bad");l.classList.remove("bad");},300);}
  gst();
}
$("gReset").onclick=buildGame;
buildGame();
