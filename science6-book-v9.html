rmeric, rhizomes also function as storage organs for food.","s":[[56.4,83.27,79.15,85.62]],"df":""},{"c":"b","t":"One parent","x":"Vegetative propagation involves only one parent and does not produce new traits in the offspring.","s":[[54.28,17.6,74.65,19.78]],"df":""},{"c":"b","t":"Sexual propagation","x":"Sexual propagation involves the formation of reproductive cells called gametes and often results in new traits in the offspring.","s":[[73.39,21.67,78.99,23.85],[31.6,23.71,59.03,25.89]],"df":""},{"c":"b","t":"Nodes","x":"At the nodes, rhizomes produce adventitious roots that grow downward into the soil and shoots (clusters of stems and leaves) that grow upward.","s":[[66.8,57.48,83.37,59.83],[56.4,59.63,80.68,61.98]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science6-book-img/p091.jpg","u":1,"h":1.387,"bk":[{"pg":91,"id":"B91-1","card":"VN-4","kind":"box","r":[13.5,41.2,23.6,45.9],"ans":"Rhizomes","ok":["rhizomes","rhizome"],"label":"method 1 of natural vegetative propagation","h1":"Use the list of natural methods on this page: it starts with horizontal underground stems.","mine":false},{"pg":91,"id":"B91-2","card":"VN-4","kind":"box","r":[25.7,41.2,37.6,46.1],"ans":"Runners (Stolons)","ok":["runners stolons","runners (stolons)","runners","stolons","runner","stolon"],"label":"method 2 of natural vegetative propagation","h1":"It is the plant stem that creeps along the soil, like the strawberry plant.","mine":false},{"pg":91,"id":"B91-3","card":"VN-4","kind":"box","r":[38.0,41.2,47.6,45.9],"ans":"Tubers","ok":["tubers","tuber"],"label":"method 3 of natural vegetative propagation","h1":"They are swollen stems or roots that store food, like the potato.","mine":false},{"pg":91,"id":"B91-4","card":"VN-4","kind":"box","r":[48.8,41.2,58.4,45.9],"ans":"Corms","ok":["corms","corm"],"label":"method 4 of natural vegetative propagation","h1":"They are swollen, food-storing underground stems covered with scaly leaves.","mine":false},{"pg":91,"id":"B91-5","card":"VN-4","kind":"box","r":[59.8,41.2,68.4,45.9],"ans":"Bulbs","ok":["bulbs","bulb"],"label":"method 5 of natural vegetative propagation","h1":"They have a small disc-like stem with fleshy leaves, like onions and garlic.","mine":false}],"eyes":[]},{"b":92,"ctx":false,"hints":[{"c":"o","t":"Runners (stolons)","x":"Runners (stolons) are elongated stems that creep along the surface of the soil.","s":[[55.12,10.53,86.22,12.63]],"df":"Elongated stems that creep along the surface of the soil."},{"c":"o","t":"Strawberry","x":"The strawberry plant is a common example of propagation by runners.","s":[[66.16,27.95,86.22,30.05],[55.12,29.54,62.71,31.64]],"df":""},{"c":"b","t":"Length of runners","x":"Runners may grow to more than a meter in length.","s":[[55.12,13.7,84.33,15.8]],"df":""},{"c":"b","t":"Two types of tubers","x":"Tubers are swollen stems or roots that store food underground. There are two types: stem tubers and root tubers.","s":[[55.12,37.31,82.54,39.54]],"df":""},{"c":"b","t":"Cutting a potato","x":"A large potato tuber can be cut into several pieces, if each piece contains at least one bud (eye).","s":[[55.12,65.14,75.7,67.37]],"df":""},{"c":"b","t":"The cut site","x":"When a potato tuber is cut, a thin protective layer (suberin or cork) forms at the cut site and keeps out fungi and insects that could cause rot.","s":[[80.57,76.68,86.23,78.91],[55.12,78.61,77.14,80.84]],"df":""},{"c":"o","t":"Tubers","x":"Third method of natural vegetative propagation: by tubers (page 92).","s":[[26.19,39.9,37.13,42.43]],"df":""},{"c":"o","t":"Stem tubers","x":"Stem tubers are modified underground stems that store food. They have several depressions on their surface, often called \"eyes\".","s":[[54.4,44.14,66.82,46.01],[54.4,46.25,84.76,47.88],[55.53,47.96,85.78,49.59],[55.19,49.84,87.7,51.87],[54.63,51.71,67.38,53.42]],"df":"Stem tubers are modified underground stems that store food. They have several depressions on their surface, often called \"eyes.\""},{"c":"o","t":"Potato plant","x":"The potato plant is the book's example of stem tubers, which form new tubers.","s":[[75.06,63.27,86.57,65.39],[35.1,87.13,46.73,89.09]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science6-book-img/p092.jpg","u":1,"h":1.387,"bk":[],"eyes":[]},{"b":93,"ctx":false,"hints":[{"c":"b","t":"Dahlia tubers","x":"To prevent dahlia tubers from rotting, it is advisable not to cut them into pieces at the time of planting.","s":[[19.52,20.06,33.1,22.16],[11.89,21.93,27.65,24.03]],"df":""},{"c":"b","t":"Critical Thinking","x":"Think about what forms at the cut site of a potato tuber (page 92) and what it prevents.","s":[[15.75,36.24,42.47,38.34]],"df":""},{"c":"o","t":"Root tubers","x":"Root tubers are swollen roots that grow underground and store food.","s":[[12.64,8.63,24.38,10.59],[12.19,10.67,34.99,12.13],[12.19,12.87,34.76,14.41],[11.51,14.58,18.85,16.45]],"df":"Root tubers are swollen roots that grow underground and store food."},{"c":"o","t":"Examples of root tubers","x":"Sweet potatoes and dahlias are examples of root tubers.","s":[[10.84,18.08,24.27,20.28],[26.3,18.32,32.39,20.2],[76.98,24.76,88.83,26.79]],"df":""},{"c":"o","t":"Corms","x":"Corms are swollen, food-storing stems located underground. These stems are solid and covered with scaly leaves.","s":[[29.68,46.99,44.58,49.02],[54.51,44.54,86.0,46.09],[54.51,47.07,85.67,48.62],[54.51,48.78,84.76,50.24]],"df":"Corms are swollen, food-storing stems located underground. These stems are solid and covered with scaly leaves."},{"c":"o","t":"Examples of corms","x":"Examples include Alocasia (Elephant Ear) and Gladiolus.","s":[[54.51,64.5,77.99,66.45]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science6-book-img/p093.jpg","u":1,"h":1.387,"bk":[],"eyes":[]},{"b":94,"ctx":false,"hints":[{"c":"o","t":"Bulbs","x":"A bulb is a small, disc-like stem with a large bud at the top, surrounded by fleshy leaves that store food.","s":[[54.97,11.07,85.78,12.87],[54.97,13.03,75.62,14.82]],"df":""},{"c":"o","t":"Examples of bulbs","x":"Common examples include onions, garlic, daffodil, and tulips.","s":[[67.83,28.42,83.75,30.21],[54.97,30.29,82.39,32.08],[54.97,32.25,59.93,34.04]],"df":""},{"c":"o","t":"Artificial vegetative propagation","x":"In artificial vegetative propagation, humans actively participate for specific purposes.","s":[[54.97,41.21,83.75,43.0],[54.97,43.0,85.55,44.79],[54.97,44.79,69.86,46.58]],"df":"Artificial vegetative propagation is a type of propagation in which humans actively participate for specific purposes."},{"c":"b","t":"Why artificial?","x":"One reason is to quickly multiply plants that have desirable traits. Seeds may not give offspring with the same flower color, fruit size, or other characteristics.","s":[[69.79,44.67,82.55,46.91],[54.9,46.48,77.35,48.72]],"df":""},{"c":"b","t":"Plants without seeds","x":"Artificial propagation is also used to speed up the reproduction of plants that have lost the ability to produce viable seeds or do not produce seeds at all.","s":[[54.9,60.96,82.44,63.2]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science6-book-img/p094.jpg","u":1,"h":1.387,"bk":[],"eyes":[]},{"b":95,"ctx":false,"hints":[{"c":"o","t":"Four artificial methods","x":"Methods of artificial vegetative propagation: 1 Cuttings, 2 Layering, 3 Offshoot, 4 Grafting.","s":[[13.77,16.86,26.86,19.38],[27.88,16.86,40.86,19.38],[41.87,16.86,54.85,19.38],[55.87,16.86,68.85,19.38]],"df":""},{"c":"o","t":"Cutting","x":"A cutting is a piece of a tree branch, leaf, or root. When placed in water or soil, it can grow roots downward and a shoot (stems and leaves) upward.","s":[[54.97,24.67,85.78,26.63],[54.97,26.79,85.78,28.75],[54.97,28.91,85.78,30.86],[54.97,31.03,81.26,32.98]],"df":"A cutting is a piece of a tree branch, leaf, or root. When placed in water or soil, it can grow roots downward and a shoot (stems and leaves) upward."},{"c":"o","t":"Three types","x":"There are three types of cuttings: A. Stem cuttings, B. Root cuttings, C. Leaf cuttings.","s":[[54.97,35.42,68.96,37.38],[54.97,37.54,68.51,39.5],[54.97,39.66,68.06,41.61]],"df":""},{"c":"o","t":"Stem cuttings","x":"A piece is taken from a tree branch. It is best if its length is between 10 and 20 centimeters and if it has several buds.","s":[[54.97,44.06,69.19,46.01],[54.97,46.17,85.78,48.13],[54.97,48.29,85.78,50.24],[54.97,50.41,85.44,52.36]],"df":""},{"c":"b","t":"Cut at an angle","x":"The bottom end is cut at an angle to increase the surface area for water and nutrient absorption.","s":[[66.46,54.71,78.83,56.98]],"df":""},{"c":"b","t":"Cover the top end","x":"The top end should be covered with soil or a waxy material to prevent microbes and fungi from entering and causing rot.","s":[[70.77,58.96,85.78,60.99],[54.97,61.07,85.78,63.11],[54.97,63.27,85.78,65.31],[54.97,65.39,74.49,67.43]],"df":""},{"c":"b","t":"Seasons","x":"In Kurdistan, the best seasons for planting cuttings are early spring and autumn.","s":[[82.76,67.61,86.01,69.87],[54.9,69.76,82.92,72.02]],"df":""},{"c":"o","t":"Examples of cuttings","x":"Many plants are propagated by cuttings, including willow, mulberry, oleander, apple, and fig.","s":[[54.97,76.22,85.55,78.18],[54.97,78.34,57.9,80.29]],"df":""},{"c":"o","t":"Ornamental plants","x":"This method is also widely used for ornamental and decorative plants such as roses, bougainvillea, carnations, and chrysanthemums.","s":[[58.35,82.65,85.55,84.61],[58.13,84.77,73.36,86.73]],"df":""},{"c":"o","t":"Pictures","x":"The pictures show plants propagated by cuttings: an apple tree, a fig tree, a bougainvillea plant, a carnation plant and a chrysanthemum plant.","s":[[15.24,37.05,27.09,38.84],[37.81,37.05,48.31,38.84],[14.33,51.14,29.46,52.93],[36.79,51.14,48.87,52.93],[35.33,65.23,49.44,67.02]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science6-book-img/p095.jpg","u":1,"h":1.387,"bk":[],"eyes":[]},{"b":96,"ctx":false,"hints":[{"c":"o","t":"Root cuttings","x":"A piece of root, 10 to 20 cm in length, is taken from the plant. Its diameter should be between 1 and 2 cm.","s":[[12.08,11.56,44.24,13.6],[12.08,13.68,48.87,15.72],[12.08,15.8,29.23,17.75]],"df":""},{"c":"o","t":"Examples of root cuttings","x":"Olive and pomegranate trees are common examples of root cuttings.","s":[[36.68,17.83,39.05,19.79],[12.08,19.95,27.99,21.91]],"df":""},{"c":"o","t":"Leaf cuttings","x":"Depending on the type of plant, either a piece of a leaf or an entire leaf is taken.","s":[[12.08,26.55,36.12,28.66],[12.08,28.99,36.12,31.11],[12.08,31.43,32.96,33.47]],"df":""},{"c":"o","t":"Examples of leaf cuttings","x":"Examples include the snake plant (Sansevieria), aloe vera, and kalanchoe.","s":[[12.08,43.73,26.75,45.68],[12.08,46.09,21.9,48.05],[29.12,46.09,34.76,48.05],[76.41,31.68,87.02,33.22]],"df":""},{"c":"o","t":"Layering","x":"A branch of a tree is bent down and covered with soil while it is still attached to the parent plant.","s":[[70.2,52.77,84.88,54.72],[55.87,54.56,84.88,56.19],[55.87,56.11,84.88,57.74],[55.87,57.65,60.38,59.28]],"df":"A branch of a tree is bent down and covered with soil while it is still attached to the parent plant."},{"c":"b","t":"Nodes","x":"At the nodes (the joints of the stem), the plant develops new shoots upward and roots into the soil.","s":[[61.06,57.65,84.88,59.28],[55.87,59.2,84.88,60.83],[55.87,60.75,84.88,62.38]],"df":""},{"c":"b","t":"Examples of layering","x":"Common examples include grapevines, pomegranate trees, jasmine and dracaena.","s":[[67.99,65.31,85.12,67.58],[55.79,66.9,72.91,69.16]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science6-book-img/p096.jpg","u":1,"h":1.387,"bk":[],"eyes":[]},{"b":97,"ctx":true,"hints":[{"c":"b","t":"Offshoot","x":"An offshoot is a large bud that grows from the base of the parent plant or very close to it. It is carefully separated and planted independently.","s":[[55.8,12.09,76.35,14.36]],"df":""},{"c":"b","t":"Examples of offshoots","x":"The date palm, banana trees, and ornamental plants like cycas.","s":[[55.8,24.76,85.12,27.03]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science6-book-img/p097.jpg","u":2,"h":1.387,"bk":[],"eyes":[]},{"b":98,"ctx":true,"hints":[{"c":"b","t":"Grafting","x":"Grafting is joining the stems of two plants together so that their tissues grow as one.","s":[[55.81,12.01,85.13,14.36]],"df":""},{"c":"b","t":"Scion","x":"The plant with desirable qualities (such as good fruit) is called the scion.","s":[[83.3,25.59,85.13,27.95],[55.81,27.86,69.39,30.21]],"df":""},{"c":"b","t":"Rootstock","x":"The plant with strong roots and a sturdy stem is called the rootstock (the base).","s":[[55.81,32.38,72.92,34.74]],"df":""},{"c":"b","t":"Why graft?","x":"For example, an orange scion can be grafted onto a sour (bitter) lemon rootstock.","s":[[58.55,45.97,85.13,48.32]],"df":""},{"c":"b","t":"Two ways","x":"The most important ways of grafting are cleft grafting (wedge grafting) and bud grafting.","s":[[55.81,77.65,83.92,80.0]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science6-book-img/p098.jpg","u":2,"h":1.387,"bk":[],"eyes":[]},{"b":99,"ctx":true,"hints":[{"c":"b","t":"Cleft grafting","x":"Steps 1 to 7 describe cleft grafting (wedge grafting) of a scion onto a rootstock.","s":[[11.89,9.77,38.63,12.17]],"df":""},{"c":"b","t":"Why wax or sealant?","x":"The wax or sealant prevents microbes and fungi from entering and prevents the plant tissues from losing moisture.","s":[[11.89,31.28,46.03,33.63]],"df":""},{"c":"b","t":"Bud grafting","x":"Steps 1 to 7 describe bud grafting (T-budding): a small bud from the scion goes into a T-shaped slit in the rootstock.","s":[[50.64,48.73,72.67,51.13]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science6-book-img/p099.jpg","u":2,"h":1.387,"bk":[],"eyes":[]},{"b":100,"ctx":true,"hints":[{"c":"b","t":"Hands-on activity","x":"This activity is done with the teacher and with parents or guardians. Students must not use sharp tools to cut trees or plants independently.","s":[[59.77,7.07,88.1,9.42]],"df":""},{"c":"b","t":"Cuttings from ornamental plants","x":"Take cuttings from ornamental plants such function norm(s){
  s=String(s==null?'':s).normalize('NFD').replace(RX_DIAC,'');
  var o='';
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i);

// shared: passphrase-protected setup codes (AES-GCM, PBKDF2). Nothing leaves the device.
function bkB64u(b){var s='';new Uint8Array(b).forEach(function(x){s+=String.fromCharCode(x)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function bkUnb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function bkKey(pass,salt){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function bkEncode(obj,pass){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));var k=await bkKey(pass,salt);var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj))));var all=new Uint8Array(28+ct.length);all.set(salt,0);all.set(iv,16);all.set(ct,28);return 'BKS1.'+bkB64u(all)}
async function bkDecode(code,pass){code=String(code||'').trim();if(code.indexOf('BKS1.')!==0)throw new Error('This is not a setup code.');var all=bkUnb64u(code.slice(5));var k=await bkKey(pass,all.slice(0,16));try{var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},k,all.slice(28));return JSON.parse(new TextDecoder().decode(pt))}catch(e){throw new Error('Wrong passphrase or damaged code.')}}

  if(x.k==='s'){var pgs=stagePages(x.g),k=0,pa=-1;while(k<pgs.length&&pageState(x.g,pgs[k]).done){if(k%2===1&&!ppOk(x.g,pgs[k-1],pgs[k])){pa=k;break}k++}o.pk=pa>=0?pa:k;o.pn=pgs.length;
    if(pa>=0){o.pg=pgs[pa];o.step='pair check'}else if(k<pgs.length){var st=pageState(x.g,pgs[k]);o.pg=pgs[k];o.step=!st.rd?'reading':((!(st.q&&st.d)||!roundsOk(x.g,pgs[k]))?'round':'page check');if(st.rd&&o.step==='round'){var _r=rnCur(x.g,pgs[k]);o.rn=_r+1;o.rt=roundsOf(x.g,pgs[k]).length}}else o.step='section check'}
  return o;
}
function stDetail(){return GO.filter(function(g){return STG.indexOf(g)>-1||stagePages(g).length}).map(function(g){
  var sp=psOf(g),pgs=stagePages(g).map(function(pg){var st=pageState(g,pg),R=roundsOf(g,pg),rd=R.filter(function(_,r){return rnGet(g,pg,r).ok}).length;

async function ghReq(method,path,body){var d=devGet();return fetch((d.api||'https://api.github.com')+'/repos/'+d.repo+'/contents/'+path,{method:method,headers:{'Authorization':'Bearer '+d.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
function markDirty(){if(!canReport())return;SYNC.dirty=true;if(!SYNC.t)SYNC.t=setTimeout(function(){SYNC.t=null;syncNow()},SYNC.delay)}
async function syncNow(){
  if(!canReport()||SYNC.busy)return;
  if(navigator.onLine===false){SYNC.err='offline';SYNC.dirty=true;return}
  SYNC.busy=true;SYNC.dirty=false;var fail=false;
  try{
    var path='reports/'+D.meta.book+'.json',b64=btoa(unescape(encodeURIComponent(JSON.stringify(buildReport()))));
    for(var tr=0;tr<3;tr++){
      if(SYNC.sha===null){var g=await ghReq('GET',path);if(g.status===200)SYNC.sha=(await g.json()).sha;else if(g.status===404)SYNC.sha='';else throw new Error('GET '+g.status)}
      var pr=await ghReq('PUT',path,{message:'report '+D.meta.book,content:b64,sha:SYNC.sha||undefined});
      if(pr.status===200||pr.status===201){SYNC.sha=(await pr.json()).content.sha;SYNC.last=Date.now();SYNC.err='';break}
      if(pr.status===409||pr.status===422){SYNC.sha=null;continue}
      throw new Error('PUT '+pr.status);
    }
  }catch(e){fail=true;SYNC.err=String(e&&e.message||e);SYNC.dirty=true}
  SYNC.busy=false;
  if(fail){if(!SYNC.t)SYNC.t=setTimeout(function(){SYNC.t=null;syncNow()},SYNC.retry)}else if(SYNC.dirty)markDirty();
}
