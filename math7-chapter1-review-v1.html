function isPrime0(n){if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true}
function parsePF(raw){
  var s=toLatin(raw).replace(/\s+/g,'').replace(/[×xX*·•]/g,'*').replace(/[⁰¹²³⁴-⁹]+/g,function(r){return '^'+r.split('').map(function(c){return SUP[c]}).join('')});
  if(!s)return null;var parts=s.split('*'),out=[];
  for(var i=0;i<parts.length;i++){var m=/^(\d{1,6})(?:\^(\d{1,2}))?$/.exec(parts[i]);if(!m)return null;out.push({b:parseInt(m[1],10),e:m[2]?parseInt(m[2],10):1})}
  return out;
}
// ---------- answer checking (by value) ----------
function evalField(f,raw,sel){
  var i;
  if(f.kind==='num'){
    var x=parseInt0(raw);if(x===null)return {ok:false,msg:'Type a whole number.'};
    if(x===f.v)return {ok:true};
    var nr=f.near||[];for(i=0;i<nr.length;i++)if(nr[i].v===x)return {ok:false,msg:nr[i].msg};
    if(f.mode==='gcf'&&f.of){
      if(x<=0)return {ok:false,msg:'The GCF is a positive number.'};
      for(i=0;i<f.of.length;i++){if(f.of[i]%x!==0)return {ok:false,msg:fmt(x)+' does not divide '+fmt(f.of[i])+' evenly, so it is not a common factor.'}}
      if(x<f.v)return {ok:false,msg:fmt(x)+' is a common factor, but it is not the greatest one.'};
    }
    if(f.mode==='lcm'&&f.of){
      if(x<=0)return {ok:false,msg:'The LCM is a positive number.'};
      for(i=0;i<f.of.length;i++){if(x%f.of[i]!==0)return {ok:false,msg:fmt(x)+' is not a multiple of '+fmt(f.of[i])+', so it is not a common multiple.'}}
      if(x>f.v)return {ok:false,msg:fmt(x)+' is a common multiple, but it is not the least one.'};
    }
    return {ok:false,msg:''};
  }
  if(f.kind==='dec'){var d=parseDec(raw);if(d===null)return {ok:false,msg:'Type a number, for example 3.5.'};if(Math.abs(d-f.v)<1e-9)return {ok:true};var ac=f.acc||[];for(i=0;i<ac.length;i++)if(Math.abs(d-ac[i][0])<=ac[i][1])return {ok:true};return {ok:false,msg:''}}
  if(f.kind==='std'){var y=parseInt0(raw);if(y===null)return {ok:false,msg:'Type the ordinary number, with no powers of 10.'};return y===f.v?{ok:true}:{ok:false,msg:''}}
  if(f.kind==='sci'){
    var p=parseSci(raw);if(!p)return {ok:false,msg:'Write it like 3.4 × 10^2. Use the × and ^ keys.'};
    var val=p.m*Math.pow(10,p.e);var same=Math.abs(val-f.v)<=1e-9*Math.abs(f.v);
    if(same&&(p.m<1||p.m>=10))return {ok:false,msg:'The value is right, but the first number must be at least 1 and less than 10.'};
    return same?{ok:true}:{ok:false,msg:''};
  }
  if(f.kind==='pf'){var pp=parsePF(raw);if(!pp)return {ok:false,msg:'Write it like 2^3 × 11. Use the × and ^ keys.'};
    for(i=0;i<pp.length;i++){if(!isPrime0(pp[i].b))return {ok:false,msg:pp[i].b===1?'1 is not a prime number.':pp[i].b+' is not a prime number. Break it down into smaller factors.'}}
    var prod=1;pp.forEach(function(t){for(var k=0;k<t.e;k++)prod*=t.b});
    return prod===f.v?{ok:true}:{ok:false,msg:'The product of your factors is '+prod+', not '+f.v+'.'}}
  if(f.kind==='choice'){if(sel===undefined)return {ok:false,msg:'Choose an answer.'};return sel===f.a?{ok:true}:{ok:false,msg:''}}
  return {ok:false,msg:''};
}
// ---------- the shared question card ----------
function isChoiceOnly(e){return e.fields.length===1&&e.fields[0].kind==='choice'}
function examPrompt(e){return e.prompt}
function insertKey(inp,k){var a=inp.selectionStart==null?inp.value.length:inp.selectionStart,z=inp.selectionEnd==null?a:inp.selectionEnd;inp.value=inp.value.slice(0,a)+k+inp.value.slice(z);inp.focus();var q=a+k.length;try{inp.setSelectionRange(q,q)}catch(x){}}
function levelHint(e,w){
  var t=typeOf(e.type);
  if(w===1)return 'Not correct yet. Re-read the exercise on the page, then try again.';
  if(w===2)return t.h2+' (Open “Show solution” below to see the worked steps.)';
  return 'Last try, then press \u{1F441} Show answer to see the solution.';
}
function mark(n){var z=document.getElementById('z'+n);z.classList.remove('bad');void z.offsetWidth;z.classList.add('bad');setTimeout(function(){z.classList.remove('bad')},400)}
function setMsg(c,t,k){c.msg.textContent=t;c.msg.className='qmsg '+(k||'')}
function showAnswerMsg(c){var s=S[c.e.n];setMsg(c,(s.done&&!s.rev?'Correct! ':'Answer: ')+c.e.show,s.done&&!s.rev?'ok':'info')}
function checkQ(c){
  var e=c.e,s=S[e.n];
  if(s.done||s.rev){showAnswerMsg(c);return}
  if(e.fields[0].kind==='open'){
    var f0=e.fields[0],io=c.inputs[f0.id];s.vals[f0.id]=io.ta.value;
    if(!io.ta.value.trim()){setMsg(c,'Write your answer first.','no');return}
    if(!io.boxes.every(function(b){return b.checked})){setMsg(c,'Tick every point in the self-check list when your answer covers it.','no');return}
    s.done=true;setMsg(c,'Self-check complete. '+e.show,'ok');paint(e.n);updCounter();return;
  }
  var msgs=[],allOk=true;
  e.fields.forEach(function(f){
    var io=c.inputs[f.id],raw=io.inp?io.inp.value:'';if(io.inp)s.vals[f.id]=raw;
    var r=evalField(f,raw,s.sel[f.id]);
    if(io.inp)io.inp.className=r.ok?'ok':'no';
    if(io.kind==='choice'){io.btns.forEach(function(b,j){b.classList.remove('no','ok');if(s.sel[f.id]===j)b.classList.add(r.ok?'ok':'no')})}
    if(!r.ok){allOk=false;if(r.msg)msgs.push((e.fields.length>1?f.label+': ':'')+r.msg);else if(e.fields.length>1)msgs.push(f.label+': not correct yet.')}
  });
  if(allOk){s.done=true;setMsg(c,'Correct! '+e.show+' '+praise(),'ok');paint(e.n);updCounter();return}
  s.wrong++;mark(e.n);
  var h=levelHint(e,Math.min(s.wrong,3));
  setMsg(c,msgs.length?msgs.join(' ')+(s.wrong>=2?' '+h:''):'Almost there, try again. '+h,'no');
}
function revealQ(c){var e=c.e,s=S[e.n];if(!s.done)s.rev=true;paint(e.n);updCounter();showAnswerMsg(c)}

function rich(parent,text,cls){
  var box=el('div',cls||'',parent);
  String(text).split('\n').forEach(function(ln){var d=el('div','ln',box);var m=/^(\d[\d ]*)(\s*[:=])(.*)$/.exec(ln);
    var rest=ln;if(m){txt('b','gn',m[1],d);rest=m[2]+m[3]}
    rest.split(/(⟦[^⟧]*⟧)/).forEach(function(part){if(!part)return;if(part.charAt(0)==='⟦')txt('span','cir',part.slice(1,-1),d);else d.appendChild(document.createTextNode(part))})});
  return box;
}
function renderSol(c){
  var e=c.e,n=e.n,ST=e.steps,k=LST[n]||0,host=c.sol,t=typeOf(e.type);host.textContent='';
  var hd=txt('b','','Solution step by step',host);hd.style.cssText='display:block;margin:2px 0 4px;font-size:17px';
  txt('div','pcount',t.bk.length?'Main solution: '+(t.bk.length>1?'Methods A and B from the book':'method from the book')+', numbers solved by me.':'Main solution: '+t.mn[0]+' (Mine, not from the book).',host);
  if(k===0){var sb=txt('button','btn pri','Show solution',host);sb.addEventListener('click',function(){LST[n]=1;renderSol(c)});return}
  for(var i=0;i<k;i++){var d=el('div','stp s2'+(i===k-1?' cur':''),host);txt('b','sn',(i+1)+'.',d);rich(d,ST[i].t,'stt');if(ST[i].why)txt('i','','Why: '+ST[i].why,d)}
  if(k<ST.length){var nb=txt('button','btn pri','Next step',host);nb.addEventListener('click',function(){LST[n]=k+1;renderSol(c)});return}
  var an=el('div','ans',host);txt('b','','Answer: ',an);an.appendChild(document.createTextNode(e.show));
  if(e.fields.length&&e.fields[0].kind==='open'){var cl=el('div','stp',host);cl.style.cssText='background:#f3eafa;border:1px solid #7b3fc4';txt('b','','Self-check list',cl);txt('i','','Mine, not from the book',cl);
    e.fields[0].checks.forEach(function(ct,j){var r=el('label','chk',cl);var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!LCHK[n+'-'+j];cb.addEventListener('change',function(){LCHK[n+'-'+j]=cb.checked});r.appendChild(cb);r.appendChild(document.createTextNode(ct))})}
  extras(host,e);
  var al=e.alt||[];
  if(al.length){
    var ah=txt('b','','Other methods for this question ('+al.length+', all mine)',host);ah.style.cssText='display:block;margin:10px 0 4px;font-size:17px';
    al.forEach(function(a){var dt=el('details','altm',host);txt('summary','',a.name,dt);a.lines.forEach(function(ln){rich(dt,ln)});txt('span','mine','Mine, not from the book',dt)});
  }
  var tk=e.tricks||[];
  if(tk.length){
    var th=txt('b','','Easy tricks ('+tk.length+', mine, not counted above)',host);th.style.cssText='display:block;margin:10px 0 4px;font-size:17px';
    tk.forEach(function(a,ti){var dt=el('details','altm trk',host);dt.open=true;txt('summary','',a.name,dt);
      var w=txt('div','pcount','Use it '+a.when.charAt(0).toLowerCase()+a.when.slice(1),dt);w.style.fontStyle='italic';
      var area=el('div','',dt);var key=n+'-'+ti;
      (function draw(){area.textContent='';var kk=TRK[key]||0;
        if(kk===0){var b0=txt('button','btn pri','Show trick solution',area);b0.addEventListener('click',function(){TRK[key]=1;draw()});return}
        for(var q=0;q<kk;q++){var d=el('div','stp s2'+(q===kk-1?' cur':''),area);txt('b','sn',(q+1)+'.',d);rich(d,a.steps[q].t,'stt');if(a.steps[q].why)txt('i','','Why: '+a.steps[q].why,d)}
        if(kk<a.steps.length){var b1=txt('button','btn pri','Next step',area);b1.addEventListener('click',function(){TRK[key]=kk+1;draw()})}
      })();
      txt('span','mine','Mine, not from the book',dt)});
  }
  S[n].demo=true;paint(n);
}
function renderQ(host,e,mode,openM){
  host.textContent='';var t=typeOf(e.type),col=COL[e.type-1],n=e.n,N=EX.length,tc=typeCount(e.type),pos=posInType(n),s=S[n];
  var c={e:e,mode:mode,inputs:{}};
  var card=el('div','qcard',host);
  var badge=txt('button','tag',' T'+e.type+' – '+t.name,card);badge.type='button';badge.style.cssText='display:block;width:100%;text-align:left;border-color:'+col+';background:#fff;color:'+col+';margin:2px 0';badge.setAttribute('aria-label','Type '+e.type+': '+t.name);badge.addEventListener('click',popTypes);
  txt('p','note',tc+(tc===1?' question':' questions')+' of this type ('+t.ex+'). This is number '+pos+' of '+tc+'.',card);
  var ml=txt('p','note',methodsLine(t)+'.',card);ml.style.fontWeight='700';
  if((e.tricks||[]).length){var tl=txt('p','note','Easy tricks for this question: '+e.tricks.length+' (shown after the solution, not counted above).',card);tl.style.fontWeight='700'}
  var q=txt('p','',examPrompt(e),card);q.style.cssText='font-size:18px;font-weight:600;margin:8px 0';
    // try it first
  var tf=el('div','tryf',card);txt('b','','Try it first',tf);
  if(e.noans){var nb=txt('div','qmsg info','This question has an error in the book, so there is nothing to type and nothing to check. Open the solution below to see why.',tf);nb.style.display='block'}
  e.fields.forEach(function(f){
    if(e.fields.length>1||f.kind==='open'){txt('div','flab',f.label,tf)}
    if(f.kind==='choice'){
      var box=el('div','',tf);c.inputs[f.id]={kind:'choice',btns:[]};
      f.opts.forEach(function(tx,k){var b=el('button','opt',box);b.type='button';b.textContent=tx;
        if(s.sel[f.id]===k)b.classList.add('sel');
        b.addEventListener('click',function(){if(s.done||s.rev)return;s.sel[f.id]=k;c.inputs[f.id].btns.forEach(function(x,j){x.classList.toggle('sel',j===k);x.classList.remove('no')});if(isChoiceOnly(e))checkQ(c)});
        c.inputs[f.id].btns.push(b)});
    }else if(f.kind==='open'){
      var ta=el('textarea','',tf);ta.setAttribute('aria-label','Your answer');ta.value=s.vals[f.id]||'';c.inputs[f.id]={kind:'open',ta:ta,boxes:[]};
      txt('span','mine','Mine, not from the book',tf);
      f.checks.forEach(function(tx,k){var r=el('label','chk',tf);var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!s.chk[k];cb.addEventListener('change',function(){s.chk[k]=cb.checked});r.appendChild(cb);r.appendChild(document.createTextNode(tx));c.inputs[f.id].boxes.push(cb)});
    }else{
      var r2=el('div','row',tf);
      var inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;
      inp.setAttribute('inputmode',(f.kind==='dec'||f.kind==='sci')?'decimal':'numeric');inp.setAttribute('aria-label',f.label||'Your answer');inp.value=s.vals[f.id]||'';
      inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')checkQ(c)});
      r2.appendChild(inp);c.inputs[f.id]={kind:f.kind,inp:inp};
      if(f.kind==='sci'||f.kind==='pf'){['×','^'].forEach(function(k){var b=el('button','key',r2);b.type='button';b.textContent=k;b.setAttribute('aria-label','Insert '+k);b.addEventListener('click',function(){insertKey(inp,k)})})}
    }
  });
  c.msg=el('div','qmsg',tf);c.msg.setAttribute('role','status');
  if(!e.noans){var rw=el('div','row',tf);var cb1=txt('button','btn pri','Check',rw);cb1.addEventListener('click',function(){checkQ(c)});
  var cb2=txt('button','btn','\u{1F441} Show answer',rw);cb2.addEventListener('click',function(){revealQ(c)});}
  if(s.done||s.rev)showAnswerMsg(c);
  // methods of this type
  var dt=el('details','altm',card);if(openM)dt.open=true;txt('summary','','Methods of this type ('+t.bk.length+' from the book, '+t.mn.length+' from me)',dt);
  if(t.bk.length){var bh=txt('b','','From the book',dt);bh.style.display='block';t.bk.forEach(function(x){txt('div','',x,dt)});(t.method||[]).forEach(function(x){var p=txt('p','',x,dt);p.style.fontSize='15px'})}
  if(t.mn.length){var mh=txt('b','','Mine, not from the book',dt);mh.style.cssText='display:block;margin-top:6px;color:#b45309';t.mn.forEach(function(x){txt('div','',x,dt)})}
  if(!t.bk.length)(t.method||[]).forEach(function(x){var p=txt('p','',x,dt);p.style.fontSize='15px'});
  // solution
  c.sol=el('div','solbox',card);renderSol(c);
  return c;
}
