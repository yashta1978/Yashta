<style>
:root{
  --bg:#eef4f4; --ink:#1d2b2e; --muted:#5c6f73; --card:#ffffff; --line:#cfdcdc;
  --accent:#2f4a52; --accent-soft:#e6eeee;
  --vina:#3f82c4; --vina-soft:#e4eff9;
  --ara:#c1693b;  --ara-soft:#faece3;
  --gold:#c9a45c; --bar:#2f4a52;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); line-height:1.6;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic",Arial,sans-serif;
}
header{
  background:var(--bar); color:#fff; text-align:center; padding:20px 16px 16px;
  border-bottom:4px solid var(--gold);
}
header h1{margin:0;font-size:26px;letter-spacing:.3px}
header p{margin:4px 0 0;font-size:15px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.crumbs{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.back{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;
  font-size:15px;font-weight:600;min-height:40px;
}
.back:hover,.back:focus-visible{border-color:var(--accent)}
.where{color:var(--muted);font-size:14px}
h2.view-title{margin:0 0 12px;font-size:22px}
.grid{display:grid;gap:14px}
a.card{
  display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink);
  background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 20px;min-height:84px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
a.card .name{font-size:26px;font-weight:700}
a.card .meta{font-size:15px;color:var(--muted)}
a.card .native{font-size:20px;color:var(--muted)}
a.card.vina{border-inline-start:10px solid var(--vina)}
a.card.ara{border-inline-start:10px solid var(--ara)}
a.card.pic{padding:0;min-height:0;display:block;position:relative;overflow:hidden;border:3px solid var(--line)}
a.card.pic img{display:block;width:100%;height:auto}
a.card.pic .count{display:block;background:#fff;color:var(--muted);font-size:14px;font-weight:600;padding:4px 14px;text-align:center}
a.card.subject{border-inline-start:10px solid var(--accent)}
a.card.subject .meta{display:inline-block;margin-top:2px}
.arrow{font-size:24px;color:var(--muted);flex:none}
.theme-vina a.card.subject{border-inline-start-color:var(--vina)}
.theme-ara  a.card.subject{border-inline-start-color:var(--ara)}

a.lesson{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;border-radius:14px;text-decoration:none;color:var(--ink);
  border:2px solid transparent;min-height:64px;
}
.theme-vina a.lesson{background:var(--vina-soft)}
.theme-ara  a.lesson{background:var(--ara-soft)}
.theme-vina a.lesson:hover,.theme-vina a.lesson:focus-visible{border-color:var(--vina)}
.theme-ara  a.lesson:hover,.theme-ara  a.lesson:focus-visible{border-color:var(--ara)}
.title{font-size:18px;font-weight:600;flex:1}
.title[lang="ar"],.title[lang="ku"]{font-size:21px;line-height:1.9}
.tag{
  flex:none;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:#fff;color:var(--muted);border:1px solid var(--line);direction:ltr;
}
.sub{display:block;font-size:13px;color:var(--muted);font-weight:400;direction:ltr;text-align:left}
h3.prev{margin:22px 0 8px;font-size:15px;color:var(--muted);font-weight:600}
.prev-list{display:grid;gap:8px}
.prev-list a.lesson{background:#f6f8f8;border:1px solid var(--line);min-height:52px;padding:10px 14px}
.prev-list .title{font-size:17px;font-weight:500}
.empty{color:var(--muted);padding:12px 0}
noscript .plain{max-width:760px;margin:0 auto;padding:16px}
noscript .plain a{display:block;padding:10px 0}
.thanks{background:var(--card);border:2px solid var(--line);border-inline-start:8px solid var(--gold);border-radius:16px;padding:14px 18px;margin-top:8px;text-align:center}
.thanks .tn+.tn{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.thanks .sign{font-weight:700;color:var(--accent);margin:14px 0 2px;font-size:18px;border-top:1px dashed var(--line);padding-top:10px}
.thanks .tn[lang="ar"],.thanks .tn[lang="ku"]{font-size:1.08em}
.thanks h3{margin:0 0 6px;font-size:19px;color:var(--accent)}
.thanks p{margin:6px 0;font-size:16px;line-height:1.7;color:var(--ink)}
.hby{margin:2px 0 4px;font-size:19px;font-weight:700;color:var(--gold);letter-spacing:.3px}
.by{display:block;margin:10px 0 0;text-align:center;font-size:24px;font-weight:700;color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 24px}

a.card.tcard{background:linear-gradient(135deg,#fff7e6,#fde7c3);border-color:#f59e0b;min-height:84px;grid-column:1/-1}
a.card.tcard .name{font-size:22px;font-weight:800}
a.card.tcard .meta{display:block;margin-top:4px;font-size:14px;color:#6b4a00}
.tbadge{flex:none;min-width:34px;height:34px;padding:0 10px;border-radius:999px;background:#f59e0b;color:#fff;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center}
.tbadge.ok{background:#16a34a}
.tpage .day{font-weight:800;font-size:17px;margin:20px 2px 8px;color:#333}
.tpage .day small{font-weight:600;color:#777;margin-inline-start:6px}
.tgrid{display:grid;gap:10px}
a.task{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:10px 16px;border-radius:14px;background:#fff;border:2px solid #d8dee6;color:#222;text-decoration:none}
a.task .sn{font-weight:700;font-size:17px}a.task .ss{display:block;font-size:13px;color:#666;font-weight:500;margin-top:2px}
a.task.now{border-color:#f59e0b;background:#fff7e6}a.task.done{border-color:#16a34a;background:#f0fdf4}
.task .st{font-weight:800;font-size:15px;white-space:nowrap;padding:6px 12px;border-radius:999px;background:#fff}
a.task.now .st{color:#b45309;border:1.5px solid #f59e0b}a.task.done .st{color:#15803d;border:1.5px solid #16a34a}
.task.none{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 16px;border-radius:14px;background:#f8fafc;border:2px dashed #d8dee6;color:#6b7280}.task.none .sn{font-weight:600;font-size:16px}.task.none .st{font-weight:600;font-size:14px;background:transparent}.tmore>summary{font-weight:800;font-size:16px;margin:20px 2px 4px;cursor:pointer;min-height:44px;display:flex;align-items:center}
.mkb{color:#15803d;font-weight:800}.task.mk.none{background:#f0fdf4;border-color:#16a34a;border-style:solid}.task.mk .sn{color:#15803d}
.twait{margin:10px 2px 0;padding:10px 14px;border-radius:12px;background:#f3f4f6;color:#666;font-size:14px;line-height:1.7}
.twait b{color:#444}
</style>

<script id="hub-device">// shared: passphrase-protected setup codes (AES-GCM, PBKDF2). Nothing leaves the device.
function bkB64u(b){var s='';new Uint8Array(b).forEach(function(x){s+=String.fromCharCode(x)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function bkUnb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function bkKey(pass,salt){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function bkEncode(obj,pass){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));var k=await bkKey(pass,salt);var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj))));var all=new Uint8Array(28+ct.length);all.set(salt,0);all.set(iv,16);all.set(ct,28);return 'BKS1.'+bkB64u(all)}
async function bkDecode(code,pass){code=String(code||'').trim();if(code.indexOf('BKS1.')!==0)throw new Error('This is not a setup code.');var all=bkUnb64u(code.slice(5));var k=await bkKey(pass,all.slice(0,16));try{var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},k,all.slice(28));return JSON.parse(new TextDecoder().decode(pt))}catch(e){throw new Error('Wrong passphrase or damaged code.')}}

function bkND(s){return String(s||'').replace(/[\u0660-\u0669]/g,function(c){return String(c.charCodeAt(0)-0x0660)}).replace(/[\u06F0-\u06F9]/g,function(c){return String(c.charCodeAt(0)-0x06F0)}).replace(/\s+/g,'')}

/* ---- Tasks list (Vina): tomorrow's subjects first; homework status read from each lesson's own saved progress ---- */
var TIMETABLE = { vina: {
  0: ["kurdish","science","english","arabic","islamic","math","social-value"],
  1: ["science","english","math","art","pe","islamic","arabic"],
  2: ["kurdish","english","social-studies","math","ict","science","english"],
  3: ["kurdish","music","pe","science","math","english","arabic"],
  4: ["social-studies","english","arabic","kurdish","science","social-value","math"] },
  ara: {
  0: ["arabic","science","music","math","social-studies","kurdish","english"],
  1: ["science","kurdish","math","reading-writing","social-studies","social-value","english"],
  2: ["arabic","social-value","pe","math","kurdish","english","science"],
  3: ["ict","science","art","english","arabic","kurdish","math"],
  4: ["english","arabic","social-studies","math","science","english","islamic"] } };
var HOMEWORK = { vina: {
  "science": { title: "Science — Vegetative Propagation", href: "science6-book-v8.html", key: "sci6-vegprop-progress-v1", get: function (o) { return o && o.PS && o.PS.hw; } },
  "social-studies": { title: "Social Studies — دامەزراندنا دەولەتا عێراقێ و حکومەتا دووێ یا شێخ مەحمودی (ل.٣٤–٣٥)", href: "komelayeti-6a-book-v2.html", key: "soc6-p31-progress-v1", get: function (o) { return o && o.PS && o.PS.hw; } },
  "islamic": { title: "Islamic \u2014 \u0648\u0627\u0646\u06d5\u06cc\u0627 \u0666 \u0648 \u0667 (\u0644.\u0661\u0668\u2013\u0662\u0664)", href: "islamic6-book-v4.html", key: "is6-book-progress-v1", first: true, get: function (o) { return o && o.PS && o.PS.hw; } },
  "arabic": { title: "Arabic \u2014 \u0627\u062d\u062a\u0631\u0627\u0645 \u0627\u0644\u0635\u063a\u0627\u0631 \u0644\u0644\u0643\u0628\u0627\u0631 (pp. 50\u201351)", href: "arabic6-book-v5.html", key: "ar6-book-progress-v1", first: true, get: function (o) { return o && o.PS && o.PS.hw; } },
},
  ara: {
  "science": { title: "Science \u2014 Units 1\u20133", href: "science7-book-v32.html", key: "", plain: true, get: function () { return null; } },
  "social-studies": { title: "Social Studies \u2014 Lesson 5: Medes (pp. 58\u201360)", href: "komelayeti-7a-book-v14.html", key: "soc7-book-progress-v1", get: function (o) { return o && o.PS && o.PS.hw; } }
} };
var DAYN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var EXAMS = { vina: [ { date: "2026-11-23", sid: "islamic", name: "Islamic quiz", sub: "Monday 23/11/2026 \u00b7 Lessons 6\u20137 (pp. 18\u201324)", href: "islamic6-book-v4.html" } ], ara: [ { date: "2026-11-23", sid: "science", name: "Science quiz", sub: "Monday 23/11/2026 \u00b7 Unit 3, Sections 1\u20132", href: "science7-book-v32.html" } ] };
function pendingExams(id) {
  var t = new Date(), today = t.getFullYear() + "-" + p2(t.getMonth() + 1) + "-" + p2(t.getDate());
  return (EXAMS[id] || []).filter(function (x) { return x.date >= today; });
}
function p2(n) { return (n < 10 ? "0" : "") + n; }
function hwState(h) {
  var v = null;
  try { var raw = localStorage.getItem(h.key); if (raw) v = h.get(JSON.parse(raw)); } catch (e) {}
  return v && v.done ? v : null;
}
function tasksData(id) {
  var tt = TIMETABLE[id]; if (!tt) return null;
  var d = new Date(), shown = 0, days = [];
  for (var k = 1; k <= 8 && shown < 5; k++) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + k), wd = x.getDay();
    if (wd === 5 || wd === 6) continue;
    var first = shown === 0; shown++;
    var seen = {}, hw = [], rows = [];
    tt[wd].forEach(function (sid) {
      if (seen[sid]) return; seen[sid] = 1;
      var h = (HOMEWORK[id] || {})[sid], sub = SUBJECTS.filter(function (z) { return z.id === sid; })[0];
      if (h) { var r = { sid: sid, h: h, st: hwState(h) }; hw.push(r); rows.push(r); }
      else rows.push({ sid: sid, name: sub ? sub.title : sid });
    });
    hw.sort(function (a, b) { return (b.h.first ? 1 : 0) - (a.h.first ? 1 : 0); });
    rows = rows.map(function (r, i) { return { r: r, i: i }; }).sort(function (a, b) {
      var ka = a.r.h ? (a.r.h.first ? 0 : 1) : 2, kb = b.r.h ? (b.r.h.first ? 0 : 1) : 2;
      return ka !== kb ? ka - kb : a.i - b.i;
    }).map(function (o) { return o.r; });
    days.push({ key: x.getFullYear() + "-" + p2(x.getMonth() + 1) + "-" + p2(x.getDate()), first: first, label: DAYN[wd] + " " + p2(x.getDate()) + "/" + p2(x.getMonth() + 1) + "/" + x.getFullYear(), hw: hw, rows: rows });
  }
  return days;
}
function tasksCard(id) {
  var days = tasksData(id); if (!days) return null;
  var pend = 0, tot = 0, names = [];
  if (days[0]) days[0].hw.forEach(function (r) { tot++; if (!r.st) { pend++; names.push(r.h.title.split(" \u2014 ")[0]); } });
  var ex = pendingExams(id);
  var meta = !days[0] ? "Nothing yet" : (tot ? (pend ? "Tomorrow: " + names.join(", ") : "Tomorrow: all done \u2713") : "No homework yet for tomorrow");
  if (ex.length) meta = "Quiz: " + ex[0].name + " \u00b7 " + meta;
  var badge = el("span", { "class": "tbadge" + (tot && !pend && !ex.length ? " ok" : ""), text: ex.length ? String(pend + ex.length) : (tot ? (pend ? String(pend) : "\u2713") : "\u2013") });
  return el("a", { "class": "card subject tcard", href: "#" + id + "/tasks" }, [
    el("span", {}, [el("span", { "class": "name", text: "Tasks" }), el("span", { "class": "meta", text: meta })]),
    badge
  ]);
}
function marksCfg() {
  try {
    var p = JSON.parse(localStorage.getItem("bk-parent-v1") || "null");
    if (p && p.cfg && p.cfg.repo && p.cfg.token) return p.cfg;
    var d = JSON.parse(localStorage.getItem("bk-device-v1") || "null");
    if (d && d.repo && d.token) return d;
  } catch (e) {}
  return null;
}
function loadMarkMap() {
  var c = marksCfg(); if (!c) return Promise.resolve({});
  return fetch((c.api || "https://api.github.com") + "/repos/" + c.repo + "/contents/reports/parent-marks.json?t=" + Date.now(),
    { headers: { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json" }, cache: "no-store" })
    .then(function (r) { if (!r.ok) return {}; return r.json().then(function (j) { return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))))) || {}; }); })
    .catch(function () { return {}; });
}
function applyMarks(root) {
  loadMarkMap().then(function (m) {
    root.querySelectorAll("[data-mk]").forEach(function (n) {
      if (!m[n.getAttribute("data-mk")] || n.querySelector(".mkb")) return;
      n.classList.add("mk");
      var sn = n.querySelector(".sn"); if (sn) sn.insertBefore(el("span", { "class": "mkb", text: "\u2713 " }), sn.firstChild);
    });
  });
}
function viewTasks(id) {
  var s = DATA[id], days = tasksData(id);
  if (!days) return viewStudent(id);
  hint.textContent = s.name + " \u00b7 Tasks";
  document.title = s.name + " \u2014 Tasks";
  var wrap = el("div", { "class": "theme-" + s.theme + " tpage" }, [
    el("div", { "class": "crumbs" }, [backLink("#" + id, s.name), el("span", { "class": "where", text: s.name + " \u203a Tasks" })]),
    el("h2", { "class": "view-title", text: "Tasks" })
  ]);
  pendingExams(id).forEach(function (x) {
    wrap.appendChild(el("div", { "class": "day" }, [document.createTextNode("Upcoming exam")]));
    var g0 = el("div", { "class": "tgrid" }, []);
    g0.appendChild(el("a", { "class": "task now", href: x.href, "data-mk": "exam:" + x.date + ":" + id + ":" + x.sid }, [
      el("span", {}, [el("span", { "class": "sn", dir: "ltr", text: x.name }), el("span", { "class": "ss", text: x.sub })]),
      el("span", { "class": "st", text: "Study now" })
    ]));
    wrap.appendChild(g0);
  });
  var more = null;
  days.forEach(function (dy) {
    var box = wrap;
    if (!dy.first) {
      if (!more) { more = el("details", { "class": "tmore" }, [el("summary", { text: "Upcoming days" })]); wrap.appendChild(more); }
      box = more;
    }
    box.appendChild(el("div", { "class": "day" }, [document.createTextNode(dy.label), dy.first ? el("small", { text: "Tomorrow" }) : null].filter(Boolean)));
    var g = el("div", { "class": "tgrid" }, []);
    dy.rows.forEach(function (r) {
      if (!r.h) {
        g.appendChild(el("div", { "class": "task none", "data-mk": dy.key + ":" + id + ":" + r.sid }, [el("span", { "class": "sn", dir: "ltr", text: r.name }), el("span", { "class": "st", text: "No lesson" })]));
        return;
      }
      var st = r.st;
      g.appendChild(el("a", { "class": "task " + (st ? "done" : "now"), href: r.h.href, "data-mk": dy.key + ":" + id + ":" + r.sid }, [
        el("span", {}, [el("span", { "class": "sn", dir: "ltr", text: r.h.title.split(" \u2014 ")[0] }), el("span", { "class": "ss", dir: "auto", text: r.h.title.split(" \u2014 ")[1] || "" })]),
        el("span", { "class": "st", text: st ? "\u2713 " + st.score + " / " + st.n : (r.h.plain ? "Open" : "Study now") })
      ]));
    });
    box.appendChild(g);
  });
  app.replaceChildren(wrap);
  applyMarks(wrap);
}

function viewStudent(id) {
  var s = DATA[id];
  hint.textContent = s.name + " · " + s.grade;
  document.title = s.name + " — Lessons";
  var wrap = el("div", { "class": "theme-" + s.theme }, [
    el("div", { "class": "crumbs" }, [onlyStudent() ? el("span", {}) : backLink("#", "Home"), el("span", { "class": "where", text: s.name + " · " + s.grade })]),
    el("h2", { "class": "view-title", text: "Choose a subject" })
  ]);
  var grid = el("div", { "class": "grid" }, []);
  var tc = tasksCard(id); if (tc) grid.appendChild(tc);
  s.subjects.forEach(function (sub) {
    if ((BANNERS[id] || []).indexOf(sub.id) > -1) {
      var cnt = sub.lessons.length;
      grid.appendChild(el("a", { "class": "card subject pic", href: "#" + id + "/" + sub.id, "aria-label": sub.title + " — " + (cnt ? cnt + (cnt === 1 ? " lesson" : " lessons") : "No lessons yet") }, [
        el("img", { src: "img/" + id + "/" + sub.id + ".jpg", alt: sub.title, loading: "lazy" }),
        el("span", { "class": "count", text: cnt ? (cnt + (cnt === 1 ? " lesson" : " lessons")) : "No lessons yet" })
      ]));
      return;
    }
    var left = el("span", {}, [el("span", { "class": "name", text: sub.title })]);
    if (sub.native) {
      left.appendChild(el("br"));
      left.appendChild(el("span", { "class": "native", lang: sub.nativeLang, text: sub.native }));
    }
    left.appendChild(el("br"));
    var n = sub.lessons.length;
    left.appendChild(el("span", { "class": "meta", text: n ? (n + (n === 1 ? " lesson" : " lessons")) : "No lessons yet" }));
    grid.appendChild(el("a", { "class": "card subject", href: "#" + id + "/" + sub.id }, [
      left, el("span", { "class": "arrow", text: "›", "aria-hidden": "true" })
    ]));
  });
  wrap.appendChild(grid);
  app.replaceChildren(wrap);
}

function viewSubject(id, subId) {
  var s = DATA[id];
  var sub = s.subjects.filter(function (x) { return x.id === subId; })[0];
  if (!sub) return viewStudent(id);
  hint.textContent = s.name + " · " + sub.title;
  document.title = s.name + " — " + sub.title;
  var wrap = el("div", { "class": "theme-" + s.theme }, [
    el("div", { "class": "crumbs" }, [
      backLink("#" + id, s.name),
      el("span", { "class": "where", text: s.name + " › " + sub.title })
    ]),
    el("h2", { "class": "view-title", text: sub.title })
  ]);
  var grid = el("div", { "class": "grid" }, []);
  sub.lessons.forEach(function (l) { grid.appendChild(lessonLink(l, id)); });
  if (!sub.lessons.length) grid.appendChild(el("p", { "class": "empty", text: "No lessons yet. They will appear here once they are added." }));
  wrap.appendChild(grid);
  if (sub.previous && sub.previous.length) {

    var pl = el("div", { "class": "prev-list" }, []);
    sub.previous.forEach(function (l) { pl.appendChild(lessonLink(l, id)); });
    wrap.appendChild(pl);

}

function onlyStudent() {
  try {
    if (localStorage.getItem("bk-parent-v1")) return null;
    var d = JSON.parse(localStorage.getItem("bk-device-v1") || "null");
    if (!d || d.role !== "student") return null;
    var w = String(d.who || "").toLowerCase();
    if (/vina|fina|\u0641\u064a\u0646\u0627/.test(w)) return "vina";
    if (/^ara$|\bara\b|\u0622\u0631\u0627|\u0627\u0631\u0627|\u0626\u0627\u0631\u0627/.test(w)) return "ara";
  } catch (e) {}
  return null;
}
function route() {
  var h = decodeURIComponent((location.hash || "").replace(/^#\/?/, ""));
  var parts = h.split("/");
  var only = onlyStudent();
  if (only && DATA[only]) {
    if (parts[0] !== only) { parts = [only]; history.replaceState(null, "", "#" + only); }
  }
  if (parts[0] && DATA[parts[0]]) {
    if (parts[1] === "tasks") viewTasks(parts[0]); else if (parts[1]) viewSubject(parts[0], parts[1]); else viewStudent(parts[0]);
  } else {
    viewHome();
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
if (window.hubGate) window.hubGate();
route();
