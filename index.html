<style>
:root{
  --bg:#eef4f4; --ink:#1d2b2e; --muted:#5c6f73; --card:#ffffff; --line:#cfdcdc;
  --accent:#2f4a52; --accent-soft:#e6eeee;
  --vina:#3f82c4; --vina-soft:#e4eff9;
  --ara:#c1693b;  --ara-soft:#faece3;
  --gold:#c9a45c; --bar:#2f4a52;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); line-height:1.6;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic",Arial,sans-serif;
}
header{
  background:var(--bar); color:#fff; text-align:center; padding:20px 16px 16px;
  border-bottom:4px solid var(--gold);
}
header h1{margin:0;font-size:26px;letter-spacing:.3px}
header p{margin:4px 0 0;font-size:15px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.crumbs{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.back{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;
  font-size:15px;font-weight:600;min-height:40px;
}
.back:hover,.back:focus-visible{border-color:var(--accent)}
.where{color:var(--muted);font-size:14px}
h2.view-title{margin:0 0 12px;font-size:22px}
.grid{display:grid;gap:14px}
a.card{
  display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink);
  background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 20px;min-height:84px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
a.card .name{font-size:26px;font-weight:700}
a.card .meta{font-size:15px;color:var(--muted)}
a.card .native{font-size:20px;color:var(--muted)}
a.card.vina{border-inline-start:10px solid var(--vina)}
a.card.ara{border-inline-start:10px solid var(--ara)}
a.card.pic{padding:0;min-height:0;display:block;position:relative;overflow:hidden;border:3px solid var(--line)}
a.card.pic img{display:block;width:100%;height:auto}
a.card.pic .count{display:block;background:#fff;color:var(--muted);font-size:14px;font-weight:600;padding:4px 14px;text-align:center}
a.card.subject{border-inline-start:10px solid var(--accent)}
a.card.subject .meta{display:inline-block;margin-top:2px}
.arrow{font-size:24px;color:var(--muted);flex:none}
.theme-vina a.card.subject{border-inline-start-color:var(--vina)}
.theme-ara  a.card.subject{border-inline-start-color:var(--ara)}

a.lesson{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;border-radius:14px;text-decoration:none;color:var(--ink);
  border:2px solid transparent;min-height:64px;
}
.theme-vina a.lesson{background:var(--vina-soft)}
.theme-ara  a.lesson{background:var(--ara-soft)}
.theme-vina a.lesson:hover,.theme-vina a.lesson:focus-visible{border-color:var(--vina)}
.theme-ara  a.lesson:hover,.theme-ara  a.lesson:focus-visible{border-color:var(--ara)}
.title{font-size:18px;font-weight:600;flex:1}
.title[lang="ar"],.title[lang="ku"]{font-size:21px;line-height:1.9}
.tag{
  flex:none;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:#fff;color:var(--muted);border:1px solid var(--line);direction:ltr;
}
.sub{display:block;font-size:13px;color:var(--muted);font-weight:400;direction:ltr;text-align:left}
h3.prev{margin:22px 0 8px;font-size:15px;color:var(--muted);font-weight:600}
.prev-list{display:grid;gap:8px}
.prev-list a.lesson{background:#f6f8f8;border:1px solid var(--line);min-height:52px;padding:10px 14px}
.prev-list .title{font-size:17px;font-weight:500}
.empty{color:var(--muted);padding:12px 0}
noscript .plain{max-width:760px;margin:0 auto;padding:16px}
noscript .plain a{display:block;padding:10px 0}
.thanks{background:var(--card);border:2px solid var(--line);border-inline-start:8px solid var(--gold);border-radius:16px;padding:14px 18px;margin-top:8px;text-align:center}
.thanks .tn+.tn{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.thanks .sign{font-weight:700;color:var(--accent);margin:14px 0 2px;font-size:18px;border-top:1px dashed var(--line);padding-top:10px}
.thanks .tn[lang="ar"],.thanks .tn[lang="ku"]{font-size:1.08em}
.thanks h3{margin:0 0 6px;font-size:19px;color:var(--accent)}
.thanks p{margin:6px 0;font-size:16px;line-height:1.7;color:var(--ink)}
.hby{margin:2px 0 4px;font-size:19px;font-weight:700;color:var(--gold);letter-spacing:.3px}
.by{display:block;margin:10px 0 0;text-align:center;font-size:24px;font-weight:700;color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 24px}
</style>
</head>

var BANNERS = {
  vina: ["reading-writing","music","pe","kurdish","english","arabic","islamic","math","science","social-studies","social-value","ict","art"],
  ara: ["reading-writing","music","pe","kurdish","english","arabic","islamic","math","science","social-studies","social-value","ict","art"]
};

var STUDENTS = {
  vina: { name: "Vina", grade: "Grade 6", theme: "vina" },
  ara:  { name: "Ara",  grade: "Grade 7", theme: "ara" }
};

/* build DATA: subjects with lessons first, then the rest in the list order */
var DATA = {};
Object.keys(STUDENTS).forEach(function (sid) {
  var st = STUDENTS[sid], subs = SUBJECTS.map(function (s) {
    return {
      id: s.id, title: s.title, native: s.native, nativeLang: s.nativeLang,
      lessons: (LESSONS[sid] && LESSONS[sid][s.id]) || [],
      previous: (PREVIOUS[sid] && PREVIOUS[sid][s.id]) || []
    };
  });
  var withL = subs.filter(function (x) { return x.lessons.length; });
  var empty = subs.filter(function (x) { return !x.lessons.length; });
  DATA[sid] = { name: st.name, grade: st.grade, theme: st.theme, subjects: withL.concat(empty) };
});

var app = document.getElementById("app");
var hint = document.getElementById("hint");

function el(tag, attrs, children) {
  var n = document.createElement(tag);
  for (var k in (attrs || {})) {
    if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) { if (c) n.appendChild(c); });
  return n;
}
function backLink(href, label) {
  return el("a", { "class": "back", href: href, text: "← " + label });
}
function lessonLink(l) {
  var t = el("span", { "class": "title", lang: l.lang }, []);
  t.appendChild(document.createTextNode(l.title));
  if (l.sub) t.appendChild(el("span", { "class": "sub", text: l.sub }));
  return el("a", { "class": "lesson", href: l.href, dir: l.dir }, [
    t, el("span", { "class": "tag", text: l.tag })
  ]);
}

function viewHome() {
  hint.textContent = "Choose a student";
  document.title = "Ara & Vina — Lessons";
  var grid = el("div", { "class": "grid" }, []);
  ["vina", "ara"].forEach(function (id) {
    var s = DATA[id];
    grid.appendChild(el("a", { "class": "card " + s.theme, href: "#" + id }, [
      el("span", {}, [
        el("span", { "class": "name", text: s.name }),
        el("br"),
        el("span", { "class": "meta", text: s.grade })
      ]),
      el("span", { "class": "arrow", text: "›", "aria-hidden": "true" })
    ]));
  });
  function tn(lang, dir, title, text) {
    return el("div", { "class": "tn", lang: lang, dir: dir }, [
      el("h3", { text: title }), el("p", { text: text })
    ]);
  }
  grid.appendChild(el("div", { "class": "thanks" }, [
    tn("en", "ltr", "A word of thanks",
      "I truly appreciate the hard work and dedication that teachers give every day. These lessons are my small contribution to support their effort, and a humble thank-you for all they do. With my thanks and best wishes for success to all teachers and students."),
    tn("ar", "rtl", "كلمة شكر",
      "أُقدِّر جهد المعلمين وتعبهم كل يوم، وهذه الدروس مساعدة صغيرة مني لهم تقديراً لجهدهم، مع الشكر وخالص التوفيق لجميع المعلمين والطلاب."),
    tn("ku", "rtl", "پەیڤەکا سوپاسیێ",
      "ئەز ڕێزێ ل ماندیبوون و ڕەنجێن هەمی مامۆستایان دگرم. ئەڤ وانە هاریکارییەکا بچویکە ژ من بۆ وان. سوپاسی و سەرکەفتن بۆ هەمی مامۆستا و قوتابیان.")
    , el("p", { "class": "sign", dir: "ltr", text: "\u2014 Mahir Chalky" })
  ]));
  app.replaceChildren(grid);
}

function viewStudent(id) {
  var s = DATA[id];
  hint.textContent = s.name + " · " + s.grade;
  document.title = s.name + " — Lessons";
  var wrap = el("div", { "class": "theme-" + s.theme }, [
    el("div", { "class": "crumbs" }, [backLink("#", "Home"), el("span", { "class": "where", text: s.name + " · " + s.grade })]),
    el("h2", { "class": "view-title", text: "Choose a subject" })
  ]);
  var grid = el("div", { "class": "grid" }, []);
  s.subjects.forEach(function (sub) {
    if ((BANNERS[id] || []).indexOf(sub.id) > -1) {
      var cnt = sub.lessons.length;
      grid.appendChild(el("a", { "class": "card subject pic", href: "#" + id + "/" + sub.id, "aria-label": sub.title + " — " + (cnt ? cnt + (cnt === 1 ? " lesson" : " lessons") : "No lessons yet") }, [
        el("img", { src: "img/" + id + "/" + sub.id + ".jpg", alt: sub.title, loading: "lazy" }),
        el("span", { "class": "count", text: cnt ? (cnt + (cnt === 1 ? " lesson" : " lessons")) : "No lessons yet" })
      ]));
      return;
    }
    var left = el("span", {}, [el("span", { "class": "name", text: sub.title })]);
    if (sub.native) {
      left.appendChild(el("br"));
      left.appendChild(el("span", { "class": "native", lang: sub.nativeLang, text: sub.native }));
    }
    left.appendChild(el("br"));
    var n = sub.lessons.length;
    left.appendChild(el("span", { "class": "meta", text: n ? (n + (n === 1 ? " lesson" : " lessons")) : "No lessons yet" }));
    grid.appendChild(el("a", { "class": "card subject", href: "#" + id + "/" + sub.id }, [
      left, el("span", { "class": "arrow", text: "›", "aria-hidden": "true" })
    ]));
  });
  wrap.appendChild(grid);
  app.replaceChildren(wrap);
}

function viewSubject(id, subId) {
  var s = DATA[id];
  var sub = s.subjects.filter(function (x) { return x.id === subId; })[0];
  if (!sub) return viewStudent(id);
  hint.textContent = s.name + " · " + sub.title;
  document.title = s.name + " — " + sub.title;
  var wrap = el("div", { "class": "theme-" + s.theme }, [
    el("div", { "class": "crumbs" }, [
      backLink("#" + id, s.name),
      el("span", { "class": "where", text: s.name + " › " + sub.title })
    ]),
    el("h2", { "class": "view-title", text: sub.title })
  ]);
  var grid = el("div", { "class": "grid" }, []);
  sub.lessons.forEach(function (l) { grid.appendChild(lessonLink(l)); });
  if (!sub.lessons.length) grid.appendChild(el("p", { "class": "empty", text: "No lessons yet. They will appear here once they are added." }));
  wrap.appendChild(grid);
  if (sub.previous && sub.previous.length) {
    wrap.appendChild(el("h3", { "class": "prev", text: "Previous versions" }));
    var pl = el("div", { "class": "prev-list" }, []);
    sub.previous.forEach(function (l) { pl.appendChild(lessonLink(l)); });
    wrap.appendChild(pl);
  }
  app.replaceChildren(wrap);
}

function route() {
  var h = decodeURIComponent((location.hash || "").replace(/^#\/?/, ""));
  var parts = h.split("/");
  if (parts[0] && DATA[parts[0]]) {
    if (parts[1]) viewSubject(parts[0], parts[1]); else viewStudent(parts[0]);
  } else {
    viewHome();
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
