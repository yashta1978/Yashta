.0,19.54,57.82],[10.58,58.59,20.87,60.4],[10.58,61.17,19.87,62.99],[10.58,63.76,20.11,65.57]]]}],"mcq":false},{"id":"U3S3-5","pg":60,"sec":"Unit 3 - Section 3 Review","qn":"Q5","typ":4,"q":"What would happen if cytokinesis occurred without mitosis?","steps":["Say what mitosis does for the nucleus.","Say what cytokinesis divides."],"ans":"Mine, not from the book: The cytoplasm would divide but the nucleus would not. The new cells would not each receive the same number and types of chromosomes, so at least one new cell would have no complete set of chromosomes and could not work. (From the book: mitosis divides the nucleus and gives each new cell the same chromosomes, p.58; cytokinesis only divides the cytoplasm, p.59.)","src":"p.58, p.59; the conclusion is mine","st":"o","mine":true,"rp":[{"pg":58,"g":[[[10.58,48.67,59.56,50.44],[10.58,50.85,57.39,52.62]]]},{"pg":59,"g":[[[12.49,60.78,34.29,62.54],[12.49,62.53,34.29,64.29],[12.49,64.27,18.84,66.04]]]}],"mcq":false},{"id":"U3S3-6","pg":60,"sec":"Unit 3 - Section 3 Review","qn":"Q6","typ":4,"q":"How does mitosis ensure that a new cell is just like the parent cell?","steps":["Say what happens first (copying).","Say what mitosis guarantees."],"ans":"The chromosomes are copied first. Mitosis divides the nucleus so that each new cell receives the same number and types of chromosomes as the original cell.","src":"p.58, p.60","st":"b","sp":[{"pg":58,"g":[[[33.11,26.54,59.56,28.3],[10.58,28.72,50.88,30.49]],[[10.58,48.67,59.56,50.44],[10.58,50.85,57.39,52.62]]]},{"pg":60,"g":[[[16.91,27.81,63.49,29.57],[16.91,29.88,43.12,31.65]]]}],"mcq":false},{"id":"U3CR-1","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q1","typ":1,"q":"Define: endocytosis, exocytosis, diffusion, osmosis.","steps":["Large particles: in or out?","Small particles and water: which direction?"],"ans":"Endocytosis: a cell membrane surrounds a large particle and encloses it in a vesicle to bring it into the cell. Exocytosis: a cell releases a large particle by enclosing it in a vesicle and transporting it out. Diffusion: movement of particles from higher to lower concentration. Osmosis: the diffusion of water.","src":"p.48, p.49","st":"b","sp":[{"pg":49,"g":[[[11.78,22.43,31.71,24.19],[11.78,23.96,31.71,25.72],[11.78,25.49,31.71,27.25],[11.78,27.02,31.71,28.78],[11.78,28.55,29.48,30.31]],[[11.78,32.74,31.72,34.51],[11.78,34.27,31.71,36.04],[11.78,35.8,31.72,37.57],[11.78,37.33,31.71,39.1],[11.78,38.86,28.41,40.63]]]},{"pg":48,"g":[[[9.36,34.29,29.29,36.05],[9.36,35.82,29.29,37.58],[9.36,37.35,29.29,39.11],[9.36,38.88,13.46,40.64],[16.28,38.88,26.52,40.64]]]},{"pg":47,"g":[[[53.89,67.55,89.0,69.32],[36.06,69.52,89.0,71.28],[36.06,71.48,47.04,73.25]]]}],"mcq":false},{"id":"U3CR-2","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q2","typ":3,"q":"Differentiate between active transport and passive transport.","steps":["This is the same question as Section 1 Review Q1 (b), listed once."],"ans":"Passive transport: no energy, higher to lower concentration. Active transport: uses energy, lower to higher concentration.","src":"p.48","st":"b","dup":true,"sp":[{"pg":48,"g":[[[10.58,56.77,83.25,58.53]],[[10.58,62.97,89.0,64.74],[10.58,64.94,35.37,66.7]]]}],"mcq":false},{"id":"U3CR-3","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q3","typ":2,"q":"The process in which particles move through a cell membrane from low to high concentration: a. Diffusion b. Passive transport c. Active transport d. Fermentation.","steps":["Low to high is against the flow.","Which transport needs energy?"],"ans":"c. Active transport.","src":"p.48","st":"b","sp":[{"pg":48,"g":[[[10.58,62.97,89.0,64.74],[10.58,64.94,35.37,66.7]]]}],"mcq":true},{"id":"U3CR-4","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q4","typ":2,"q":"As a result of mitosis and cytokinesis ........ are produced: a. Two identical cells b. Two nuclei c. Chloroplast d. Two different cells.","steps":["Mitosis copies the same chromosomes.","Cytokinesis then splits the cell in two."],"ans":"a. Two identical cells.","src":"p.58, p.60","st":"b","sp":[{"pg":60,"g":[[[16.91,27.81,63.49,29.57],[16.91,29.88,43.12,31.65]]]}],"mcq":true},{"id":"U3CR-5","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q5","typ":2,"q":"Before the energy in food can be used by a cell, it must first be transferred to molecules of: a. Protein b. Carbohydrate c. DNA d. ATP.","steps":["Recall which molecule supplies energy directly to cells."],"ans":"d. ATP.","src":"p.53","st":"b","sp":[{"pg":53,"g":[[[56.39,42.03,65.77,43.79],[12.83,43.99,29.49,45.76]]]}],"mcq":true},{"id":"U3CR-6","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q6","typ":2,"q":"Which would form a cell plate during the cell cycle? a. A human cell b. A eukaryotic cell c. A plant cell d. All of the above.","steps":["Cell plate forms in cells that have a cell wall.","Do all eukaryotic cells have a cell wall? Do human cells?"],"ans":"c. A plant cell.","src":"p.59","st":"b","sp":[{"pg":59,"g":[[[80.73,66.01,88.88,67.77],[38.41,68.08,82.76,69.84]]]},{"pg":60,"g":[[[16.91,36.11,63.49,37.87],[16.91,38.18,25.33,39.95]]]}],"mcq":true},{"id":"U3CR-7","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q7","typ":4,"q":"Are exocytosis and endocytosis examples of active transport or passive transport? Explain.","steps":["Find where the book places them."],"ans":"Mine, not from the book: Both are active transport, because the cell uses energy to move large particles inside vesicles. (From the book: passive transport needs no energy and diffusion and osmosis are examples of it, p.48; large particles move by endocytosis and exocytosis, p.49.)","src":"p.48, p.49; the classification is mine","st":"o","mine":true,"rp":[{"pg":48,"g":[[[10.58,56.77,83.25,58.53]],[[10.58,62.97,89.0,64.74],[10.58,64.94,35.37,66.7]]]},{"pg":49,"g":[[[35.03,22.7,87.96,24.46]]]}],"mcq":false},{"id":"U3CR-8","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q8","typ":5,"q":"Name the structures needed for photosynthesis and the cell structures needed for cellular respiration.","steps":["Photosynthesis: where is chlorophyll found?","Respiration: where does it happen in eukaryotic cells?"],"ans":"Photosynthesis: chloroplasts (with chlorophyll). Cellular respiration: mitochondria in eukaryotic cells (in prokaryotic cells it takes place in the cell membrane).","src":"p.35, p.52, p.53","st":"b","sp":[{"pg":35,"g":[[[29.74,42.05,62.96,43.82],[11.53,43.69,39.98,45.46]]]},{"pg":53,"g":[[[42.54,45.96,65.77,47.72],[12.83,47.92,60.89,49.69]]]}],"mcq":false},{"id":"U3CR-9","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q9","typ":6,"q":"Describe the stages of the cell cycle in a eukaryotic cell.","steps":["Two main stages: interphase, then cell division.","Cell division has mitosis (4 phases) then cytokinesis.","One short line for each."],"ans":"1) Interphase: the cell grows and copies its organelles and chromosomes; each chromosome has two chromatids. 2) Cell division: the nucleus divides by mitosis. Prophase: nuclear membrane dissolves, chromosomes become visible. Metaphase: chromosomes line up. Anaphase: chromosomes separate and move to opposite poles. Telophase: nucleus membrane forms around each set. Then cytokinesis divides the cytoplasm into two halves.","src":"p.58, p.59","st":"b","err":[{"k":"typo","m":"The figure label 'Centeromere' should be 'Centromere', as the text spells it."}],"sp":[{"pg":58,"g":[[[12.4,34.31,59.56,36.12],[10.58,36.51,55.05,38.28]],[[12.68,43.43,24.51,45.55],[10.58,46.49,46.01,48.25]],[[10.58,53.44,34.26,55.2],[10.58,56.0,19.54,57.82],[10.58,58.59,20.87,60.4],[10.58,61.17,19.87,62.99],[10.58,63.76,20.11,65.57]]]}],"mcq":false},{"id":"U3CR-10","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q10","typ":6,"q":"Use the terms to create a concept map: chromosome duplication, cytokinesis, prokaryotic cells, mitosis, cell cycle, binary fission, eukaryotic cells.","steps":["Top: cell cycle.","Left branch: prokaryotic cells then binary fission.","Right branch: eukaryotic cells, then chromosome duplication, then mitosis, then cytokinesis."],"ans":"Cell cycle: prokaryotic cells divide by binary fission. Eukaryotic cells copy their chromosomes (chromosome duplication), then divide the nucleus by mitosis, then the cytoplasm by cytokinesis. The linking words are Mine, not from the book.","src":"p.57, p.58, p.59","st":"b","sp":[{"pg":57,"g":[[[77.09,42.63,88.49,44.4],[35.56,44.6,61.49,46.36]],[[64.86,64.15,88.49,65.91],[35.56,66.11,45.99,67.88]]]},{"pg":58,"g":[[[33.11,26.54,59.56,28.3],[10.58,28.72,50.88,30.49]]]},{"pg":60,"g":[[[16.91,31.96,63.49,33.72],[16.91,34.03,24.97,35.8]]]}],"mcq":false},{"id":"U3CR-11","pg":61,"sec":"Unit 3 - Chapter Review","qn":"Q11","typ":4,"q":"Why would muscle cells need to be supplied with more food when there is a lack of oxygen?","steps":["Without oxygen, which process do muscle cells use?","Compare how much energy it releases."],"ans":"Without enough oxygen, muscle cells use fermentation. Fermentation releases less energy from a given food than cellular respiration does, so more food is needed to get the same energy.","src":"p.53","st":"b","sp":[{"pg":53,"g":[[[23.54,73.75,65.77,75.52],[12.83,75.72,20.97,77.48]],[[12.83,27.03,65.77,28.79],[12.83,28.99,26.75,30.76]]]}],"mcq":false}],"TYPES":{"1":"Type 1 - Define","2":"Type 2 - Choose","3":"Type 3 - Compare","4":"Type 4 - Explain / Why","5":"Type 5 - Name / List","6":"Type 6 - Figure / Map"},"DEFS":[["Cell","The smallest structural unit of the living things that can perform all life processes.",9],["Stimulus","Anything that causes a reaction or change in an organism or any part of an organism.",10],["Asexual reproduction","Reproduction in which one parent produces offspring identical to itself.",10],["Sexual reproduction","Reproduction in which the sex cells from two parents unite, producing offspring that share traits from both parents.",10],["Heredity","The passing of genetic traits from parent to offspring.",11],["Metabolism","The sum of all chemical processes that occur in an organism.",11],["Producer","An organism that can make its own food by using energy from its surroundings.",15],["Consumer","An organism that cannot make its own food therefore eats other organisms or organic matter.",15],["Decomposers","An organism that breaks down the remains of dead organisms or animal wastes to obtain energy and nutrients.",15],["Protein","A large molecule made up of smaller subunits called amino acids.",16],["Carbohydrate","A class of energy giving nutrients that includes sugars, starch, and fibers.",17],["Nucleic acids","A molecule made up of subunits called nucleotides.",18],["Organ","A collection of tissues that work together to carry out a specialized function.",39],["Organ system","A group of organs that work together to perform body functions.",39],["Organism","A living thing that can carry out life processes independently.",39],["Diffusion","Movement of particles from regions of higher concentration to regions of lower concentration.",48],["Passive transport","The movement of substances across a cell membrane without the use of energy, from higher to lower concentration.",48],["Active transport","The movement of substances across the cell membrane from lower to higher concentration; it requires the cell to use energy.",48],["Endocytosis","The process by which a cell membrane surrounds a large particle and encloses it in a vesicle to bring the particle into the cell.",49],["Exocytosis","The process in which a cell releases a large particle by enclosing it in a vesicle, then transporting the particle out of the cell.",49],["Photosynthesis","The process by which plants, algae, and some bacteria use sunlight, water, and carbon dioxide to make food.",52],["Pigments","Molecules that absorb light energy are called pigments.",52],["Cell division","The process by which cells increase in number.",57],["Cell cycle","The life cycle of a cell; the different stages in the life of a cell.",57],["Binary fission","Cell division in bacteria. It results in two cells that each contain one copy of the circle DNA.",57],["Chromosome","A thread like structure made up of protein and DNA, located inside the nucleus of a eukaryotic cell.",58],["Cytokinesis","The division of the cytoplasm of a cell, after division of the nucleus.",59]],"FACTS":[["Cell theory","1) All organisms are made of one or more cells. 2) The cell is the basic structural and functional unit of all living things. 3) All cells come from other cells. Most cells are small because a cell that is too large cannot take in enough nutrients or pump out enough wastes."],["Kinds of cells","Prokaryotes (bacteria): no nucleus, no membrane bound organelles, circular DNA in the cytoplasm, ribosomes, cell wall, flagella. Eukaryotes: nucleus and membrane bound organelles; single-celled or multicellular."],["Organelles","ER: makes and transports proteins and lipids. Ribosomes: make proteins. Mitochondria: energy production (ATP). Golgi complex: packages and distributes proteins. Lysosome: digestion inside the cell, mainly in animal cells. Chloroplast: photosynthesis, in plant and algae cells. Vacuole: stores water and other materials."],["Unit 2","Four levels: cell, tissue, organ, organ system. A part's structure and function are related. Cell theory: all cells come from other cells."],["Transport","Diffusion and osmosis are passive (no energy, high to low). Active transport uses energy (low to high). Large particles: endocytosis in, exocytosis out."],["Cell energy","Photosynthesis makes glucose and oxygen using sunlight, water and CO2. Cellular respiration uses oxygen to break down glucose. Fermentation needs no oxygen and releases less energy."],["Cell cycle","Interphase (copy chromosomes), then mitosis: prophase, metaphase, anaphase, telophase, then cytokinesis. Plant cells form a cell plate."],["Mitosis stages","Prophase: nuclear membrane dissolves, chromosomes condensed and visible. Metaphase: chromosomes line up in the middle. Anaphase: chromosomes separate and move to opposite poles. Telophase: a nuclear membrane forms around each set of chromosomes."],["Fermentation","Two kinds: lactic acid fermentation (muscle cells of animals, some fungi and bacteria) and alcoholic fermentation (yeast and some bacteria; forms alcohol and carbon dioxide)."]],"EX":[{"t":"op","q":"Name four chemical activities in living things that require energy.","pts":["Making food, breaking down food, moving materials into and out of cells, and building cells."],"m":"Making food, breaking down food, moving materials into and out of cells, and building cells.","l":"U1S1-SC1","mine":false},{"t":"op","q":"Define: cell, stimuli.","pts":["Cell: the smallest structural unit of the living things that can perform all life processes.","Stimulus (stimuli): anything that causes a reaction or change in an organism or any part of an organism."],"m":"Cell: the smallest structural unit of the living things that can perform all life processes. Stimulus (stimuli): anything that causes a reaction or change in an organism or any part of an organism.","l":"U1S1-1","mine":false},{"t":"mc","q":"What do organisms pass to their offspring?","o":["Their cells","Stimuli","A copy of DNA","A copy of their cells"],"a":2,"w":"c. A copy of DNA.","l":"U1S1-2","mine":false},{"t":"op","q":"What are the differences between asexual and sexual reproduction?","pts":["Asexual reproduction: a single parent produces offspring identical to itself (most single-celled organisms).","Sexual reproduction: two parents (sex cells unite) produce offspring that share traits from both parents (most animals and plants)."],"m":"Asexual reproduction: a single parent produces offspring identical to itself (most single-celled organisms). Sexual reproduction: two parents (sex cells unite) produce offspring that share traits from both parents (most animals and plants).","l":"U1S1-3","mine":false},{"t":"op","q":"What are the six characteristics of living things?","pts":["1) They are made of one or more cells.","2) They sense and respond to stimuli.","3) They reproduce, asexually or sexually.","4) They have DNA.","5) They use energy (metabolism).","6) They grow and develop."],"m":"1) They are made of one or more cells. 2) They sense and respond to stimuli. 3) They reproduce, asexually or sexually. 4) They have DNA. 5) They use energy (metabolism). 6) They grow and develop.","l":"U1S1-4","mine":false},{"t":"op","q":"At home, how do you respond to some stimuli such as loud voice and light? Explain.","pts":["A stimulus is any change in the environment that affects an organism, such as light or sound (p.10).","Book example: when your pupils are exposed to light they become smaller.","for a loud voice I turn toward it or cover my ears, and for bright light I squint or close my eyes."],"m":"A stimulus is any change in the environment that affects an organism, such as light or sound (p.10). Book example: when your pupils are exposed to light they become smaller. Mine, not from the book: for a loud voice I turn toward it or cover my ears, and for bright light I squint or close my eyes.","l":"U1S1-5","mine":true},{"t":"op","q":"What process do plants use to make food?","pts":["Photosynthesis."],"m":"Photosynthesis.","l":"U1S2-SC1","mine":false},{"t":"op","q":"Define: proteins, nucleic acids, ATP.","pts":["Protein: a large molecule made up of smaller subunits called amino acids.","Nucleic acid: a molecule made up of subunits called nucleotides (two types, DNA and RNA).","ATP: the major energy-carrying molecule in the cell."],"m":"Protein: a large molecule made up of smaller subunits called amino acids. Nucleic acid: a molecule made up of subunits called nucleotides (two types, DNA and RNA). ATP: the major energy-carrying molecule in the cell.","l":"U1S2-1","mine":false},{"t":"op","q":"What is the difference between producer and consumer?","pts":["A producer can make its own food by using energy from its surroundings.","A consumer cannot make its own food, so it eats other organisms or organic matter."],"m":"A producer can make its own food by using energy from its surroundings. A consumer cannot make its own food, so it eats other organisms or organic matter.","l":"U1S2-2","mine":false},{"t":"op","q":"Explain why organisms need food, water, air and a living place.","pts":["Food gives energy and the raw materials (nutrients) to carry on life processes, replace destroyed cells and build body parts.","Water: cells are about 70% water and the chemical reactions of metabolism need it.","Air: most living things use oxygen to release energy from food, and plants, algae and some bacteria use carbon dioxide to make food.","A place to live gives the space an organism needs to survive."],"m":"Food gives energy and the raw materials (nutrients) to carry on life processes, replace destroyed cells and build body parts. Water: cells are about 70% water and the chemical reactions of metabolism need it. Air: most living things use oxygen to release energy from food, and plants, algae and some bacteria use carbon dioxide to make food. A place to live gives the space an organism needs to survive.","l":"U1S2-3","mine":false},{"t":"op","q":"What are the subunits of proteins?","pts":["Amino acids."],"m":"Amino acids.","l":"U1S2-4","mine":false},{"t":"op","q":"Why are decomposers categorized as consumers? How do they differ from producers?","pts":["A decomposer cannot make its own food, so it is a consumer.","It breaks down the remains of dead organisms or animal wastes to get energy and nutrients.","A producer makes its own food using energy from its surroundings."],"m":"A decomposer cannot make its own food, so it is a consumer. It breaks down the remains of dead organisms or animal wastes to get energy and nutrients. A producer makes its own food using energy from its surroundings.","l":"U1S2-5","mine":false},{"t":"op","q":"Could life as we know exist on earth if air contained only oxygen? Explain.","pts":["The book says air is a mixture of gases including oxygen and carbon dioxide, and plants, algae and some bacteria need carbon dioxide to make food and oxygen (p.14).","with only oxygen there would be no carbon dioxide, so plants could not make food, and the other organisms depend on that food.","So life as we know it could not exist."],"m":"The book says air is a mixture of gases including oxygen and carbon dioxide, and plants, algae and some bacteria need carbon dioxide to make food and oxygen (p.14). Mine, not from the book: with only oxygen there would be no carbon dioxide, so plants could not make food, and the other organisms depend on that food. So life as we know it could not exist.","l":"U1S2-6","mine":true},{"t":"op","q":"What would happen to the supply of ATP in your cells if you did not eat enough carbohydrate? How would this affect your body cell?","pts":["The book says carbohydrates are the main source of energy and that their stored energy must be transferred to ATP, which fuels the cell activities (p.17, p.18).","with too little carbohydrate the cells would make less ATP, so they would have less fuel for their activities."],"m":"The book says carbohydrates are the main source of energy and that their stored energy must be transferred to ATP, which fuels the cell activities (p.17, p.18). Mine, not from the book: with too little carbohydrate the cells would make less ATP, so they would have less fuel for their activities.","l":"U1S2-7","mine":true},{"t":"op","q":"Which resource do you think is most important to your survival: water, air, a place to live or food? Explain your answer.","pts":["The book does not rank them;","it says almost every organism needs all four (p.14).","water or air.","For example, the book says you could survive only about three days without water (p.14), and cells use oxygen to release energy from food.","Any choice with a reason is fine."],"m":"The book does not rank them; it says almost every organism needs all four (p.14). Mine, not from the book: water or air. For example, the book says you could survive only about three days without water (p.14), and cells use oxygen to release energy from food. Any choice with a reason is fine.","l":"U1S2-8","mine":true},{"t":"op","q":"Define: lipids, carbohydrates, consumers, decomposers.","pts":["Lipid: a class of nutrients that does not dissolve in water, such as oil and fat.","Carbohydrate: a class of energy-giving nutrients that includes sugars, starch and fibers.","Consumer: an organism that cannot make its own food, so it eats other organisms or organic matter.","Decomposer: an organism that breaks down the remains of dead organisms or animal wastes to obtain energy and nutrients."],"m":"Lipid: a class of nutrients that does not dissolve in water, such as oil and fat. Carbohydrate: a class of energy-giving nutrients that includes sugars, starch and fibers. Consumer: an organism that cannot make its own food, so it eats other organisms or organic matter. Decomposer: an organism that breaks down the remains of dead organisms or animal wastes to obtain energy and nutrients.","l":"U1CR-1","mine":false},{"t":"mc","q":"Which of the following statements about cells is true?","o":["cells are the structures that contain all of the materials necessary for life","cells are found in all organisms","cells are sometimes specialized for particular functions","all of the above"],"a":3,"w":"d. all of the above.","l":"U1CR-2","mine":false},{"t":"mc","q":"Which of the following statements about all living things is true?","o":["all living things reproduce sexually","all living things have one or more cells","all living things must make their own food","all living things reproduce asexually"],"a":1,"w":"b. all living things have one or more cells.","l":"U1CR-3","mine":false},{"t":"mc","q":"Organisms must have food because...","o":["food is source of energy","food supplies cells with oxygen","organisms never make their own food","all of the above"],"a":0,"w":"a. food is source of energy.","l":"U1CR-4","mine":false},{"t":"mc","q":"A change in an organism's environment that affects the organism's activities is a:","o":["response","stimulus","metabolism","producer"],"a":1,"w":"b. stimulus.","l":"U1CR-5","mine":false},{"t":"mc","q":"The molecule that contains the information about how to make protein is...","o":["ATP","a carbohydrate","DNA","lipid"],"a":2,"w":"c. DNA.","l":"U1CR-6","mine":false},{"t":"op","q":"The subunits of nucleic acids are... a. nucleotides. b. oils. c. sugars. d. amino acids.","pts":["nucleotides."],"m":"a. nucleotides.","l":"U1CR-7","mine":false},{"t":"op","q":"What is the difference between asexual reproduction and sexual reproduction?","pts":["Asexual reproduction: a single parent produces offspring identical to itself.","Sexual reproduction: two parents produce offspring that share characteristics of both parents."],"m":"Asexual reproduction: a single parent produces offspring identical to itself. Sexual reproduction: two parents produce offspring that share characteristics of both parents.","l":"U1CR-8","mine":false},{"t":"op","q":"Explain briefly why living things need air.","pts":["Air is a mixture of gases.","Animals, plants and most living things use oxygen in a chemical process that releases energy from food.","Green plants, algae and some bacteria need carbon dioxide for photosynthesis, through which they make food and oxygen."],"m":"Air is a mixture of gases. Animals, plants and most living things use oxygen in a chemical process that releases energy from food. Green plants, algae and some bacteria need carbon dioxide for photosynthesis, through which they make food and oxygen.","l":"U1CR-9","mine":false},{"t":"op","q":"What is ATP and why is it important to a cell?","pts":["ATP (adenosine triphosphate) is the major energy-carrying molecule in the cell.","The energy stored in carbohydrates and lipids is transferred to ATP, and ATP then provides fuel for the cell activities."],"m":"ATP (adenosine triphosphate) is the major energy-carrying molecule in the cell. The energy stored in carbohydrates and lipids is transferred to ATP, and ATP then provides fuel for the cell activities.","l":"U1CR-10","mine":false},{"t":"op","q":"Use the terms to create a concept map: cell, protein, enzymes, sugars, lipids, nucleotides and nucleic acid.","pts":["A cell is made of molecules: proteins (subunits: amino acids;","enzymes are proteins), carbohydrates (made of sugars), lipids, and nucleic acids (subunits: nucleotides;","DNA and RNA)."],"m":"A cell is made of molecules: proteins (subunits: amino acids; enzymes are proteins), carbohydrates (made of sugars), lipids, and nucleic acids (subunits: nucleotides; DNA and RNA). The linking words are Mine, not from the book.","l":"U1CR-11","mine":false},{"t":"op","q":"What are the three principles of the cell theory?","pts":["1) All organisms are made of one or more cells.","2) The cell is the basic structural and functional unit of all living things.","3) All cells come from other cells."],"m":"1) All organisms are made of one or more cells. 2) The cell is the basic structural and functional unit of all living things. 3) All cells come from other cells.","l":"U2S1-SC1","mine":false},{"t":"op","q":"Why are most cells small?","pts":["Cells take in food and get rid of wastes through their cell membrane.","As the cell volume increases, its surface area grows too, but if the cell gets too large the surface area is not large enough to take in enough nutrients or pump out enough wastes.","This is the reason why cells are small."],"m":"Cells take in food and get rid of wastes through their cell membrane. As the cell volume increases, its surface area grows too, but if the cell gets too large the surface area is not large enough to take in enough nutrients or pump out enough wastes. This is the reason why cells are small.","l":"U2S1-SC2","mine":false},{"t":"op","q":"Define: organelles, cell membrane.","pts":["Organelles: small structures found in a cell's cytoplasm that perform a specific function.","Cell membrane: the protective layer that covers the cell's surface and acts as a barrier;","it separates the cell's contents from its environment and controls materials going into and out of the cell."],"m":"Organelles: small structures found in a cell's cytoplasm that perform a specific function. Cell membrane: the protective layer that covers the cell's surface and acts as a barrier; it separates the cell's contents from its environment and controls materials going into and out of the cell.","l":"U2S1-1","mine":false},{"t":"mc","q":"Which scientist maintained that plants are made of cells?","o":["Schwann","Schleiden","Virchow","Mendel"],"a":1,"w":"b. Schleiden.","l":"U2S1-2","mine":false},{"t":"op","q":"Write the three principles of cell theory.","pts":["1) All organisms are made of one or more cells.","2) The cell is the basic structural and functional unit of all living things.","3) All cells come from other cells."],"m":"1) All organisms are made of one or more cells. 2) The cell is the basic structural and functional unit of all living things. 3) All cells come from other cells.","l":"U2S1-3","mine":false},{"t":"op","q":"Name three structures that every cell has.","pts":["Cell membrane, cytoplasm and DNA."],"m":"Cell membrane, cytoplasm and DNA.","l":"U2S1-4","mine":false},{"t":"op","q":"What would occur if a cell's volume gets too much larger than its normal size?","pts":["The cell surface area would not be large enough to take in enough nutrients or pump out enough wastes."],"m":"The cell surface area would not be large enough to take in enough nutrients or pump out enough wastes.","l":"U2S1-5","mine":false},{"t":"op","q":"Write some characteristics of bacterial cells.","pts":["Bacteria are the smallest organisms and are prokaryotes.","They have no nucleus;","their genetic material is a long circular DNA molecule scattered in the cytoplasm.","They have no membrane bound organelles but have small ribosomes that make proteins.","Most have a strong cell wall that helps the cell keep its shape, and they use flagella for movement."],"m":"Bacteria are the smallest organisms and are prokaryotes. They have no nucleus; their genetic material is a long circular DNA molecule scattered in the cytoplasm. They have no membrane bound organelles but have small ribosomes that make proteins. Most have a strong cell wall that helps the cell keep its shape, and they use flagella for movement.","l":"U2S2-SC1","mine":false},{"t":"op","q":"What is the difference between prokaryotes and eukaryotes?","pts":["Prokaryotes have no nucleus and no membrane bound organelles (for example bacteria).","Eukaryotes have a nucleus, which is a membrane bound organelle that contains the cell's DNA, and other membrane bound organelles.","Eukaryotes can be single-celled or multicellular."],"m":"Prokaryotes have no nucleus and no membrane bound organelles (for example bacteria). Eukaryotes have a nucleus, which is a membrane bound organelle that contains the cell's DNA, and other membrane bound organelles. Eukaryotes can be single-celled or multicellular.","l":"U2S2-SC2","mine":false},{"t":"op","q":"Define: prokaryotes, lysosomes, ribosomes.","pts":["Prokaryotes: single-celled organisms that do not have a nucleus and membrane bound organelles, such as bacteria.","Lysosomes: vesicles responsible for the digestion inside the cell;","they contain digestive enzymes.","Ribosomes: organelles that make proteins;","the site of protein synthesis."],"m":"Prokaryotes: single-celled organisms that do not have a nucleus and membrane bound organelles, such as bacteria. Lysosomes: vesicles responsible for the digestion inside the cell; they contain digestive enzymes. Ribosomes: organelles that make proteins; the site of protein synthesis.","l":"U2S2-1","mine":false},{"t":"mc","q":"Which of the followings are found mainly in animal cells?","o":["mitochondria","lysosome","ribosome","Golgi complex"],"a":1,"w":"b. lysosome.","l":"U2S2-2","mine":false},{"t":"op","q":"Write two differences between animal cells and plant cells.","pts":["1) Plant cells have a cell wall (the cells of plants, algae, fungi and bacteria do);","animal cells do not.","2) Plant cells have chloroplasts for photosynthesis;","animal cells cannot make their own food.","(Also: lysosomes are found mainly in animal cells, and plant cells have a large central vacuole.)"],"m":"1) Plant cells have a cell wall (the cells of plants, algae, fungi and bacteria do); animal cells do not. 2) Plant cells have chloroplasts for photosynthesis; animal cells cannot make their own food. (Also: lysosomes are found mainly in animal cells, and plant cells have a large central vacuole.)","l":"U2S2-3","mine":false},{"t":"op","q":"Why do all cells need ribosomes?","pts":["Ribosomes are the site of protein synthesis, they make proteins, and all cells need proteins."],"m":"Ribosomes are the site of protein synthesis, they make proteins, and all cells need proteins.","l":"U2S2-4","mine":false},{"t":"op","q":"Do you think that having chloroplast gives plant cells an advantage over animal cells? Support your opinion.","pts":["Yes.","Chloroplasts are where photosynthesis takes place (p.35), so plant cells can make their own food from sunlight, water and carbon dioxide.","Animal cells cannot make their own food (p.35)."],"m":"Yes. Chloroplasts are where photosynthesis takes place (p.35), so plant cells can make their own food from sunlight, water and carbon dioxide. Animal cells cannot make their own food (p.35).","l":"U2S2-5","mine":false},{"t":"op","q":"The picture shows a particular organism. a. What is the name of this organism? b. Which structure helps the organism move? c. What part does the letter A represent?","pts":["a) A bacterium (a bacterial cell, like Figure 1 on p.31).","b) The flagellum (bacteria use flagella for movement, p.31).","c) A points to the coiled threads in the cytoplasm, which is the genetic material: the long circular DNA molecule."],"m":"a) A bacterium (a bacterial cell, like Figure 1 on p.31). b) The flagellum (bacteria use flagella for movement, p.31). c) Mine, not from the book: A points to the coiled threads in the cytoplasm, which is the genetic material: the long circular DNA molecule.","l":"U2S2-6","mine":true},{"t":"op","q":"Define the following: tissue, organ, organ system.","pts":["Tissue: a group of cells that work together to perform a specific job.","Organ: two or more tissues working together to perform a specific function.","Organ system: a group of organs working together to perform a particular function."],"m":"Tissue: a group of cells that work together to perform a specific job. Organ: two or more tissues working together to perform a specific function. Organ system: a group of organs working together to perform a particular function.","l":"U2S3-1","mine":false},{"t":"mc","q":"The four levels of organization in organisms:","o":["cell, multicellular, organ, organ system","unicellular, multicellular, tissue, organ","organ system, unicellular, multicellular, organ","cell, tissue, organ, organ system"],"a":3,"w":"d. cell, tissue, organ, organ system.","l":"U2S3-2","mine":false},{"t":"mc","q":"The tissue where photosynthesis takes place:","o":["xylem","phloem","transport","ground"],"a":3,"w":"d. ground tissue.","l":"U2S3-3","mine":false},{"t":"op","q":"Explain the relationship between structure and function with an example.","pts":["Structure is the arrangement of the parts of an organism (the shape of a part and the material it is made of).","Function is the job the part does.","They are related.","Example: the lungs are a large spongy sac with millions of tiny air sacs (alveoli) wrapped by blood capillaries.","This structure lets them bring oxygen to the body and get rid of carbon dioxide."],"m":"Structure is the arrangement of the parts of an organism (the shape of a part and the material it is made of). Function is the job the part does. They are related. Example: the lungs are a large spongy sac with millions of tiny air sacs (alveoli) wrapped by blood capillaries. This structure lets them bring oxygen to the body and get rid of carbon dioxide.","l":"U2S3-4","mine":false},{"t":"op","q":"Name four organ systems of the human body, other than those mentioned.","pts":["1) Nervous system (brain and nerves).","2) Respiratory system (lungs).","3) Muscular system (muscles).","4) Excretory system (kidneys).","The book shows the organs brain, lungs and kidneys (Figure 2, p.39), nervous and muscle tissue (p.38) and the lungs with the air sacs (p.40), but it does not name these systems."],"m":"Mine, not from the book: 1) Nervous system (brain and nerves). 2) Respiratory system (lungs). 3) Muscular system (muscles). 4) Excretory system (kidneys). The book shows the organs brain, lungs and kidneys (Figure 2, p.39), nervous and muscle tissue (p.38) and the lungs with the air sacs (p.40), but it does not name these systems.","l":"U2S3-5","mine":true},{"t":"op","q":"Define the following: cell, organelle, cell wall, function.","pts":["Cell: the basic structural and functional unit of all living things.","Organelle: a small structure in the cell's cytoplasm that carries out a specific function.","Cell wall: a rigid external structure that surrounds the cell membrane and supports the cell.","Function: the special, or normal, activity performed by an organ or part of an organism."],"m":"Cell: the basic structural and functional unit of all living things. Organelle: a small structure in the cell's cytoplasm that carries out a specific function. Cell wall: a rigid external structure that surrounds the cell membrane and supports the cell. Function: the special, or normal, activity performed by an organ or part of an organism.","l":"U2CR-1","mine":false},{"t":"mc","q":"Which statement best describes an organ?","o":["a group of cells that work together to perform a specific job","a group of tissues that belong to different systems","a group of tissues that work together to perform a specific job","a body structure, such as muscles or lungs"],"a":2,"w":"c. a group of tissues that work together to perform a specific job.","l":"U2CR-2","mine":false},{"t":"mc","q":"In eukaryotic cells, which organelle contains DNA?","o":["nucleus","Golgi complex","smooth endoplasmic reticulum","vacuole"],"a":0,"w":"a. nucleus.","l":"U2CR-3","mine":false},{"t":"mc","q":"Which statement is part of the cell theory?","o":["all cells suddenly appear by themselves","All cells come from other cells","All organisms are multicellular","All cells have identical parts"],"a":1,"w":"b. All cells come from other cells.","l":"U2CR-4","mine":false},{"t":"ord","q":"Arrange the four levels of organization in living things from smallest to largest.","it":["cell","tissue","organ","organ system"],"w":"Cell, tissue, organ, organ system.","l":"U2CR-5","mine":false},{"t":"op","q":"Name two functions of the cell membrane.","pts":["1) It is a protective layer that acts as a barrier, separating the cell's contents from its environment.","2) It controls the materials going into and out of the cell."],"m":"1) It is a protective layer that acts as a barrier, separating the cell's contents from its environment. 2) It controls the materials going into and out of the cell.","l":"U2CR-6","mine":false},{"t":"op","q":"Use the terms to create a concept map: cells, organisms, Golgi complex, organ system, organ, nucleus, organelle, and tissues.","pts":["Organisms are made of organ systems, which are made of organs, which are made of tissues, which are made of cells.","A cell contains organelles, for example the nucleus and the Golgi complex.","The words linking the boxes are"],"m":"Organisms are made of organ systems, which are made of organs, which are made of tissues, which are made of cells. A cell contains organelles, for example the nucleus and the Golgi complex. The words linking the boxes are Mine, not from the book.","l":"U2CR-7","mine":false},{"t":"op","q":"Write the function of: endoplasmic reticulum, Golgi complex, cell wall.","pts":["Endoplasmic reticulum: a system of folded membranes where proteins, lipids and other materials are made, part of the cell's internal delivery system.","Golgi complex: packages and distributes proteins.","Cell wall: gives support to the cell."],"m":"Endoplasmic reticulum: a system of folded membranes where proteins, lipids and other materials are made, part of the cell's internal delivery system. Golgi complex: packages and distributes proteins. Cell wall: gives support to the cell.","l":"U2CR-8","mine":false},{"t":"op","q":"A classmate says that all organisms must have organ systems. Is the hypothesis valid? Explain.","pts":["Some organisms exist as a single cell.","Only multicellular organisms are arranged into the four levels (cell, tissue, organ, organ system)."],"m":"No. Some organisms exist as a single cell. Only multicellular organisms are arranged into the four levels (cell, tissue, organ, organ system).","l":"U2CR-9","mine":false},{"t":"op","q":"What would happen if all ribosomes in your cells disappeared?","pts":["Ribosomes are the site of protein synthesis, they make proteins.","Without them cells could not make proteins."],"m":"Ribosomes are the site of protein synthesis, they make proteins. Without them cells could not make proteins.","l":"U2CR-10","mine":false},{"t":"op","q":"Look at the figure and write the name and function of the parts labelled a, b, c, d.","pts":["a = Mitochondrion: the site of energy production in the cell, it releases energy as ATP (p.34).","b = Lysosome: digests materials inside the cell and destroys worn-out organelles (p.35).","c = Endoplasmic reticulum: a system of folded membranes where proteins and lipids are made and moved (p.34).","d = Nucleus: holds the DNA and controls the cell (p.28, p.32).","I matched the letters by comparing this picture with Figure 2 on p.32."],"m":"Mine, not from the book: a = Mitochondrion: the site of energy production in the cell, it releases energy as ATP (p.34). b = Lysosome: digests materials inside the cell and destroys worn-out organelles (p.35). c = Endoplasmic reticulum: a system of folded membranes where proteins and lipids are made and moved (p.34). d = Nucleus: holds the DNA and controls the cell (p.28, p.32). I matched the letters by comparing this picture with Figure 2 on p.32.","l":"U2CR-11","mine":true},{"t":"op","q":"Why do red blood cells burst when they are put in pure water?","pts":["Water molecules flood into the cells by osmosis and cause them to burst."],"m":"Water molecules flood into the cells by osmosis and cause them to burst.","l":"U3S1-5","mine":false},{"t":"op","q":"Write the differences between: diffusion and osmosis; active transport and passive transport; endocytosis and exocytosis.","pts":["Diffusion: movement of particles from higher to lower concentration.","Osmosis: the diffusion of water through a semipermeable membrane.","Passive transport: no energy, from higher to lower concentration.","Active transport: needs energy, from lower to higher concentration.","Endocytosis: a cell encloses a large particle in a vesicle to bring it into the cell.","Exocytosis: a vesicle carries a large particle out of the cell."],"m":"Diffusion: movement of particles from higher to lower concentration. Osmosis: the diffusion of water through a semipermeable membrane. Passive transport: no energy, from higher to lower concentration. Active transport: needs energy, from lower to higher concentration. Endocytosis: a cell encloses a large particle in a vesicle to bring it into the cell. Exocytosis: a vesicle carries a large particle out of the cell.","l":"U3S1-1","mine":false},{"t":"mc","q":"Moving particles from low concentration to high concentration requires:","o":["diffusion","energy","vesicle","osmosis"],"a":1,"w":"b. energy (active transport).","l":"U3S1-2","mine":false},{"t":"op","q":"Which structures allow small particles to cross the cell membrane?","pts":["Channels, passageways made of proteins in the cell membrane."],"m":"Channels, passageways made of proteins in the cell membrane.","l":"U3S1-3","mine":false},{"t":"op","q":"Why does active transport need energy?","pts":["Because it moves substances from an area of lower concentration to an area of higher concentration, and the book says this requires the cell to use energy."],"m":"Because it moves substances from an area of lower concentration to an area of higher concentration, and the book says this requires the cell to use energy.","l":"U3S1-4","mine":false},{"t":"op","q":"Differentiate between photosynthesis and cellular respiration.","pts":["Photosynthesis: plants, algae and some bacteria use sunlight, water and carbon dioxide to make food (glucose), and oxygen is released.","Cellular respiration: cells use oxygen to break down food (glucose) into carbon dioxide and water, and energy is released;","some of it is stored as ATP."],"m":"Photosynthesis: plants, algae and some bacteria use sunlight, water and carbon dioxide to make food (glucose), and oxygen is released. Cellular respiration: cells use oxygen to break down food (glucose) into carbon dioxide and water, and energy is released; some of it is stored as ATP.","l":"U3S2-SC1","mine":false},{"t":"op","q":"What are the two kinds of fermentation?","pts":["1) Lactic acid fermentation (in the muscle cells of animals and in some fungi and bacteria).","2) Alcoholic fermentation (in some bacteria and in yeast;","it forms alcohol and carbon dioxide)."],"m":"1) Lactic acid fermentation (in the muscle cells of animals and in some fungi and bacteria). 2) Alcoholic fermentation (in some bacteria and in yeast; it forms alcohol and carbon dioxide).","l":"U3S2-SC2","mine":false},{"t":"op","q":"Define: photosynthesis, cellular respiration.","pts":["Photosynthesis: the process by which plants, algae and some bacteria use sunlight, water and carbon dioxide to make food.","Cellular respiration: the process in which cells use oxygen to obtain energy from food."],"m":"Photosynthesis: the process by which plants, algae and some bacteria use sunlight, water and carbon dioxide to make food. Cellular respiration: the process in which cells use oxygen to obtain energy from food.","l":"U3S2-1","mine":false},{"t":"mc","q":"Oxygen is released during:","o":["cellular respiration","photosynthesis","breathing","fermentation"],"a":1,"w":"b. photosynthesis.","l":"U3S2-2","mine":false},{"t":"op","q":"What is the relation between photosynthesis and cellular respiration?","pts":["Photosynthesis uses water, carbon dioxide and sunlight energy to make glucose and releases oxygen.","Cellular respiration uses oxygen to break down glucose and releases energy, carbon dioxide and water.","Each process makes the materials needed for the other."],"m":"Photosynthesis uses water, carbon dioxide and sunlight energy to make glucose and releases oxygen. Cellular respiration uses oxygen to break down glucose and releases energy, carbon dioxide and water. Each process makes the materials needed for the other.","l":"U3S2-3","mine":false},{"t":"op","q":"How are cellular respiration and fermentation similar? How are they different?","pts":["Similar: both are ways cells get energy from food.","Different: cellular respiration uses oxygen and releases more energy from a given food;","fermentation releases energy without using oxygen and releases less."],"m":"Similar: both are ways cells get energy from food. Different: cellular respiration uses oxygen and releases more energy from a given food; fermentation releases energy without using oxygen and releases less.","l":"U3S2-4","mine":false},{"t":"op","q":"What is the importance of plants for the survival of other organisms?","pts":["Plants make food by photosynthesis, which supplies them with energy and becomes a source of energy for the organisms that eat plants.","Photosynthesis also produces oxygen."],"m":"Plants make food by photosynthesis, which supplies them with energy and becomes a source of energy for the organisms that eat plants. Photosynthesis also produces oxygen.","l":"U3S2-5","mine":false},{"t":"op","q":"Write two functions of the chlorophyll pigment.","pts":["1) It absorbs light energy (the energy of sunlight needed for photosynthesis).","2) It gives plants their green colour."],"m":"1) It absorbs light energy (the energy of sunlight needed for photosynthesis). 2) It gives plants their green colour.","l":"U3S2-6","mine":false},{"t":"op","q":"What is the difference between cytokinesis in an animal cell and in a plant cell?","pts":["Animal cell: the cell membrane pinches inward until it pinches all the way through and two daughter cells form.","Plant cell: a cell plate forms in the middle and extends outward;","a new cell wall forms where it was."],"m":"Animal cell: the cell membrane pinches inward until it pinches all the way through and two daughter cells form. Plant cell: a cell plate forms in the middle and extends outward; a new cell wall forms where it was.","l":"U3S3-7","mine":false},{"t":"op","q":"Define: cell cycle, cytokinesis.","pts":["Cell cycle: the life cycle of a cell (the different stages in the life of a cell).","Cytokinesis: the division of the cytoplasm of a cell, after division of the nucleus."],"m":"Cell cycle: the life cycle of a cell (the different stages in the life of a cell). Cytokinesis: the division of the cytoplasm of a cell, after division of the nucleus.","l":"U3S3-1","mine":false},{"t":"mc","q":"Eukaryotic cells:","o":["do not divide","undergo binary fission","undergo mitosis","have cell walls"],"a":2,"w":"c. undergo mitosis.","l":"U3S3-2","mine":false},{"t":"op","q":"Why is it important for chromosomes to be copied before cell division?","pts":["Copying the chromosomes ensures that each new cell will be an exact copy of its parent cell, with the same number and types of chromosomes."],"m":"Copying the chromosomes ensures that each new cell will be an exact copy of its parent cell, with the same number and types of chromosomes.","l":"U3S3-3","mine":false},{"t":"op","q":"Name the four stages of var CH=function(){return String.fromCharCode.apply(null,arguments)};
var RX_DIAC=new RegExp('['+CH(0x300)+'-'+CH(0x36F)+']','g');
function norm(s){
  s=String(s==null?'':s).normalize('NFD').replace(RX_DIAC,'');
  var o='';
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i);
    if(/[a-z0-9\s]/i.test(c)) o+=c; else o+=' ';
  }
  return o.replace(/\s+/g,' ').trim().toLowerCase();
}
function keysOk(ans,keys){
  var a=norm(ans); if(!a) return false;
  return keys.every(function(g){return g.some(function(k){return a.indexOf(norm(k))>-1})});
}
function checkIntegrity(cards){
  var errs=[],ids={};
  cards.forEach(function(c){
    if(ids[c.id]) errs.push('duplicate id: '+c.id); ids[c.id]=1;
    if(c.type==='mc'){
      if(!c.opts||c.opts.length<2) errs.push(c.id+': options missing');
      if(!(c.a>=0&&c.a<c.opts.length)) errs.push(c.id+': answer index outside options');
      if(new Set(c.opts.map(norm)).size!==c.opts.length) errs.push(c.id+': repeated options');
    }
    if(c.type==='fl'){
      if(!c.keys||!c.keys.length) errs.push(c.id+': no keys');
      else if(!keysOk(c.sol,c.keys)) errs.push(c.id+': model answer fails its own keys');
    }
    if(c.type==='mt'){
      if(c.L.length!==c.R.length) errs.push(c.id+': matching columns differ in length');
      if(new Set(c.L.map(norm)).size!==c.L.length||new Set(c.R.map(norm)).size!==c.R.length) errs.push(c.id+': repeated items in matching');
    }
    if(c.type==='op'&&!c.sol) errs.push(c.id+': no model answer');
    if(c.type==='ord'&&(!c.items||c.items.length<2)) errs.push(c.id+': ordering items missing');
  });
  return errs;
}

function nl(s){
  if(typeof s!=='string')return s;
  function seq(toks){
    var pos=[],from=0;
    for(var k=0;k<toks.length;k++){
      var i=(k===0&&s.indexOf(toks[0]+' ')===0)?0:s.indexOf(' '+toks[k]+' ',from);
      if(i<0)break;pos.push(i);from=i+1+toks[k].length;
    }
    return pos;
  }
  var kinds=[['1)','2)','3)','4)','5)','6)','7)','8)','9)'],['a.','b.','c.','d.','e.'],['a)','b)','c)','d)','e)'],['A.','B.','C.','D.','E.']];
  for(var q=0;q<kinds.length;q++){
    var pos=seq(kinds[q]);
    if(pos.length>=2){
      var out='',last=0;
      pos.forEach(function(i,k){if(i>0){out+=s.slice(last,i)+'\n';last=i+1}});
      return out+s.slice(last);
    }

function pad2(n){return (n<10?'0':'')+n}
function dkey(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function dshow(k){var p=String(k).split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function addWork(days){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);while(d.getDay()===5||d.getDay()===6)d.setDate(d.getDate()+1);return dkey(d)}

// ----- saving on this device, and a code to move progress to another device -----
function snapshot(){return {v:1,LS:LS,READY:READY,KNOWN:KNOWN,SBW:SBW,PASSED:PASSED,GSC:GSC,GREAD:GREAD,GRES:GRES,REV:REV,PS:PS}}
function applySnap(o){
  function fill(dst,src){Object.keys(dst).forEach(function(k){delete dst[k]});if(src&&typeof src==='object'){Object.keys(src).forEach(function(k){dst[k]=src[k]})}}
  fill(LS,o.LS);fill(READY,o.READY);fill(KNOWN,o.KNOWN);fill(SBW,o.SBW);fill(GSC,o.GSC);fill(GREAD,o.GREAD);fill(GRES,o.GRES);fill(REV,o.REV);
  PASSED=!!o.PASSED;
  if(o.PS&&typeof o.PS==='object'){PS.s=(o.PS.s&&typeof o.PS.s==='object')?o.PS.s:{};PS.u=(o.PS.u&&typeof o.PS.u==='object')?o.PS.u:{};PS.v=(o.PS.v&&typeof o.PS.v==='object')?o.PS.v:{};PS.b=(o.PS.b&&typeof o.PS.b==='object')?o.PS.b:{};PS.st=(o.PS.st&&typeof o.PS.st==='object')?o.PS.st:{};PS.wd=(o.PS.wd&&typeof o.PS.wd==='object')?o.PS.wd:{};PS.log=(o.PS.log&&typeof o.PS.log==='object')?o.PS.log:{};PS.dw=(o.PS.dw&&typeof o.PS.dw==='object')?o.PS.dw:{}}
  Object.keys(REV).forEach(function(id){var r=REV[id];if(!LB[id]||!r||typeof r.b!=='number'||typeof r.d!=='string')delete REV[id]});
}
function saveNow(){try{var s=JSON.stringify(snapshot());if(s!==LASTJSON){localStorage.setItem(SKEY,s);LASTJSON=s}}catch(e){SAVEOK=false}}
function loadSaved(){try{var s=localStorage.getItem(SKEY);if(s){applySnap(JSON.parse(s));LASTJSON=s}}catch(e){SAVEOK=false}}
function makeCode(){return D.meta.code+'-'+btoa(unescape(encodeURIComponent(JSON.stringify(snapshot()))))}
function readCode(c){
  c=String(c||'').trim();if(c.indexOf(D.meta.code+'-')!==0)throw new Error('This is not a progress code.');
  var o=JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))));
  if(!o||o.v!==1)throw new Error('This code is not from this lesson.');
  return o;
}

function stAdd(key,f,n){var o=PS.st[key]||(PS.st[key]={});o[f]=(o[f]||0)+(n||1);var L=logDay();if(f==='c')L.a+=(n||1);else if(f==='w')L.w+=(n||1);else if(f==='f')L.f+=(n||1)}
function weakOf(key){var o=PS.st[key];if(!o)return 0;return Math.max(0,3*(o.w||0)+2*(o.f||0)+2*(o.g||0)+(o.x||0)+(o.h||0)-2*(o.k||0))}

function pageDefs(g,pg){var P=stagePages(g);return stageDefs(g).filter(function(x){var t=P[0];P.forEach(function(p){if(p<=x[0][2])t=p});return t===pg})}
function pageState(g,pg){
  var s=psOf(g),o=s.p[pg]||(s.p[pg]={ok:false,n:0}),qs=pageQs(g,pg),df=pageDefs(g,pg);
  var rd=!!PS.v[pg],q=qs.every(function(x){return (s.q[x.l]||0)>=4}),d=df.every(function(x){return (s.d[x[1]]||0)>=3});
  return {o:o,qs:qs,df:df,rd:rd,q:q,d:d,done:!!o.ok&&rd&&q&&d};
}
function stagePagesDone(g){return stagePages(g).every(function(p){return pageState(g,p).done})}

// shared: passphrase-protected setup codes (AES-GCM, PBKDF2). Nothing leaves the device.
function bkB64u(b){var s='';new Uint8Array(b).forEach(function(x){s+=String.fromCharCode(x)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function bkUnb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function bkKey(pass,salt){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function bkEncode(obj,pass){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));var k=await bkKey(pass,salt);var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj))));var all=new Uint8Array(28+ct.length);all.set(salt,0);all.set(iv,16);all.set(ct,28);return 'BKS1.'+bkB64u(all)}
async function bkDecode(code,pass){code=String(code||'').trim();if(code.indexOf('BKS1.')!==0)throw new Error('This is not a setup code.');var all=bkUnb64u(code.slice(5));var k=await bkKey(pass,all.slice(0,16));try{var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},k,all.slice(28));return JSON.parse(new TextDecoder().decode(pt))}catch(e){throw new Error('Wrong passphrase or damaged code.')}}

async function ghReq(method,path,body){var d=devGet();return fetch((d.api||'https://api.github.com')+'/repos/'+d.repo+'/contents/'+path,{method:method,headers:{'Authorization':'Bearer '+d.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
function markDirty(){if(!canReport())return;SYNC.dirty=true;if(!SYNC.t)SYNC.t=setTimeout(function(){SYNC.t=null;syncNow()},SYNC.delay)}
async function syncNow(){
  if(!canReport()||SYNC.busy)return;
  if(navigator.onLine===false){SYNC.err='offline';SYNC.dirty=true;return}
  SYNC.busy=true;SYNC.dirty=false;var fail=false;
  try{
    var path='reports/'+D.meta.book+'.json',b64=btoa(unescape(encodeURIComponent(JSON.stringify(buildReport()))));
    for(var tr=0;tr<3;tr++){
      if(SYNC.sha===null){var g=await ghReq('GET',path);if(g.status===200)SYNC.sha=(await g.json()).sha;else if(g.status===404)SYNC.sha='';else throw new Error('GET '+g.status)}
      var pr=await ghReq('PUT',path,{message:'report '+D.meta.book,content:b64,sha:SYNC.sha||undefined});
      if(pr.status===200||pr.status===201){SYNC.sha=(await pr.json()).content.sha;SYNC.last=Date.now();SYNC.err='';break}
      if(pr.status===409||pr.status===422){SYNC.sha=null;continue}
      throw new Error('PUT '+pr.status);
    }
  }catch(e){fail=true;SYNC.err=String(e&&e.message||e);SYNC.dirty=true}
  SYNC.busy=false;
  if(fail){if(!SYNC.t)SYNC.t=setTimeout(function(){SYNC.t=null;syncNow()},SYNC.retry)}else if(SYNC.dirty)markDirty();
}

  function ago(ms){if(!ms)return 'never';var m=Math.round((Date.now()-ms)/60000);return m<1?'just now':(m<90?m+' min ago':Math.round(m/60)+' h ago')}
  function refresh(){var dd=devGet();
    st.textContent=!dd?'Not registered. This device does not send reports.':(dd.role==='student'&&(!dd.book||dd.book==='*'||dd.book===D.meta.book)?('Registered ('+(dd.book&&dd.book!=='*'?dd.book:'all books')+'). '+(isTest()?'TEST SESSION: reports are paused.':'Reports are sent. Last report: '+ago(SYNC.last)+(SYNC.err?(' ('+SYNC.err+')'):'')+'.')):('Registered, but not for this book ('+(dd.book||dd.role)+'). No reports from here.'))}
  refresh();
  var msg=el('p','note','');c.appendChild(msg);
  var code=el('textarea','wf');code.rows=3;code.placeholder='Setup code';code.spellcheck=false;code.setAttribute('aria-label','Setup code');
  var pass=document.createElement('input');pass.type='password';pass.placeholder='Passphrase';pass.setAttribute('aria-label','Passphrase');pass.autocomplete='off';
  c.appendChild(code);c.appendChild(pass);
  var acts=el('div','acts');c.appendChild(acts);
  var reg=el('button','btn pri','Register this device');
  reg.addEventListener('click',async function(){
    try{var o=await bkDecode(code.value,pass.value);if(o.role!=='student')throw new Error('This code is not for a lesson device.');if(o.book&&o.book!=='*'&&o.book!==D.meta.book)throw new Error('This code is for another book ('+o.book+').');
      devSet({role:o.role,book:o.book||'*',repo:o.repo,token:o.token,api:o.api||'',enc:code.value.trim(),id:Math.random().toString(36).slice(2,8)});SYNC.sha=null;msg.className='note okc';msg.textContent='Registered.';code.value='';pass.value='';refresh();markDirty()}
    catch(e){msg.className='note';msg.textContent=e.message}
  });acts.appendChild(reg);
  var dd=devGet();
  if(dd){
    var tt=el('button','btn',isTest()?'End the test session':'Start a test session');
    tt.addEventListener('click',async function(){try{await bkDecode(dd.enc,pass.value);setTest(!isTest());tt.textContent=isTest()?'End the test session':'Start a test session';msg.className='note okc';msg.textContent=isTest()?'Test session: nothing is reported.':'Reports resume.';refresh();if(!isTest())markDirty()}catch(e){msg.className='note';msg.textContent='Enter the passphrase first. '+e.message}});
    acts.appendChild(tt);
    var un=el('button','btn','Remove registration');un.addEventListener('click',async function(){try{await bkDecode(dd.enc,pass.value);devSet(null);setTest(false);msg.className='note okc';msg.textContent='Removed.';refresh()}catch(e){msg.className='note';msg.textContent='Enter the passphrase first. '+e.message}});acts.appendChild(un);
  }
  document.body.appendChild(w);
}
setTimeout(function(){if(canReport())markDirty()},1500);
(function(){var m=el('button','btn','Menu');m.id='menub';m.setAttribute('aria-label','Menu for parents');m.addEventListener('click',openMenu);document.body.appendChild(m);if(isTest()){}})();
markDirty();

buildPages();buildGoto();buildLearn();examIntro();buildSum();renderPath();
if(typeof module!=='undefined')module.exports={norm:norm,keysOk:keysOk,checkIntegrity:checkIntegrity};
</script>
