<script>const D={"pages":[{"b":8,"ctx":false,"hints":[{"c":"b","t":"Start-up activity","x":"Three identical seedlings are grown: one gets water and sunlight, one gets sunlight but no water, one gets water but no sunlight. Notes are written in the table every day.","s":[[10.58,20.17,38.77,23.41]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p008.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":9,"ctx":false,"hints":[{"c":"b","t":"Cell","x":"A cell is covered by a membrane and holds all the materials needed for life. The membrane separates the inside of the cell from its environment.","s":[[44.93,30.9,88.49,32.66],[37.04,32.64,60.63,34.41]],"df":""},{"c":"o","t":"Many-celled organisms","x":"In an organism with many cells, different kinds of cells do different jobs. Nerve cells carry nerve signals and muscle cells are specialized for movement.","s":[[60.03,63.66,88.5,65.42],[37.04,65.29,87.01,67.06]],"df":""},{"c":"o","t":"One-celled organisms","x":"In a one-celled organism, different parts of the cell do different jobs. The paramecium takes in food, breaks it down and excretes wastes with different parts of its cell.","s":[[37.04,70.83,88.49,72.59],[37.04,72.46,58.14,74.23]],"df":""},{"c":"o","t":"Objective","x":"The objective of this lesson: describe the six characteristics of living things. They are the numbered headings 1 to 6 on pages 9, 10 and 11: Cells, Sense and respond, Reproduce, DNA, Use energy, Grow and develop.","s":[[14.57,32.21,26.16,33.98],[14.57,33.96,31.54,35.73],[14.57,35.71,19.42,37.47]],"df":""},{"c":"o","t":"Cells","x":"All living things are made of one or more cells, such as the single-celled and many-celled organisms in Figure 1.","s":[[37.04,29.15,76.03,30.92]],"df":""},{"c":"o","t":"Cell (definition)","x":"The smallest structural unit of living things that can perform all life processes.","s":[[12.4,76.85,31.63,78.61],[12.4,78.71,31.63,80.47],[12.4,80.56,31.63,82.33],[12.4,82.42,20.8,84.19]],"df":"The smallest structural unit of the living things that can perform all life processes."}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p009.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":10,"ctx":false,"hints":[{"c":"o","t":"Stimulus","x":"A stimulus is any change in the environment that affects the organism. The page gives light as an example: pupils become smaller when exposed to light.","s":[[49.77,22.41,58.5,24.18],[10.58,24.16,58.5,25.93],[10.58,25.91,17.21,27.67]],"df":""},{"c":"o","t":"Asexual reproduction","x":"One parent makes offspring identical to itself. Most single-celled organisms reproduce this way, for example the yeast cell in Figure 3.","s":[[21.03,40.62,58.5,42.38],[10.58,42.36,29.77,44.13]],"df":""},{"c":"b","t":"Sexual reproduction","x":"Two parents make offspring that share traits from both. Most animals and plants reproduce this way, like the bear cubs in Figure 4.","s":[[10.58,46.48,58.5,48.24],[10.58,48.22,38.65,49.99]],"df":""},{"c":"o","t":"Sense and respond","x":"All organisms can sense changes in their environment and respond to them. For example, when your pupils are exposed to light, they become smaller.","s":[[10.58,16.3,53.44,18.42]],"df":""},{"c":"o","t":"Reproduce","x":"Organisms make other organisms similar to themselves in one of two ways: asexual reproduction or sexual reproduction.","s":[[10.58,34.5,35.45,36.62]],"df":""},{"c":"o","t":"Stimulus (definition)","x":"Anything that causes a reaction or change in an organism or any part of an organism.","s":[[61.26,24.86,87.7,26.62],[61.26,26.6,87.7,28.37],[61.26,28.35,70.89,30.12]],"df":"Anything that causes a reaction or change in an organism or any part of an organism."},{"c":"o","t":"Asexual reproduction (definition)","x":"Reproduction in which one parent produces offspring identical to itself.","s":[[61.26,38.04,87.7,39.8],[61.26,39.78,87.7,41.55]],"df":"Reproduction in which one parent produces offspring identical to itself."},{"c":"o","t":"Sexual reproduction (definition)","x":"Reproduction in which the sex cells from two parents unite, producing offspring that share traits from both parents.","s":[[61.26,50.01,87.7,51.78],[61.26,51.76,87.7,53.53],[61.26,53.51,87.7,55.27],[61.26,55.25,67.29,57.02]],"df":"Reproduction in which the sex cells from two parents unite, producing offspring that share traits from both parents."}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p010.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":11,"ctx":false,"hints":[{"c":"o","t":"DNA","x":"All cells contain DNA. It controls the structure and function of cells and is copied and passed to the offspring.","s":[[38.95,16.3,63.81,18.42]],"df":""},{"c":"b","t":"Heredity","x":"Heredity is the passing of traits from one generation to the next.","s":[[46.59,23.72,88.49,25.49],[38.95,25.36,50.46,27.13]],"df":""},{"c":"b","t":"Metabolism","x":"Metabolism is the total of all the chemical activities an organism performs, such as making food, breaking down food, moving materials into and out of cells, and building cells.","s":[[74.96,37.05,88.49,38.81]],"df":""},{"c":"o","t":"Heredity (definition)","x":"The passing of genetic traits from parent to offspring.","s":[[12.09,23.98,35.77,25.75],[12.09,25.73,25.5,27.49]],"df":"The passing of genetic traits from parent to offspring."},{"c":"o","t":"Metabolism (definition)","x":"The sum of all chemical processes that occur in an organism.","s":[[12.09,33.81,35.77,35.57],[12.09,35.56,30.0,37.32]],"df":"The sum of all chemical processes that occur in an organism."},{"c":"o","t":"Use energy","x":"Organisms use energy to carry out the activities of life: making food, breaking down food, moving materials into and out of cells, and building cells.","s":[[38.95,29.63,64.39,31.74]],"df":""},{"c":"o","t":"Grow and develop","x":"All living things grow during periods of their lives. In a single-celled organism the cell gets larger; in many-celled organisms the number of cells increases. Living things also develop and change as they grow (Figure 5).","s":[[38.95,41.31,70.82,43.43]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p011.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U1S1-SC1","y":52.99,"x":12.09,"nl":false}]},{"b":12,"ctx":false,"hints":[{"c":"b","t":"The six characteristics","x":"Cells, response to stimuli, reproduction, DNA, use of energy (metabolism), and growth and development.","s":[[30.43,23.63,67.21,25.39],[18.95,25.59,37.82,27.36]],"df":""}],"mcs":[{"id":"U1S1-2","ok":2,"ops":[[17.07,61.16,28.22,63.31],[17.07,63.52,25.91,65.67],[17.07,65.89,31.65,68.04],[17.07,68.26,35.37,70.41]],"y":58.98}],"typos":[],"q":[],"img":"science7-book-img/p012.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U1S1-1","y":55.13,"x":13.92,"nl":false},{"id":"U1S1-3","y":74.06,"x":13.92,"nl":false},{"id":"U1S1-4","y":78.8,"x":13.92,"nl":false},{"id":"U1S1-5","y":83.53,"x":13.92,"nl":false}]},{"b":13,"ctx":false,"hints":[{"c":"b","t":"Start-up activity","x":"Lipid (oil or fat) and sugar are added to two glasses of water and mixed. You look at both glasses and write what you see. The page asks which one dissolves and what you understand from the experiment.","s":[[10.5,69.8,52,81.8]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p013.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":14,"ctx":false,"hints":[{"c":"o","t":"Air","x":"Air is a mixture of gases including oxygen and carbon dioxide. Most living things use oxygen to release energy from food. Plants, algae and some bacteria use carbon dioxide to make food and oxygen by photosynthesis.","s":[[37.38,48.45,38.96,50.56],[39.48,48.45,42.51,50.56]],"df":""},{"c":"o","t":"Water","x":"The cells of almost all living organisms are about 70% water, and the chemical reactions of metabolism need water. You could survive only about three days without water. You get it from the fluids you drink and the food you eat.","s":[[37.91,30.21,39.48,32.32],[40.01,30.21,45.13,32.32]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p014.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U1S2-SC1","y":73.54,"x":17.69,"nl":false}]},{"b":15,"ctx":false,"hints":[{"c":"o","t":"Consumer","x":"A consumer cannot make its own food, so it eats other organisms or organic matter.","s":[[64.0,42.6,89.0,48.2]],"df":"An organism that cannot make its own food therefore eats other organisms or organic matter."},{"c":"o","t":"Food","x":"Food gives organisms energy and the raw materials (nutrients) to carry on life processes, replace destroyed cells and build body parts.","s":[[12.4,50.83,13.98,52.94],[14.5,50.83,19.05,52.94]],"df":""},{"c":"o","t":"A place to live","x":"All organisms need a place to live that contains all the things they need to survive. Elephants need a large space; birds need smaller spaces (Figure 2).","s":[[12.0,12.6,28.4,15.3]],"df":""},{"c":"o","t":"Producer","x":"An organism that can make its own food by using energy from its surroundings.","s":[[64.0,28.0,89.0,33.7]],"df":"An organism that can make its own food by using energy from its surroundings."},{"c":"o","t":"Decomposers","x":"Organisms that break down the remains of dead organisms or animal wastes to obtain energy and nutrients (the mushroom in Figure 3).","s":[[64.0,56.4,89.0,63.8]],"df":"An organism that breaks down the remains of dead organisms or animal wastes to obtain energy and nutrients."}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p015.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":16,"ctx":false,"hints":[{"c":"o","t":"Six elements","x":"Living things are made mostly of six elements: carbon, hydrogen, nitrogen, oxygen, phosphorus and sulfur. They combine into proteins, carbohydrates, lipids, nucleic acids and ATP.","s":[[49.5,27.1,86.5,29.2],[40.3,29.1,86.5,31.2]],"df":""},{"c":"o","t":"Protein","x":"A large molecule made up of smaller subunits called amino acids.","s":[[12.3,25.0,29.0,30.6]],"df":"A large molecule made up of smaller subunits called amino acids."},{"c":"o","t":"Proteins","x":"Almost all life processes depend on proteins. They build and repair body structures and take part in forming bird feathers, animal horns, nails, red blood cells and enzymes (Figure 4). All animals get protein from food, but legume plants can make their own.","s":[[12.19,40.03,13.77,42.15],[14.29,40.03,21.71,42.15]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p016.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":17,"ctx":false,"hints":[{"c":"o","t":"Carbohydrates","x":"Carbohydrates are the main source of energy. Simple carbohydrates are like the sugar in fruits; complex carbohydrates are like starch and fibers.","s":[[12.19,14.19,27.23,16.3]],"df":""},{"c":"b","t":"Lipids","x":"Lipids cannot mix with water. Some store energy and others form the membrane of cells. Plant lipids are mostly oils (liquid); animal lipids are mostly fats (solid).","s":[[12.19,55.13,46.98,56.9]],"df":""},{"c":"o","t":"Carbohydrate (definition)","x":"A class of energy-giving nutrients that includes sugars, starch and fibers.","s":[[64.43,28.18,88.49,29.95],[64.43,29.93,88.49,31.7],[64.43,31.68,68.94,33.44]],"df":"A class of energy giving nutrients that includes sugars, starch, and fibers."},{"c":"o","t":"Two kinds of carbohydrates","x":"Simple carbohydrates are like the sugar in fruits; complex carbohydrates are like starch and fibers. In Figure 5 the grape has simple carbohydrate, while corn and potato have complex carbohydrates.","s":[[42.7,21.28,61.26,23.05],[12.19,23.36,61.26,25.12],[12.19,25.43,48.46,27.2]],"df":""},{"c":"o","t":"Oils and fats","x":"Most lipids stored in plants are oils, which are liquid at room temperature. Most lipids stored in animals are fats, which are solid at room temperature.","s":[[48.2,58.63,61.26,60.39],[12.19,60.37,61.26,62.14],[12.19,62.12,61.26,63.89],[12.19,64.2,21.23,65.96]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p017.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":18,"ctx":false,"hints":[{"c":"o","t":"ATP","x":"The energy in carbohydrates and lipids must be transferred to ATP, which then provides fuel for the cellular activities. ATP is the major energy-carrying molecule in the cell.","s":[[39.0,23.9,100,25.7],[39.0,25.9,71.8,28.0]],"df":""},{"c":"o","t":"Nucleic acids","x":"Nucleic acids hold the information for making proteins. There are two types, DNA and RNA.","s":[[10.3,54.2,86,56.1],[10.3,56.1,86,58.0],[10.3,58.0,62,59.9]],"df":""},{"c":"o","t":"Nucleic acids (definition)","x":"A molecule made up of subunits called nucleotides.","s":[[10.85,26.12,34.91,27.89],[10.85,27.87,24.72,29.63]],"df":"A molecule made up of subunits called nucleotides."}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p018.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":19,"ctx":false,"hints":[{"c":"b","t":"Summary","x":"ATP fuels the cell activities, and nucleic acids (DNA and RNA) are made up of nucleotides.","s":[[15.31,34.9,51.26,36.66]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p019.jpg","u":1,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U1S2-1","y":53.76,"x":14.41,"nl":false},{"id":"U1S2-2","y":58.82,"x":14.41,"nl":false},{"id":"U1S2-3","y":62.14,"x":14.41,"nl":false},{"id":"U1S2-4","y":65.45,"x":14.41,"nl":false},{"id":"U1S2-5","y":68.76,"x":14.41,"nl":false},{"id":"U1S2-6","y":72.07,"x":14.41,"nl":false},{"id":"U1S2-7","y":75.39,"x":14.42,"nl":false},{"id":"U1S2-8","y":80.78,"x":14.48,"nl":false}]},{"b":20,"ctx":false,"hints":[],"mcs":[{"id":"U1CR-2","ok":3,"ops":[[13.94,30.98,62.94,32.93],[13.94,32.68,39.58,34.79],[13.94,34.51,56.54,36.61],[13.94,36.33,28.22,38.43]],"y":28.57},{"id":"U1CR-3","ok":1,"ops":[[13.94,42.06,42.24,44.16],[13.94,43.88,45.11,45.98],[13.94,45.7,47.69,47.8],[13.94,47.52,43.14,49.62]],"y":40.08},{"id":"U1CR-4","ok":0,"ops":[[13.94,53.57,34.21,55.67],[13.94,55.39,39.86,57.49],[13.94,57.21,44.17,59.31],[13.94,59.03,28.22,61.13]],"y":51.27},{"id":"U1CR-5","ok":1,"ops":[[13.94,65.0 e question: protein, enzymes, sugars, lipids, nucleotides, nucleic acid. Which proteins speed up reactions in the cell?","mine":true},{"pg":21,"id":"B21-6","card":"U1CR-11","kind":"box","r":[66.57,77.35,80.09,81.05],"ans":"Nucleotides","ok":["nucleotides","nucleotide"],"label":"box under Nucleic Acid DNA","h1":"Use one of the six words from the question: protein, enzymes, sugars, lipids, nucleotides, nucleic acid. The subunits of nucleic acids are ...","mine":true}],"eyes":[{"id":"U1CR-7","y":22.73,"x":18.12,"nl":false},{"id":"U1CR-8","y":35.36,"x":18.12,"nl":false},{"id":"U1CR-9","y":38.27,"x":18.12,"nl":false},{"id":"U1CR-10","y":41.18,"x":19.02,"nl":false},{"id":"U1CR-11","y":44.1,"x":19.33,"nl":false}]},{"b":24,"ctx":false,"hints":[],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p024.jpg","u":2,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":25,"ctx":false,"hints":[{"c":"b","t":"Van Leeuwenhoek","x":"In 1673 he looked at a drop of pond water with his own microscope and saw many small swimming creatures (protists). He was the first person to see bacteria.","s":[[37.04,60.88,77.68,62.64]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p025.jpg","u":2,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":26,"ctx":false,"hints":[{"c":"b","t":"Cell theory","x":"The cell theory has three facts: all organisms are made of one or more cells; the cell is the basic structural and functional unit of living things; all cells come from other cells.","s":[[13.27,36.42,60.22,38.18]],"df":""},{"c":"b","t":"Why cells are small","x":"When a cell gets bigger its volume grows faster than its surface area. A cell that is too large cannot take in enough nutrients or pump out enough wastes.","s":[[38.69,58.66,61.26,60.42],[10.58,60.3,14.99,62.06]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p026.jpg","u":2,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U2S1-SC1","y":23.74,"x":64.12,"nl":true},{"id":"U2S1-SC2","y":55.0,"x":63.49,"nl":true}]},{"b":27,"ctx":false,"hints":[{"c":"b","t":"Cytoplasm","x":"The cytoplasm is a jelly-like solution that fills the cell, with organelles floating in it. Each organelle does a specific job.","s":[[10.58,57.06,37.98,58.82]],"df":""},{"c":"b","t":"Cell membrane layers","x":"The membrane has two layers of phospholipids. The water-loving heads face outward and the water-fearing tails face each other inside.","s":[[62.84,18.67,65.64,20.44],[10.58,20.53,46.83,22.29]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p027.jpg","u":2,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":28,"ctx":false,"hints":[{"c":"b","t":"Nucleus","x":"In eukaryotic cells the DNA is inside the nucleus. Bacterial cells do not have a nucleus.","s":[[28.34,21.75,61.26,23.51]],"df":""},{"c":"b","t":"Nucleolus","x":"The nucleolus is the dark region inside the nucleus where ribosomes are made.","s":[[33.71,33.54,61.26,35.31],[10.58,35.51,20.44,37.27]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p028.jpg","u":2,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":29,"ctx":false,"hints":[],"mcs":[{"id":"U2S1-2","ok":1,"ops":[[16.41,60.99,26.11,63.14],[16.41,63.76,26.61,65.91],[16.41,66.53,25.5,68.68],[16.41,69.3,25.01,71.45]],"y":58.41}],"typos":[],"q":[],"img":"science7-book-img/p029.jpg","u":2,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U2S1-1","y":53.76,"x":14.41,"nl":false},{"id":"U2S1-3","y":73.14,"x":14.41,"nl":false},{"id":"U2S1-4","y":75.9,"x":14.41,"nl":false},{"id":"U2S1-5","y":78.67,"x":14.41,"nl":false}]},{"b":30,"ctx":false,"hints":[],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p030.jpg","u":2,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":31,"ctx":false,"hints":[{"c":"b","t":"Prokaryotes","x":"Prokaryotes have no nucleus and no membrane bound organelles. Bacteria are the example.","s":[[37.04,31.21,85.38,32.97]],"df":""},{"c":"b","t":"Bacteria","x":"A bacterial cell has a circular DNA molecule scattered in the cytoplasm, ribosomes, a strong cell wall and flagella for moveme  collection of tissues that work together to carry out a specialized function."},{"c":"o","t":"Organ system","x":"Several organs that work together on one body job. The digestive system is the example on this page.","s":[[64.75,38.04,87.7,39.8],[64.75,39.78,87.7,41.55],[64.75,41.53,73.33,43.29]],"df":"A group of organs that work together to perform body functions."},{"c":"o","t":"Organism","x":"Organ systems working together make the whole organism.","s":[[64.75,48.34,87.7,50.1],[64.75,50.08,85.44,51.85]],"df":"A living thing that can carry out life processes independently."},{"c":"o","t":"Organs in the figure","x":"The teacher highlighted these labels: large intestine, heart, liver, lungs, stomach, brain, kidneys. They are examples of organs.","s":[[33.47,23.34,61.68,25.15],[11.81,25.22,15.73,26.98]],"df":""},{"c":"b","t":"Plants have organs too","x":"Tissues work together as organs in plants as well: leaf, stem, root and flower.","s":[[11.81,27.69,41.15,29.46]],"df":""},{"c":"b","t":"Organ system example","x":"Each organ system has its own job. The digestive system is made of the mouth, pharynx, esophagus, stomach, small intestine, large intestine and rectum.","s":[[11.81,68.45,61.68,70.21]],"df":""}],"mcs":[],"typos":[{"m":"'Interstine' should be 'Intestine' (large intestine).","k":"typo","s":[[22.0,42.33,28.77,44.09]]}],"q":[],"img":"science7-book-img/p039.jpg","u":2,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":40,"ctx":false,"hints":[{"c":"b","t":"Reading the levels","x":"Follow the arrows from the cardiac muscle cell, to cardiac muscle tissue, to the heart (organ), to the human cardiovascular system.","s":[[21.98,37.92,62.03,40.1]],"df":""},{"c":"b","t":"Structure","x":"Structure is how the parts are arranged: the shape of a part and the material it is made of.","s":[[66.76,23.18,89.72,24.94],[66.76,24.92,74.14,26.69]],"df":""},{"c":"b","t":"Function","x":"Function is the job a part does.","s":[[66.76,33.94,89.72,35.7]],"df":""},{"c":"b","t":"Lungs example",  move from where there are more of them to where there are fewer, until both places are equal. The cell uses no energy for it.","s":[[36.06,50.59,86.78,52.35]],"df":""},{"c":"b","t":"Osmosis","x":"Osmosis is the diffusion of water through a semipermeable membrane, from more water to less water.","s":[[53.89,67.55,89.0,69.32]],"df":""},{"c":"b","t":"Semipermeable","x":"The membrane lets only certain substances pass through and blocks the others.","s":[[50.13,77.38,85.52,79.15]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p047.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":48,"ctx":false,"hints":[{"c":"o","t":"Diffusion (definition)","x":"Higher concentration to lower concentration. Teacher-highlighted definition.","s":[[9.36,34.29,29.29,36.05],[9.36,35.82,29.29,37.58],[9.36,37.35,29.29,39.11],[9.36,38.88,13.46,40.64]],"df":"Movement of particles from regions of higher concentration to regions of lower concentration."},{"c":"b","t":"Osmosis (definition)","x":"Osmosis is the diffusion of water. Teacher-highlighted definition.","s":[[9.36,43.41,25.38,45.17]],"df":""},{"c":"o","t":"Red blood cells","x":"In salty water the cells lose water and shrink. In pure water they gain water, swell, and burst.","s":[[35.53,42.99,83.78,45.17]],"df":""},{"c":"o","t":"Passive transport","x":"No energy, from higher to lower concentration. Diffusion and osmosis are examples.","s":[[10.58,56.77,83.25,58.53]],"df":"The movement of substances across a cell membrane without the use of energy, from higher to lower concentration."},{"c":"o","t":"Active transport","x":"From lower to higher concentration, and the cell must use energy.","s":[[10.58,62.97,89.0,64.74],[10.58,64.94,60.97,66.7]],"df":"The movement of substances across the cell membrane from lower to higher concentration; it requires the cell to use energy."},{"c":"b","t":"Why cells burst","x":"Water flows into the cells by osmosis until they burst. In a salty solution water flows out and the cells shrivel.","s":[[34.07,13.95,70.66,15.71]],"df":""},{"c":"b","t":"Channels","x":"Small particles cross through protein channels in the cell membrane, by passive or active transport.","s":[[10.58,50.56,84.3,52.33]],"df":""}],"mcs":[],"typos":[{"m":"'od' should be 'of' (the concentration of water outside).","k":"typo","s":[[63.21,19.85,65.01,21.61]]}],"q":[],"img":"science7-book-img/p048.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U3S1-5","y":21.8,"x":8.24,"nl":false}]},{"b":49,"ctx":false,"hints":[{"c":"o","t":"Endocytosis (definition)","x":"A large particle is surrounded and enclosed in a vesicle, and brought into the cell. Teacher-highlighted.","s":[[11.78,22.43,31.71,24.19],[11.78,23.96,31.71,25.72],[11.78,25.49,31.71,27.25],[11.78,27.02,25.52,28.78]],"df":"The process by which a cell membrane surrounds a large particle and encloses it in a vesicle to bring the particle into the cell."},{"c":"o","t":"Exocytosis (definition)","x":"A vesicle carries the large particle out of the cell. Teacher-highlighted.","s":[[11.78,32.74,31.72,34.51],[11.78,34.27,31.71,36.04],[11.78,35.8,31.72,37.57]],"df":"The process in which a cell releases a large particle by enclosing it in a vesicle, then transporting the particle out of the cell."},{"c":"b","t":"Small or large","x":"Those three move small particles. Large particles use endocytosis (in) and exocytosis (out).","s":[[35.03,19.2,87.96,20.97]],"df":""},{"c":"b","t":"Vesicle","x":"A vesicle is a small sac made from a piece of the cell membrane.","s":[[79.35,31.55,87.96,33.31],[35.03,33.29,65.85,35.06]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p049.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":50,"ctx":false,"hints":[{"c":"b","t":"Summary of the section","x":"Diffusion and osmosis are passive transport. Small particles use passive or active transport. Large particles use endocytosis and exocytosis.","s":[[15.29,21.99,62.72,23.76]],"df":""}],"mcs":[{"id":"U3S1-2","ok":1,"ops":[[16.39,67.33,25.74,69.48],[32.49,67.33,40.63,69.48],[16.39,69.57,23.98,71.72],[32.08,69.57,40.92,71.72]],"y":65.28}],"typos":[],"q":[],"img":"science7-book-img/p050.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U3S1-1","y":55.89,"x":31.17,"nl":false},{"id":"U3S1-3","y":72.88,"x":14.39,"nl":false},{"id":"U3S1-4","y":75.12,"x":14.39,"nl":false}]},{"b":51,"ctx":false,"hints":[{"c":"b","t":"Start-up activity","x":"Sugar, warm water and yeast are put in a bottle with a balloon on top. After half an hour you write down what you observe.","s":[[14.1,62.36,45.87,64.13]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p051.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":52,"ctx":false,"hints":[{"c":"o","t":"Photosynthesis","x":"Plants absorb energy from the sun and change it into food. The food gives them energy and feeds the organisms that eat plants.","s":[[64.67,39.69,87.11,41.46],[34.18,41.66,83.8,43.42]],"df":""},{"c":"o","t":"Pigment and chlorophyll","x":"Molecules that absorb light are pigments. The main one is chlorophyll. It gives plants their green colour and is found in chloroplasts.","s":[[72.23,48.17,87.11,49.94],[34.18,50.14,45.96,51.9]],"df":"Molecules that absorb light energy are called pigments."},{"c":"o","t":"Inputs and outputs","x":"Carbon dioxide and water become food (glucose), and oxygen is also produced.","s":[[34.18,56.65,87.11,58.42]],"df":""},{"c":"o","t":"Photosynthesis (definition)","x":"Plants, algae and some bacteria use sunlight, water and carbon dioxide to make food.","s":[[11.47,62.36,31.4,64.13],[11.47,64.11,31.4,65.88]],"df":"The process by which plants, algae, and some bacteria use sunlight, water, and carbon dioxide to make food."},{"c":"b","t":"Where energy comes from","x":"Plant cells get energy from sunlight. Many animal cells get it from food.","s":[[34.18,30.59,87.11,32.35]],"df":""}],"mcs":[],"typos":[{"m":"The text on this page says carbon dioxide and water change into food (glucose) and oxygen is produced, but the printed equation has glucose and oxygen on the left and water and carbon dioxide on the right. The correct direction follows the text: carbon dioxide + water + sunlight energy gives glucose + oxygen.","k":"logic","s":[[50.79,75.99,70.91,78.21]]}],"q":[],"img":"science7-book-img/p052.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":53,"ctx":true,"hints":[{"c":"b","t":"Respiration or fermentation","x":"Both get energy from food. Respiration uses oxygen and releases more energy. Fermentation does not use oxygen. (Page not photographed, shown for context.)","s":[[12.83,27.03,65.77,28.79]],"df":""},{"c":"b","t":"Two kinds of fermentation","x":"Lactic acid fermentation (muscle cells, some fungi and bacteria) and alcoholic fermentation (bacteria and yeast, makes alcohol and carbon dioxide).","s":[[12.83,83.58,65.77,85.35]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p053.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U3S2-SC1","y":46.85,"x":68.69,"nl":true},{"id":"U3S2-SC2","y":59.23,"x":69.07,"nl":true}]},{"b":54,"ctx":false,"hints":[{"c":"b","t":"The connection","x":"Photosynthesis makes glucose and oxygen. Cellular respiration uses them and gives back carbon dioxide and water. Each process makes what the other needs.","s":[[12.6,20.93,53.99,22.7]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p054.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":55,"ctx":false,"hints":[{"c":"b","t":"Summary of the section","x":"Sun energy is stored in food by photosynthesis. Respiration breaks glucose down. Fermentation gets energy without oxygen.","s":[[16.38,24.36,62.38,26.13]],"df":""}],"mcs":[{"id":"U3S2-2","ok":1,"ops":[[17.48,61.54,34.84,63.69],[17.48,63.78,31.57,65.93],[17.48,66.02,27.53,68.17],[17.48,68.26,30.26,70.41]],"y":59.49}],"typos":[],"q":[],"img":"science7-book-img/p055.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U3S2-1","y":55.9,"x":15.48,"nl":false},{"id":"U3S2-3","y":71.79,"x":15.48,"nl":false},{"id":"U3S2-4","y":74.25,"x":15.48,"nl":false},{"id":"U3S2-5","y":76.71,"x":15.48,"nl":false},{"id":"U3S2-6","y":79.16,"x":15.48,"nl":false}]},{"b":56,"ctx":false,"hints":[{"c":"b","t":"Start-up activity","x":"Bead strings stand for chromosomes. You move them through interphase, prophase, metaphase and anaphase, then draw the two new cells.","s":[[13.7,77.05,50.32,78.81]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p056.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":57,"ctx":false,"hints":[{"c":"o","t":"Cell division","x":"The process by which cells increase in number. Teacher-highlighted.","s":[[54.78,32.49,88.5,34.26]],"df":"The process by which cells increase in number."},{"c":"o","t":"Cell cycle","x":"The different stages in the life of a cell.","s":[[77.09,42.63,88.49,44.4],[35.56,44.6,61.49,46.36]],"df":"The different stages in the life of a cell."},{"c":"o","t":"Cell cycle repeats","x":"It starts when the cell is formed, ends when the cell divides, then repeats.","s":[[35.56,46.87,88.49,48.64]],"df":""},{"c":"o","t":"Binary fission","x":"Bacteria divide by binary fission: two cells, each with one copy of the circular DNA.","s":[[64.86,64.15,88.49,65.91],[35.56,66.11,88.49,67.88],[35.56,68.08,52.57,69.84]],"df":"Cell division in bacteria. It results in two cells that each contain one copy of the circle DNA."},{"c":"o","t":"Cell cycle (definition)","x":"The life cycle of a cell.","s":[[11.66,77.99,28.24,79.76]],"df":"The life cycle of a cell."},{"c":"b","t":"Prokaryotes","x":"Bacteria have ribosomes and one circular DNA molecule, but no membrane-bound organelles.","s":[[35.56,60.22,77.12,61.98]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p057.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":58,"ctx":false,"hints":[{"c":"o","t":"Chromosome","x":"A thread-like structure of protein and DNA inside the nucleus of a eukaryotic cell.","s":[[63.67,24.9,85.47,26.66],[63.67,26.65,85.47,28.41],[63.67,28.39,85.47,30.16],[63.67,30.14,76.24,31.9]],"df":"A thread like structure made up of protein and DNA, located inside the nucleus of a eukaryotic cell."},{"c":"b","t":"Cell division (eukaryotes)","x":"Division of the nucleus and cytoplasm. Each new cell gets the same number and type of chromosomes.","s":[[63.67,36.08,85.47,37.85]],"df":""},{"c":"o","t":"Interphase","x":"The cell grows, and copies its organelles and chromosomes. Each chromosome then has two chromatids held together at the centromere.","s":[[10.58,34.31,36.14,36.12]],"df":""},{"c":"o","t":"Four phases of mitosis","x":"Prophase, Metaphase, Anaphase, Telophase. The teacher highlighted all four names.","s":[[10.58,53.44,34.26,55.2]],"df":""},{"c":"b","t":"Why copy chromosomes","x":"DNA is organized into chromosomes. Copying them ensures each new cell is an exact copy of its parent.","s":[[10.58,19.98,53.56,21.75]],"df":""}],"mcs":[],"typos":[{"m":"The figure label 'Centeromere' should be 'Centromere', as the text spells it.","k":"typo","s":[[56.1,64.55,65.39,66.31]]}],"q":[],"img":"science7-book-img/p058.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[]},{"b":59,"ctx":false,"hints":[{"c":"o","t":"Prophase","x":"The nuclear membrane dissolves. The chromosomes condense and become visible.","s":[[14.15,26.19,30.73,27.95],[18.21,27.83,26.66,29.59]],"df":""},{"c":"o","t":"Metaphase","x":"The chromosomes line up in a diagonal line.","s":[[52.23,14.61,62.62,16.38],[51.41,16.36,63.44,18.13]],"df":""},{"c":"o","t":"Anaphase","x":"The chromosomes separate and move away from each other to the two poles of the cell.","s":[[74.52,20.89,86.65,22.51],[72.51,22.53,88.67,24.15]],"df":""},{"c":"o","t":"Telophase","x":"The division strand ends and a nucleus membrane forms around each set of chromosomes.","s":[[73.23,37.53,89.47,39.15]],"df":""},{"c":"o","t":"Interphase (figure)","x":"Chromosomes are copied, and each is made of two chromatids.","s":[[22.14,40.49,35.17,42.25],[19.65,42.24,33.92,44.0]],"df":""},{"c":"o","t":"Cytokinesis (definition)","x":"The division of the cytoplasm of a cell after the nucleus has divided.","s":[[12.49,60.78,34.29,62.54]],"df":"The division of the cytoplasm of a cell, after division of the nucleus."},{"c":"o","t":"Animal or plant","x":"Animal cells: the cell membrane pinches inward all the way through. Plant cells: a cell plate forms in the middle and a new cell wall forms there.","s":[[13.33,73.11,29.15,74.88],[13.33,75.08,31.86,76.84]],"df":""},{"c":"o","t":"Cell plate","x":"Cells with a cell wall (plants, algae, fungi) form a cell plate in the middle. It holds the materials for the new membranes and cell wall.","s":[[46.51,66.01,69.22,67.77]],"df":""}],"mcs":[],"typos":[],"q":[],"img":"science7-book-img/p059.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U3S3-7","y":73.99,"x":13.33,"nl":false}]},{"b":60,"ctx":false,"hints":[{"c":"b","t":"Summary of the section","x":"A cell copies its DNA first. Mitosis (four phases) divides the nucleus. Cytokinesis divides the cytoplasm. Plant cells form a cell plate.","s":[[16.91,27.81,63.49,29.57]],"df":""}],"mcs":[{"id":"U3S3-2","ok":2,"ops":[[18.01,61.13,30.7,63.28],[18.01,63.37,37.99,65.52],[18.01,65.61,32.84,67.76],[18.01,67.85,31.8,70.0]],"y":59.08}],"typos":[],"q":[],"img":"science7-book-img/p060.jpg","u":3,"h":1.3391666666666666,"bk":[],"eyes":[{"id":"U3S3-1","y":55.48,"x":16.01,"nl":false},{"id":"U3S3-3","y":73.73,"x":16.01,"nl":false},{"id":"U3S3-4","y":76.29,"x":16.01,"nl":false},{"id":"U3S3-5","y":78.86,"x":16.01,"nl":false},{"id":"U3S3-6","y":81.43,"x":16.01,"nl":false}]},{"b":61,"ctx":false,"hints":[],"mcs":[{"id":"U3CR-3","ok":2,"ops":[[3,31.4,55,33.6],[3,33.2,55,35.4],[3,35.1,55,37.2],[3,37.0,55,39.0]],"y":30.2},{"id":"U3CR-4","ok":0,"ops":[[3,42.4,55,44.5],[3,44.2,55,46.3],[3,46.1,55,48.2],[3,48.0,55,50.1]],"y":41.199999999999996},{"id":"U3CR-5","ok":3,"ops":[[3,55.4,55,57.5],[3,57.2,55,59.3],[3,59.1,55,61.2],[3,61.0,55,63.1]],"y":54.199999999999996},{"id":"U3CR-6","ok":2,"ops":[[3,66.2,55,68.3],[3,68.0,55,70.1],[3,69.9,55,72.0],[3,71.7,55,73.8]],"y":65.0}],"typos":[],"q":[],"eyes":[{"id":"U3CR-1","y":19.0},{"id":"U3CR-2","y":24.5},{"id":"U3CR-7","y":75.4},{"id":"U3CR-8","y":79.7},{"id":"U3CR-9","y":83.7},{"id":"U3CR-10","y":86.5},{"id":"U3CR-11","y":90.4}],"u":3,"img":"science7-book-img/p061.jpg","scan":true,"h":1.5558333333333334,"bk":[]}],"L":[{"id":"U1S1-SC1","pg":11,"sec":"Unit 1 - Section 1 (Self-Check, p.11)","qn":"Self-Check","typ":5,"q":"Name four chemical activities in living things that require energy.","steps":["The page lists them when it explains metabolism."],"ans":"Making food, breaking down food, moving materials into and out of cells, and building cells.","src":"p.11","st":"b","sp":[{"pg":11,"g":[[[75.59,35.41,88.49,37.18],[38.95,37.05,88.49,38.81]]]}],"mcq":false},{"id":"U1S1-1","pg":12,"sec":"Unit 1 - Section 1 Review (p.12)","qn":"Q1","typ":1,"q":"Define: cell, stimuli.","steps":["Find each word in the Definitions boxes."],"ans":"Cell: the smallest structural unit of the living things that can perform all life processes. Stimulus (stimuli): anything that causes a reaction or change in an organism or any part of an organism.","src":"p.9, p.10","st":"b","sp":[{"pg":9,"g":[[[12.4,76.85,31.63,78.61],[12.4,78.71,31.63,80.47],[12.4,80.56,31.63,82.33],[12.4,82.42,20.8,84.19]]]},{"pg":10,"g":[[[61.26,24.86,87.7,26.62],[61.26,26.6,87.7,28.37],[61.26,28.35,70.89,30.12]]]}],"mcq":false},{"id":"U1S1-2","pg":12,"sec":"Unit 1 - Section 1 Review (p.12)","qn":"Q2","typ":2,"q":"What do organisms pass to their offspring? a. Their cells. b. Stimuli. c. A copy of DNA. d. A copy of their cells.","steps":["Think about what is copied when organisms reproduce."],"ans":"c. A copy of DNA.","src":"p.11","st":"b","sp":[{"pg":11,"g":[[[60.1,22.09,88.49,23.85],[38.95,23.72,45.89,25.49]]]}],"mcq":true},{"id":"U1S1-3","pg":12,"sec":"Unit 1 - Section 1 Review (p.12)","qn":"Q3","typ":3,"q":"What are the differences between asexual and sexual reproduction?","steps":["Say how many parents each one has.","Say how the offspring compare with the parents."],"ans":"Asexual reproduction: a single parent produces offspring identical to itself (most single-celled organisms). Sexual reproduction: two parents (sex cells unite) produce offspring that share traits from both parents (most animals and plants).","src":"p.10","st":"b","sp":[{"pg":10,"g":[[[21.03,40.62,58.5,42.38],[10.58,42.36,29.77,44.13]],[[10.58,46.48,58.5,48.24],[10.58,48.22,38.65,49.99]]]}],"mcq":false},{"id":"U1S1-4","pg":12,"sec":"Unit 1 - Section 1 Review (p.12)","qn":"Q4","typ":5,"q":"What are the six characteristics of living things?","steps":["The page \"We learned together\" lists them."],"ans":"1) They are made of one or more cells. 2) They sense and respond to stimuli. 3) They reproduce, asexually or sexually. 4) They have DNA. 5) They use energy (metabolism). 6) They grow and develop.","src":"p.12 (We learned together), p.9-11","st":"b","sp":[{"pg":12,"g":[[[30.43,23.63,67.21,25.39],[18.95,25.59,37.82,27.36]]]}],"mcq":false},{"id":"U1S1-5","pg":12,"sec":"Unit 1 - Section 1 Review (p.12)","qn":"Q5","typ":4,"q":"At home, how do you respond to some stimuli such as loud voice and light? Explain.","steps":["Say what a stimulus is.","Give the book example, then your own."],"ans":"A stimulus is any change in the environment that affects an organism, such as light or sound (p.10). Book example: when your pupils are exposed to light they become smaller. Mine, not from the book: for a loud voice I turn toward it or cover my ears, and for bright light I squint or close my eyes.","src":"p.10","st":"o","mine":true,"rp":[{"pg":10,"g":[[[49.77,22.41,58.5,24.18],[10.58,24.16,58.5,25.93],[10.58,25.91,17.21,27.67]]]}],"mcq":false},{"id":"U1S2-SC1","pg":14,"sec":"Unit 1 - Section 2 (Self-Check, p.14)","qn":"Self-Check","typ":5,"q":"What process do plants use to make food?","steps":["It needs carbon dioxide gas."],"ans":"Photosynthesis.","src":"p.14","st":"b","sp":[{"pg":14,"g":[[[37.38,62.02,66.4,63.79]]]}],"mcq":false},{"id":"U1S2-1","pg":19,"sec":"Unit 1 - Section 2 Review (p.19)","qn":"Q1","typ":1,"q":"Define: proteins, nucleic acids, ATP.","steps":["Find each word in the Definitions boxes."],"ans":"Protein: a large molecule made up of smaller subunits called amino acids. Nucleic acid: a molecule made up of subunits called nucleotides (two types, DNA and RNA). ATP: the major energy-carrying molecule in the cell.","src":"p.16, p.18","st":"b","sp":[{"pg":16,"g":[[[16.4,27.07,21.7,28.83],[22.41,27.07,28.41,28.83],[29.12,27.07,33.42,28.83]]]},{"pg":18,"g":[[[39.17,21.83,71.5,23.6]]]}],"mcq":false},{"id":"U1S2-2","pg":19,"sec":"Unit 1 - Section 2 Review (p.19)","qn":"Q2","typ":3,"q":"What is the difference between producer and consumer?","steps":["Say who makes its own food."],"ans":"A producer can make its own food by using energy from its surroundings. A consumer cannot make its own food, so it eats other organisms or organic matter.","src":"p.15","st":"b","sp":[{"pg":15,"g":[[[84.6,42.86,88.49,44.62],[64.43,44.6,88.49,46.37],[64.43,46.35,86.21,48.12]]]}],"mcq":false},{"id":"U1S2-3","pg":19,"sec":"Unit 1 - Section 2 Review (p.19)","qn":"Q3","typ":4,"q":"Explain why organisms need food, water, air and a living place.","steps":["Take them one at a time, in the order of the page."],"ans":"Food gives energy and the raw materials (nutrients) to carry on life processes, replace destroyed cells and build body parts. Water: cells are about 70% water and the chemical reactions of metabolism need it. Air: most living things use oxygen to release energy from food, and plants, algae and some bacteria use carbon dioxide to make food. A place to live gives the space an organism needs to survive.","src":"p.14, p.15","st":"b","sp":[{"pg":15,"g":[[[32.18,53.44,35.87,55.21],[36.22,53.44,40.02,55.21],[40.37,53.44,47.73,55.21],[48.08,53.44,52.94,55.21]]]}],"mcq":false},{"id":"U1S2-4","pg":19,"sec":"Unit 1 - Section 2 Review (p.19)","qn":"Q4","typ":5,"q":"What are the subunits of proteins?","steps":["The Definitions box on the proteins page."],"ans":"Amino acids.","src":"p.16","st":"b","sp":[{"pg":16,"g":[[[16.4,27.07,21.7,28.83],[22.41,27.07,28.41,28.83],[29.12,27.07,33.42,28.83]]]}],"mcq":false},{"id":"U1S2-5","pg":19,"sec":"Unit 1 - Section 2 Review (p.19)","qn":"Q5","typ":4,"q":"Why are decomposers categorized as consumers? How do they differ from producers?","steps":["Say what a consumer cannot do.","Say what a decomposer does."],"ans":"A decomposer cannot make its own food, so it is a consumer. It breaks down the remains of dead organisms or animal wastes to get energy and nutrients. A producer makes its own food using energy from its surroundings.","src":"p.15","st":"b","sp":[{"pg":15,"g":[[[84.6,42.86,88.49,44.62],[64.43,44.6,88.49,46.37],[64.43,46.35,86.21,48.12]]]}],"mcq":false},{"id":"U1S2-6","pg":19,"sec":"Unit 1 - Section 2 Review (p.19)","qn":"Q6","typ":4,"q":"Could life as we know exist on earth if air contained only oxygen? Explain.","steps":["Think about what plants take from the air."],"ans":"The book says air is a mixture of gases including oxygen and carbon dioxide, and plants, algae and some bacteria need carbon dioxide to make food and oxygen (p.14). Mine, not from the book: with only oxygen there would be no carbon dioxide, so plants could not make food, and the other organisms depend on that food. So life as we know it could not exist.","src":"p.14","st":"o","mine":true,"rp":[{"pg":14,"g":[[[37.38,62.02,66.4,63.79]]]}],"mcq":false},{"id":"U1S2-7","pg":19,"sec":"Unit 1 - Section 2 Review (p.19)","qn":"Q7","typ":4,"q":"What would happen to the supply of ATP in your cells if you did not eat enough carbohydrate? How would this affect your body cell?","steps":["Carbohydrates are the main source of energy.","Their energy is transferred to ATP."],"ans":"The book says carbohydrates are the main source of energy and that their stored energy must be transferred to ATP, which fuels the cell activities (p.17, p.18). Mine, not from the book: with too little carbohydrate the cells would make less ATP, so they would have less fuel for their activities.","src":"p.17, p.18","st":"o","mine":true,"sp":[{"pg":17,"g":[[[12.66,17.13,47.65,18.9]]]},{"pg":18,"g":[[[39.17,21.83,71.5,23.6]]]}],"mcq":false},{"id":"U1S2-8","pg":19,"sec":"Unit 1 - Section 2 Review (p.19)","qn":"Q8","typ":4,"q":"Which resource do you think is most important to your survival: water, air, a place to live or food? Explain your answer.","steps":["Choose one and give a reason from the page."],"ans":"The book does not rank them; it says almost every organism needs all four (p.14). Mine, not from the book: water or air. For example, the book says you could survive only about three days without water (p.14), and cells use oxygen to release energy from food. Any choice with a reason is fine.","src":"p.14","st":"o","mine":true,"rp":[{"pg":15,"g":[[[32.18,53.44,35.87,55.21],[36.22,53.44,40.02,55.21],[40.37,53.44,47.73,55.21],[48.08,53.44,52.94,55.21]]]}],"mcq":false},{"id":"U1CR-1","pg":20,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q1","typ":1,"q":"Define: lipids, carbohydrates, consumers, decomposers.","steps":["Find each word in the Definitions boxes."],"ans":"Lipid: a class of nutrients that does not dissolve in water, such as oil and fat. Carbohydrate: a class of energy-giving nutrients that includes sugars, starch and fibers. Consumer: an organism that cannot make its own food, so it eats other organisms or organic matter. Decomposer: an organism that breaks down the remains of dead organisms or animal wastes to obtain energy and nutrients.","src":"p.15, p.17","st":"b","mk":"H.W written next to it","sp":[{"pg":17,"g":[[[12.66,17.13,47.65,18.9]],[[12.19,55.13,46.98,56.9]]]},{"pg":15,"g":[[[84.6,42.86,88.49,44.62],[64.43,44.6,88.49,46.37],[64.43,46.35,86.21,48.12]]]}],"mcq":false},{"id":"U1CR-2","pg":20,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q2","typ":2,"q":"Which of the following statements about cells is true? a. cells are the structures that contain all of the materials necessary for life. b. cells are found in all organisms. c. cells are sometimes specialized for particular functions. d. all of the above.","steps":["Check each statement against page 9."],"ans":"d. all of the above.","src":"p.9","st":"t","sp":[{"pg":9,"g":[[[44.93,30.9,88.49,32.66],[37.04,32.64,60.63,34.41]]]}],"mcq":true},{"id":"U1CR-3","pg":20,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q3","typ":2,"q":"Which of the following statements about all living things is true? a. all living things reproduce sexually. b. all living things have one or more cells. c. all living things must make their own food. d. all living things reproduce asexually.","steps":["Which one matches the first characteristic of living things?"],"ans":"b. all living things have one or more cells.","src":"p.9, p.12","st":"t","sp":[{"pg":9,"g":[[[37.04,29.15,76.03,30.92]]]}],"mcq":true},{"id":"U1CR-4","pg":20,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q4","typ":2,"q":"Organisms must have food because... a. food is source of energy. b. food supplies cells with oxygen. c. organisms never make their own food. d. all of the above.","steps":["Do producers make their own food?"],"ans":"a. food is source of energy.","src":"p.15","st":"t","sp":[{"pg":15,"g":[[[32.18,53.44,35.87,55.21],[36.22,53.44,40.02,55.21],[40.37,53.44,47.73,55.21],[48.08,53.44,52.94,55.21]]]}],"mcq":true},{"id":"U1CR-5","pg":20,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q5","typ":2,"q":"A change in an organism's environment that affects the organism's activities is a: a. response. b. stimulus. c. metabolism. d. producer.","steps":["It is in the Definitions box on page 10."],"ans":"b. stimulus.","src":"p.10","st":"t","sp":[{"pg":10,"g":[[[49.77,22.41,58.5,24.18],[10.58,24.16,58.5,25.93],[10.58,25.91,17.21,27.67]]]}],"mcq":true},{"id":"U1CR-6","pg":20,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q6","typ":2,"q":"The molecule that contains the information about how to make protein is... a. ATP. b. a carbohydrate. c. DNA. d. lipid.","steps":["Nucleic acids hold the information."],"ans":"c. DNA.","src":"p.18, p.27","st":"t","sp":[{"pg":18,"g":[[[10.58,54.27,16.17,56.04],[16.6,54.27,63.0,56.04]]]}],"mcq":true},{"id":"U1CR-7","pg":21,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q7","typ":2,"q":"The subunits of nucleic acids are... a. nucleotides. b. oils. c. sugars. d. amino acids.","steps":["Proteins have amino acids."],"ans":"a. nucleotides.","src":"p.18","st":"t","sp":[{"pg":18,"g":[[[16.08,27.87,24.72,29.63]]]}],"mcq":false},{"id":"U1CR-8","pg":21,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q8","typ":3,"q":"What is the difference between asexual reproduction and sexual reproduction?","steps":["Say how many parents each one has."],"ans":"Asexual reproduction: a single parent produces offspring identical to itself. Sexual reproduction: two parents produce offspring that share characteristics of both parents.","src":"p.10","st":"b","sp":[{"pg":10,"g":[[[21.03,40.62,58.5,42.38],[10.58,42.36,29.77,44.13]],[[10.58,46.48,58.5,48.24],[10.58,48.22,38.65,49.99]]]}],"mcq":false},{"id":"U1CR-9","pg":21,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q9","typ":4,"q":"Explain briefly why living things need air.","steps":["Think about oxygen and carbon dioxide."],"ans":"Air is a mixture of gases. Animals, plants and most living things use oxygen in a chemical process that releases energy from food. Green plants, algae and some bacteria need carbon dioxide for photosynthesis, through which they make food and oxygen.","src":"p.14","st":"b","sp":[{"pg":14,"g":[[[37.38,62.02,66.4,63.79]]]}],"mcq":false},{"id":"U1CR-10","pg":21,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q10","typ":4,"q":"What is ATP and why is it important to a cell?","steps":["Where does the energy of carbohydrates and lipids go?"],"ans":"ATP (adenosine triphosphate) is the major energy-carrying molecule in the cell. The energy stored in carbohydrates and lipids is transferred to ATP, and ATP then provides fuel for the cell activities.","src":"p.18","st":"b","sp":[{"pg":18,"g":[[[39.17,21.83,71.5,23.6]]]}],"mcq":false},{"id":"U1CR-11","pg":21,"sec":"Unit 1 - Chapter Review (pp.20-21)","qn":"Q11","typ":6,"q":"Use the terms to create a concept map: cell, protein, enzymes, sugars, lipids, nucleotides and nucleic acid.","steps":["Start with the cell in the middle.","Link each molecule to its subunits."],"ans":"A cell is made of molecules: proteins (subunits: amino acids; enzymes are proteins), carbohydrates (made of sugars), lipids, and nucleic acids (subunits: nucleotides; DNA and RNA). The linking words are Mine, not from the book.","src":"p.16, p.17, p.18","st":"b","ask":"The book gives no key for the six empty boxes of the concept map on page 21. Ara wrote the same six words in the same boxes: Lipids, Sugars, Proteins, Nucleic acids, Enzymes, Nucleotides. Is this the teacher's order?","sp":[{"pg":16,"g":[[[16.4,27.07,21.7,28.83],[22.41,27.07,28.41,28.83],[29.12,27.07,33.42,28.83]]]},{"pg":17,"g":[[[12.66,17.13,47.65,18.9]]]},{"pg":18,"g":[[[10.58,54.27,16.17,56.04],[16.6,54.27,63.0,56.04]]]}],"mcq":false},{"id":"U2S1-SC1","pg":26,"sec":"Unit 2 - Section 1 (Self-Check, p.26)","qn":"Self-Check 1","typ":5,"q":"What are the three principles of the cell theory?","steps":["They are numbered on the page."],"ans":"1) All organisms are made of one or more cells. 2) The cell is the basic structural and functional unit of all living things. 3) All cells come from other cells.","src":"p.26","st":"b","sp":[{"pg":26,"g":[[[13.27,34.67,45.66,36.43]]]}],"mcq":false},{"id":"U2S1-SC2","pg":26,"sec":"Unit 2 - Section 1 (Self-Check, p.26)","qn":"Self-Check 2","typ":4,"q":"Why are most cells small?","steps":["Think about the cell surface and the cell volume."],"ans":"Cells take in food and get rid of wastes through their cell membrane. As the cell volume increases, its surface area grows too, but if the cell gets too large the surface area is not large enough to take in enough nutrients or pump out enough wastes. This is the reason why cells are small.","src":"p.26","st":"b","sp":[{"pg":26,"g":[[[38.69,58.66,61.26,60.42],[10.58,60.3,14.99,62.06]]]}],"mcq":false},{"id":"U2S1-1","pg":29,"sec":"Unit 2 - Section 1 Review (p.29)","qn":"Q1","typ":1,"q":"Define: organelles, cell membrane.","steps":["Find each word on pages 26 and 27."],"ans":"Organelles: small structures found in a cell's cytoplasm that perform a specific function. Cell membrane: the protective layer that covers the cell's surface and acts as a barrier; it separates the cell's contents from its environment and controls materials going into and out of the cell.","src":"p.26, p.27","st":"b","sp":[{"pg":27,"g":[[[10.58,57.06,37.98,58.82]]]},{"pg":26,"g":[[[13.27,36.42,60.22,38.18]]]}],"mcq":false},{"id":"U2S1-2","pg":29,"sec":"Unit 2 - Section 1 Review (p.29)","qn":"Q2","typ":2,"q":"Which scientist maintained that plants are made of cells? a. Schwann b. Schleiden c. Virchow d. Mendel","steps":["The page names who studied plants and who studied animals."],"ans":"b. Schleiden.","src":"p.26","st":"b","sp":[{"pg":26,"g":[[[17.51,22.47,38.08,24.24]]]}],"mcq":true},{"id":"U2S1-3","pg":29,"sec":"Unit 2 - Section 1 Review (p.29)","qn":"Q3","typ":5,"q":"Write the three principles of cell theory.","steps":["They are numbered on page 26."],"ans":"1) All organisms are made of one or more cells. 2) The cell is the basic structural and functional unit of all living things. 3) All cells come from other cells.","src":"p.26","st":"b","sp":[{"pg":26,"g":[[[13.27,34.67,45.66,36.43]]]}],"mcq":false},{"id":"U2S1-4","pg":29,"sec":"Unit 2 - Section 1 Review (p.29)","qn":"Q4","typ":5,"q":"Name three structures that every cell has.","steps":["The summary on this page says it."],"ans":"Cell membrane, cytoplasm and DNA.","src":"p.29","st":"b","sp":[{"pg":29,"g":[[[15.31,27.21,54.12,28.98]]]}],"mcq":false},{"id":"U2S1-5","pg":29,"sec":"Unit 2 - Section 1 Review (p.29)","qn":"Q5","typ":4,"q":"What would occur if a cell's volume gets too much larger than its normal size?","steps":["Think about the surface area."],"ans":"The cell surface area would not be large enough to take in enough nutrients or pump out enough wastes.","src":"p.26","st":"b","sp":[{"pg":26,"g":[[[38.69,58.66,61.26,60.42],[10.58,60.3,14.99,62.06]]]}],"mcq":false},{"id":"U2S2-SC1","pg":31,"sec":"Unit 2 - Section 2 (Self-Check, p.31)","qn":"Self-Check","typ":5,"q":"Write some characteristics of bacterial cells.","steps":["Read the Bacteria part of the page."],"ans":"Bacteria are the smallest organisms and are prokaryotes. They have no nucleus; their genetic material is a long circular DNA molecule scattered in the cytoplasm. They have no membrane bound organelles but have small ribosomes that make proteins. Most have a strong cell wall that helps the cell keep its shape, and they use flagella for movement.","src":"p.31","st":"b","sp":[{"pg":31,"g":[[[52.42,58.26,78.19,60.02]]]}],"mcq":false},{"id":"U2S2-SC2","pg":32,"sec":"Unit 2 - Section 2 (Self-Check, p.32)","qn":"Self-Check","typ":3,"q":"What is the difference between prokaryotes and eukaryotes?","steps":["Look at the nucleus."],"ans":"Prokaryotes have no nucleus and no membrane bound organelles (for example bacteria). Eukaryotes have a nucleus, which is a membrane bound organelle that contains the cell's DNA, and other membrane bound organelles. Eukaryotes can be single-celled or multicellular.","src":"p.31, p.32","st":"b","sp":[{"pg":31,"g":[[[37.04,31.21,85.38,32.97]]]}],"mcq":false},{"id":"U2S2-1","pg":36,"sec":"Unit 2 - Section 2 Review (p.36)","qn":"Q1","typ":1,"q":"Define: prokaryotes, lysosomes, ribosomes.","steps":["Find each word on pages 31, 34 and 35."],"ans":"Prokaryotes: single-celled organisms that do not have a nucleus and membrane bound organelles, such as bacteria. Lysosomes: vesicles responsible for the digestion inside the cell; they contain digestive enzymes. Ribosomes: organelles that make proteins; the site of protein synthesis.","src":"p.31, p.34, p.35","st":"b","sp":[{"pg":31,"g":[[[37.04,31.21,85.38,32.97]]]},{"pg":35,"g":[[[11.53,30.99,62.96,32.75]]]},{"pg":34,"g":[[[10.79,71.75,29.67,73.52]]]}],"mcq":false},{"id":"U2S2-2","pg":36,"sec":"Unit 2 - Section 2 Review (p.36)","qn":"Q2","typ":2,"q":"Which of the followings are found mainly in animal cells? a. mitochondria. b. lysosome. c. ribosome. d. Golgi complex.","steps":["One organelle is described as found mainly in animal cells."],"ans":"b. lysosome.","src":"p.35","st":"b","sp":[{"pg":35,"g":[[[24.44,35.9,57.4,37.67]]]}],"mcq":true},{"id":"U2S2-3","pg":36,"sec":"Unit 2 - Section 2 Review (p.36)","qn":"Q3","typ":3,"q":"Write two differences between animal cells and plant cells.","steps":["Think about the cell wall and the chloroplasts."],"ans":"1) Plant cells have a cell wall (the cells of plants, algae, fungi and bacteria do); animal cells do not. 2) Plant cells have chloroplasts for photosynthesis; animal cells cannot make their own food. (Also: lysosomes are found mainly in animal cells, and plant cells have a large central vacuole.)","src":"p.33, p.35","st":"b","sp":[{"pg":33,"g":[[[10.58,19.74,60.41,21.51],[10.58,21.93,35.53,23.69]]]},{"pg":35,"g":[[[29.74,42.05,62.96,43.82],[11.53,43.69,39.98,45.46]]]}],"mcq":false},{"id":"U2S2-4","pg":36,"sec":"Unit 2 - Section 2 Review (p.36)","qn":"Q4","typ":4,"q":"Why do all cells need ribosomes?","steps":["What do ribosomes make?"],"ans":"Ribosomes are the site of protein synthesis, they make proteins, and all cells need proteins.","src":"p.31, p.34, p.36","st":"b","sp":[{"pg":34,"g":[[[10.79,71.75,29.67,73.52]]]}],"mcq":false},{"id":"U2S2-5","pg":36,"sec":"Unit 2 - Section 2 Review (p.36)","qn":"Q5","typ":4,"q":"Do you think that having chloroplast gives plant cells an advantage over animal cells? Support your opinion.","steps":["Who can make their own food?"],"ans":"Yes. Chloroplasts are where photosynthesis takes place (p.35), so plant cells can make their own food from sunlight, water and carbon dioxide. Animal cells cannot make their own food (p.35).","src":"p.35","st":"b","sp":[{"pg":35,"g":[[[29.74,42.05,62.96,43.82],[11.53,43.69,39.98,45.46]]]}],"mcq":false},{"id":"U2S2-6","pg":36,"sec":"Unit 2 - Section 2 Review (p.36)","qn":"Q6","typ":6,"q":"The picture shows a particular organism. a. What is the name of this organism? b. Which structure helps the organism move? c. What part does the letter A represent?","steps":["Compare the picture with Figure 1 on page 31."],"ans":"a) A bacterium (a bacterial cell, like Figure 1 on p.31). b) The flagellum (bacteria use flagella for movement, p.31). c) Mine, not from the book: A points to the coiled threads in the cytoplasm, which is the genetic material: the long circular DNA molecule.","src":"p.31","st":"o","mine":true,"ask":"Is letter A on the bacterium the DNA?","sp":[{"pg":31,"g":[[[52.42,58.26,78.19,60.02]]]}],"mcq":false},{"id":"U2S3-1","pg":41,"sec":"Unit 2 - Section 3 Review","qn":"Q1","typ":1,"mk":"Underlined by the teacher","q":"Define the following: tissue, organ, organ system.","steps":["Find each term in the page text or the Definitions boxes.","Say what it is, then what it does.","Put them in order from small to large: tissue, organ, organ system."],"ans":"Tissue: a group of cells that work together to perform a specific job. Organ: two or more tissues working together to perform a specific function. Organ system: a group of organs working together to perform a particular function.","src":"p.38 (tissue), p.39 (organ, organ system)","st":"b","err":[{"k":"typo","m":"'Interstine' should be 'Intestine' (large intestine)."}],"sp":[{"pg":38,"g":[[[34.66,46.88,87.6,48.65]]]},{"pg":39,"g":[[[11.81,19.65,61.68,21.41],[11.81,21.5,33.38,23.27]],[[11.81,68.45,61.68,70.21],[11.81,70.41,31.25,72.18]]]}],"mcq":false},{"id":"U2S3-2","pg":41,"sec":"Unit 2 - Section 3 Review","qn":"Q2","typ":2,"q":"The four levels of organization in organisms: a. cell, multicellular, organ, organ system. b. unicellular, multicellular, tissue, organ. c. organ system, unicellular, multicellular, organ. d. cell, tissue, organ, organ system.","steps":["Remember the level list from the page: it starts with the smallest unit.","Cross out options that contain unicellular or multicellular, those are not levels.","Check the order is small to large."],"ans":"d. cell, tissue, organ, organ system.","src":"p.38 and p.41 (We learned together)","st":"b","sp":[{"pg":41,"g":[[[16.59,24.26,64.02,26.03],[16.59,26.33,35.74,28.1]]]},{"pg":38,"g":[[[60.83,31.88,87.6,33.65],[34.66,33.63,79.25,35.4]]]}],"mcq":true},{"id":"U2S3-3","pg":41,"sec":"Unit 2 - Section 3 Review","qn":"Q3","typ":2,"q":"The tissue where photosynthesis takes place: a. xylem b. phloem c. transport d. ground.","steps":["Recall the three plant tissues: transport (xylem and phloem), ground, protective.","Find which one the book links to photosynthesis."],"ans":"d. ground tissue.","src":"p.38","st":"t","sp":[{"pg":38,"g":[[[39.09,57.37,72.55,59.13]]]}],"mcq":true},{"id":"U2S3-4","pg":41,"sec":"Unit 2 - Section 3 Review","qn":"Q4","typ":4,"mk":"Underlined by the teacher","q":"Explain the relationship between structure and function with an example.","steps":["Say what structure is and what function is.","Say they are related.","Give the book's example: the lungs."],"ans":"Structure is the arrangement of the parts of an organism (the shape of a part and the material it is made of). Function is the job the part does. They are related. Example: the lungs are a large spongy sac with millions of tiny air sacs (alveoli) wrapped by blood capillaries. This structure lets them bring oxygen to the body and get rid of carbon dioxide.","src":"p.40","st":"b","sp":[{"pg":40,"g":[[[47.35,45.78,87.19,47.55]],[[62.3,47.42,86.02,49.19]]]}],"mcq":false},{"id":"U2S3-5","pg":41,"sec":"Unit 2 - Section 3 Review","qn":"Q5","typ":5,"mk":"Underlined by the teacher","q":"Name four organ systems of the human body, other than those mentioned.","steps":["Look for organ systems named in the section.","Only the ones the book names can be used."],"ans":"Mine, not from the book: 1) Nervous system (brain and nerves). 2) Respiratory system (lungs). 3) Muscular system (muscles). 4) Excretory system (kidneys). The book shows the organs brain, lungs and kidneys (Figure 2, p.39), nervous and muscle tissue (p.38) and the lungs with the air sacs (p.40), but it does not name these systems.","src":"p.38, p.39, p.40 (organs); system names are mine","st":"o","mine":true,"rp":[{"pg":39,"g":[[[31.91,70.41,61.68,72.18],[11.81,72.38,23.45,74.15]],[[24.22,72.38,61.68,74.15],[11.81,74.35,22.16,76.11]]]}],"mcq":false},{"id":"U2CR-1","pg":42,"sec":"Unit 2 - Chapter Review","qn":"Q1","typ":1,"mk":"H.W written next to it","q":"Define the following: cell, organelle, cell wall, function.","steps":["Find each term in the book.","Write one sentence for each."],"ans":"Cell: the basic structural and functional unit of all living things. Organelle: a small structure in the cell's cytoplasm that carries out a specific function. Cell wall: a rigid external structure that surrounds the cell membrane and supports the cell. Function: the special, or normal, activity performed by an organ or part of an organism.","src":"p.26 (cell theory), p.27 (organelle), p.33 (cell wall), p.40 (function)","st":"b","sp":[{"pg":26,"g":[[[13.27,36.42,60.22,38.18]]]},{"pg":27,"g":[[[68.75,40.46,90.46,42.23],[68.75,42.21,90.46,43.97],[68.75,43.96,83.39,45.72]]]},{"pg":33,"g":[[[10.58,19.74,60.41,21.51],[10.58,21.93,35.53,23.69]]]},{"pg":40,"g":[[[62.3,47.42,86.02,49.19]]]}],"mcq":false},{"id":"U2CR-2","pg":42,"sec":"Unit 2 - Chapter Review","qn":"Q2","typ":2,"q":"Which statement best describes an organ? a. a group of cells that work together to perform a specific job. b. a group of tissues that belong to different systems. c. a group of tissues that work together to perform a specific job. d. a body structure, such as muscles or lungs.","steps":["An organ is made of tissues, so remove option a (cells).","Remove option b (different systems) and d (not a definition).","Choose the option with tissues and a specific job."],"ans":"c. a group of tissues that work together to perform a specific job.","src":"p.39","st":"t","sp":[{"pg":39,"g":[[[11.81,19.65,61.68,21.41],[11.81,21.5,33.38,23.27]]]}],"mcq":true},{"id":"U2CR-3","pg":42,"sec":"Unit 2 - Chapter Review","qn":"Q3","typ":2,"q":"In eukaryotic cells, which organelle contains DNA? a. nucleus b. Golgi complex c. smooth endoplasmic reticulum d. vacuole.","steps":["Think of the organelle that holds the cell's DNA.","It is the one the book says is enclosed with the DNA in all eukaryotic cells."],"ans":"a. nucleus.","src":"p.28","st":"t","sp":[{"pg":28,"g":[[[10.58,21.75,61.26,23.51],[10.58,23.71,16.52,25.48]]]}],"mcq":true},{"id":"U2CR-4","pg":42,"sec":"Unit 2 - Chapter Review","qn":"Q4","typ":2,"q":"Which statement is part of the cell theory? a. all cells suddenly appear by themselves. b. All cells come from other cells. c. All organisms are multicellular. d. All cells have identical parts.","steps":["Recall the three facts of the cell theory.","Pick the option that matches one of them word for word."],"ans":"b. All cells come from other cells.","src":"p.26","st":"t","sp":[{"pg":26,"g":[[[13.27,38.16,35.95,39.93]]]}],"mcq":true},{"id":"U2CR-5","pg":42,"sec":"Unit 2 - Chapter Review","qn":"Q5","typ":5,"q":"Arrange the four levels of organization in living things from smallest to largest.","steps":["Start from the unit of life.","Each level is made of the one before it."],"ans":"Cell, tissue, organ, organ system.","src":"p.38, p.41","st":"b","sp":[{"pg":41,"g":[[[16.59,24.26,64.02,26.03],[16.59,26.33,35.74,28.1]]]},{"pg":38,"g":[[[60.83,31.88,87.6,33.65],[34.66,33.63,79.25,35.4]]]}],"mcq":false},{"id":"U2CR-6","pg":42,"sec":"Unit 2 - Chapter Review","qn":"Q6","typ":5,"q":"Name two functions of the cell membrane.","steps":["Recall what the membrane does at the edge of the cell.","Write two separate jobs."],"ans":"1) It is a protective layer that acts as a barrier, separating the cell's contents from its environment. 2) It controls the materials going into and out of the cell.","src":"p.26","st":"b","sp":[{"pg":26,"g":[[[44.08,73.22,61.26,74.99],[10.58,74.86,59.54,76.63]],[[47.3,76.5,61.26,78.26],[10.58,78.14,49.34,79.9]]]}],"mcq":false},{"id":"U2CR-7","pg":42,"sec":"Unit 2 - Chapter Review","qn":"Q7","typ":6,"q":"Use the terms to create a concept map: cells, organisms, Golgi complex, organ system, organ, nucleus, organelle, and tissues.","steps":["Put the big idea at the top: organisms.","Add the four levels in order, from top to bottom.","Branch the cell into organelles, then add the nucleus and the Golgi complex."],"ans":"Organisms are made of organ systems, which are made of organs, which are made of tissues, which are made of cells. A cell contains organelles, for example the nucleus and the Golgi complex. The words linking the boxes are Mine, not from the book.","src":"p.38, p.27 and p.35","st":"b","err":[{"k":"typo","m":"'aconcept' should be 'a concept' (create a concept map)."}],"sp":[{"pg":38,"g":[[[60.83,31.88,87.6,33.65],[34.66,33.63,79.25,35.4]]]},{"pg":27,"g":[[[68.75,40.46,90.46,42.23],[68.75,42.21,90.46,43.97],[68.75,43.96,83.39,45.72]]]}],"mcq":false},{"id":"U2CR-8","pg":42,"sec":"Unit 2 - Chapter Review","qn":"Q8","typ":5,"q":"Write the function of: endoplasmic reticulum, Golgi complex, cell wall.","steps":["Find the organelle's section.","Write one job for each."],"ans":"Endoplasmic reticulum: a system of folded membranes where proteins, lipids and other materials are made, part of the cell's internal delivery system. Golgi complex: packages and distributes proteins. Cell wall: gives support to the cell.","src":"p.34 (ER), p.35 (Golgi), p.33 (cell wall)","st":"b","sp":[{"pg":34,"g":[[[48.41,27.1,60.62,28.87],[10.79,28.74,60.62,30.51],[10.79,30.38,36.48,32.15]]]},{"pg":35,"g":[[[23.03,18.28,62.96,20.05]]]},{"pg":33,"g":[[[10.58,19.74,60.41,21.51],[10.58,21.93,35.53,23.69]]]}],"mcq":false},{"id":"U2CR-9","pg":42,"sec":"Unit 2 - Chapter Review","qn":"Q9","typ":4,"q":"A classmate says that all organisms must have organ systems. Is the hypothesis valid? Explain.","steps":["Say yes or no.","Find who has the four levels.","Give the reason."],"ans":"No. Some organisms exist as a single cell. Only multicellular organisms are arranged into the four levels (cell, tissue, organ, organ system).","src":"p.38","st":"b","sp":[{"pg":38,"g":[[[68.51,28.39,87.6,30.15],[34.66,30.14,42.5,31.9]]]}],"mcq":false},{"id":"U2CR-10","pg":43,"sec":"Unit 2 - Chapter Review","qn":"Q10","typ":4,"q":"What would happen if all ribosomes in your cells disappeared?","steps":["Find what ribosomes do.","Say what the cell could no longer do."],"ans":"Ribosomes are the site of protein synthesis, they make proteins. Without them cells could not make proteins.","src":"p.34, p.36","st":"b","sp":[{"pg":34,"g":[[[10.79,71.75,29.67,73.52]]]},{"pg":36,"g":[[[15.29,36.63,54.05,38.4]]]}],"mcq":false},{"id":"U2CR-11","pg":43,"sec":"Unit 2 - Chapter Review","qn":"Q11","typ":6,"q":"Look at the figure and write the name and function of the parts labelled a, b, c, d.","steps":["Compare the figure with Figure 2 on p.32, which has the names.","Match the shape and colour of each pointed part.","Write the name, then its function from the organelle sections."],"ans":"Mine, not from the book: a = Mitochondrion: the site of energy production in the cell, it releases energy as ATP (p.34). b = Lysosome: digests materials inside the cell and destroys worn-out organelles (p.35). c = Endoplasmic reticulum: a system of folded membranes where proteins and lipids are made and moved (p.34). d = Nucleus: holds the DNA and controls the cell (p.28, p.32). I matched the letters by comparing this picture with Figure 2 on p.32.","src":"p.43 figure, p.32 Figure 2, p.34, p.35, p.28","st":"o","ask":"The letters were matched by looking at the picture. Worth showing the teacher once.","mine":true,"rp":[{"pg":32,"g":[[[35.54,81.57,64.03,83.75]]]}],"mcq":false},{"id":"U3S1-5","pg":48,"sec":"Unit 3 - Section 1 (Self-Check, p.48)","qn":"Self-Check","typ":4,"q":"Why do red blood cells burst when they are put in pure water?","steps":["Which way does water move in pure water?","What happens to the cell as it fills?"],"ans":"Water molecules flood into the cells by osmosis and cause them to burst.","src":"p.48","st":"b","err":[{"k":"typo","m":"'od' should be 'of' (the concentration of water outside)."}],"sp":[{"pg":48,"g":[[[71.41,13.95,87.01,15.71],[34.07,15.92,67.35,17.68]]]}],"mcq":false},{"id":"U3S1-1","pg":50,"sec":"Unit 3 - Section 1 Review","qn":"Q1","typ":3,"q":"Write the differences between: diffusion and osmosis; active transport and passive transport; endocytosis and exocytosis.","steps":["Make two short columns for each pair.","Compare the same thing in both: what moves, which direction, energy or not.","Use the key word that tells them apart."],"ans":"Diffusion: movement of particles from higher to lower concentration. Osmosis: the diffusion of water through a semipermeable membrane. Passive transport: no energy, from higher to lower concentration. Active transport: needs energy, from lower to higher concentration. Endocytosis: a cell encloses a large particle in a vesicle to bring it into the cell. Exocytosis: a vesicle carries a large particle out of the cell.","src":"p.47, p.48, p.49","st":"b","sp":[{"pg":47,"g":[[[36.06,50.59,89.0,52.35],[36.06,52.55,58.97,54.32]],[[53.89,67.55,89.0,69.32],[36.06,69.52,89.0,71.28],[36.06,71.48,47.04,73.25]]]},{"pg":48,"g":[[[10.58,56.77,83.25,58.53]],[[10.58,62.97,89.0,64.74],[10.58,64.94,35.37,66.7]]]}],"mcq":false},{"id":"U3S1-2","pg":50,"sec":"Unit 3 - Section 1 Review","qn":"Q2","typ":2,"q":"Moving particles from low concentration to high concentration requires: a. diffusion b. energy c. vesicle d. osmosis.","steps":["Which direction is this? Low to high.","Recall what the book says about that direction."],"ans":"b. energy (active transport).","src":"p.48","st":"b","sp":[{"pg":48,"g":[[[10.58,62.97,89.0,64.74],[10.58,64.94,35.37,66.7]],[[35.85,64.94,60.97,66.7]]]}],"mcq":true},{"id":"U3S1-3","pg":50,"sec":"Unit 3 - Section 1 Review","qn":"Q3","typ":5,"q":"Which structures allow small particles to cross the cell membrane?","steps":["Find where small particles cross.","Name the structure and what it is made of."],"ans":"Channels, passageways made of proteins in the cell membrane.","src":"p.48","st":"b","sp":[{"pg":48,"g":[[[10.58,50.56,84.3,52.33]]]}],"mcq":false},{"id":"U3S1-4","pg":50,"sec":"Unit 3 - Section 1 Review","qn":"Q4","typ":4,"q":"Why does active transport need energy?","steps":["Say which way the particles move.","Say what the cell must do."],"ans":"Because it moves substances from an area of lower concentration to an area of higher concentration, and the book says this requires the cell to use energy.","src":"p.48","st":"b","sp":[{"pg":48,"g":[[[10.58,62.97,89.0,64.74],[10.58,64.94,35.37,66.7]],[[35.85,64.94,60.97,66.7]]]}],"mcq":false},{"id":"U3S2-SC1","pg":53,"sec":"Unit 3 - Section 2 (Self-Check, p.53)","qn":"Self-Check 1","typ":3,"q":"Differentiate between photosynthesis and cellular respiration.","steps":["Say what each process uses.","Say what each process makes or releases.","Say how the two are connected."],"ans":"Photosynthesis: plants, algae and some bacteria use sunlight, water and carbon dioxide to make food (glucose), and oxygen is released. Cellular respiration: cells use oxygen to break down food (glucose) into carbon dioxide and water, and energy is released; some of it is stored as ATP.","src":"p.52, p.53, p.54","st":"b","err":[{"k":"logic","m":"The text on this page says carbon dioxide and water change into food (glucose) and oxygen is produced, but the printed equation has glucose and oxygen on the left and water and carbon dioxide on the right. The correct direction follows the text: carbon dioxide + water + sunlight energy gives glucose + oxygen."}],"sp":[{"pg":52,"g":[[[11.47,62.36,31.4,64.13],[11.47,64.11,31.4,65.88],[11.47,65.86,31.4,67.62],[11.47,67.6,31.4,69.37],[11.47,69.35,15.64,71.12]]]},{"pg":54,"g":[[[12.59,22.68,56.95,24.44]],[[57.36,22.68,89.0,24.44],[12.59,24.43,62.73,26.19]]]},{"pg":53,"g":[[[68.18,23.96,88.11,25.73],[68.18,25.71,88.1,27.47],[68.18,27.46,75.75,29.22]]]}],"mcq":false},{"id":"U3S2-SC2","pg":53,"sec":"Unit 3 - Section 2 (Self-Check, p.53)","qn":"Self-Check 2","typ":5,"q":"What are the two kinds of fermentation?","steps":["Find the word fermentation in the page.","Each kind has its own name."],"ans":"1) Lactic acid fermentation (in the muscle cells of animals and in some fungi and bacteria). 2) Alcoholic fermentation (in some bacteria and in yeast; it forms alcohol and carbon dioxide).","src":"p.53","st":"b","sp":[{"pg":53,"g":[[[20.56,79.65,65.77,81.41],[12.83,81.61,65.77,83.38]],[[12.83,85.55,65.77,87.31],[12.83,87.51,29.84,89.28]]]}],"mcq":false},{"id":"U3S2-1","pg":55,"sec":"Unit 3 - Section 2 Review","qn":"Q1","typ":1,"q":"Define: photosynthesis, cellular respiration.","steps":["Say who does it and what is used.","Say what is made or obtained."],"ans":"Photosynthesis: the process by which plants, algae and some bacteria use sunlight, water and carbon dioxide to make food. Cellular respiration: the process in which cells use oxygen to obtain energy from food.","src":"p.52, p.53","st":"b","err":[{"k":"logic","m":"The text on this page says carbon dioxide and water change into food (glucose) and oxygen is produced, but the printed equation has glucose and oxygen on the left and water and carbon dioxide on the right. The correct direction follows the text: carbon dioxide + water + sunlight energy gives glucose + oxygen."}],"sp":[{"pg":52,"g":[[[11.47,62.36,31.4,64.13],[11.47,64.11,31.4,65.88],[11.47,65.86,31.4,67.62],[11.47,67.6,31.4,69.37],[11.47,69.35,15.64,71.12]]]},{"pg":53,"g":[[[68.18,23.96,88.11,25.73],[68.18,25.71,88.1,27.47],[68.18,27.46,75.75,29.22]]]}],"mcq":false},{"id":"U3S2-2","pg":55,"sec":"Unit 3 - Section 2 Review","qn":"Q2","typ":2,"q":"Oxygen is released during: a. cellular respiration b. photosynthesis c. breathing d. fermentation.","steps":["Cellular respiration uses oxygen.","Find the process that produces it."],"ans":"b. photosynthesis.","src":"p.52, p.54","st":"b","sp":[{"pg":54,"g":[[[12.6,20.93,64.8,22.7]],[[12.59,22.68,56.95,24.44]]]}],"mcq":true},{"id":"U3S2-3","pg":55,"sec":"Unit 3 - Section 2 Review","qn":"Q3","typ":4,"q":"What is the relation between photosynthesis and cellular respiration?","steps":["Write what photosynthesis uses and makes.","Write what respiration uses and makes.","Say how the outputs of one are the inputs of the other."],"ans":"Photosynthesis uses water, carbon dioxide and sunlight energy to make glucose and releases oxygen. Cellular respiration uses oxygen to break down glucose and releases energy, carbon dioxide and water. Each process makes the materials needed for the other.","src":"p.54","st":"b","err":[{"k":"logic","m":"The text on this page says carbon dioxide and water change into food (glucose) and oxygen is produced, but the printed equation has glucose and oxygen on the left and water and carbon dioxide on the right. The correct direction follows the text: carbon dioxide + water + sunlight energy gives glucose + oxygen."}],"sp":[{"pg":54,"g":[[[12.6,20.93,64.8,22.7]],[[12.59,22.68,56.95,24.44]],[[57.36,22.68,89.0,24.44],[12.59,24.43,62.73,26.19]],[[72.08,24.43,89.0,26.19],[12.59,26.17,45.95,27.94]]]}],"mcq":false},{"id":"U3S2-4","pg":55,"sec":"Unit 3 - Section 2 Review","qn":"Q4","typ":3,"q":"How are cellular respiration and fermentation similar? How are they different?","steps":["Similar: say what both do with food.","Different: oxygen, and how much energy."],"ans":"Similar: both are ways cells get energy from food. Different: cellular respiration uses oxygen and releases more energy from a given food; fermentation releases energy without using oxygen and releases less.","src":"p.53, p.55","st":"b","sp":[{"pg":53,"g":[[[12.83,27.03,65.77,28.79],[12.83,28.99,26.75,30.76]],[[56.89,20.51,65.77,22.28],[12.83,22.48,65.77,24.24],[12.83,24.44,18.7,26.21]]]},{"pg":55,"g":[[[16.38,34.74,62.96,36.5],[16.38,36.81,34.07,38.58]]]}],"mcq":false},{"id":"U3S2-5","pg":55,"sec":"Unit 3 - Section 2 Review","qn":"Q5","typ":4,"q":"What is the importance of plants for the survival of other organisms?","steps":["What do plants make?","Who uses it?"],"ans":"Plants make food by photosynthesis, which supplies them with energy and becomes a source of energy for the organisms that eat plants. Photosynthesis also produces oxygen.","src":"p.52","st":"b","sp":[{"pg":52,"g":[[[84.32,41.66,87.11,43.42],[34.18,43.62,71.9,45.39]],[[72.71,43.62,87.11,45.39],[34.18,45.59,73.03,47.35]]]}],"mcq":false},{"id":"U3S2-6","pg":55,"sec":"Unit 3 - Section 2 Review","qn":"Q6","typ":5,"q":"Write two functions of the chlorophyll pigment.","steps":["Recall what a pigment does with light.","Recall what chlorophyll gives plants."],"ans":"1) It absorbs light energy (the energy of sunlight needed for photosynthesis). 2) It gives plants their green colour.","src":"p.52, p.35","st":"b","sp":[{"pg":35,"g":[[[20.52,50.86,62.96,52.63],[11.53,52.5,26.46,54.27]]]},{"pg":52,"g":[[[34.18,52.1,59.76,53.87]]]}],"mcq":false},{"id":"U3S3-7","pg":59,"sec":"Unit 3 - Section 3 (Self-Check, p.59)","qn":"Self-Check","typ":3,"q":"What is the difference between cytokinesis in an animal cell and in a plant cell?","steps":["Animal: no cell wall.","Plant: has a cell wall."],"ans":"Animal cell: the cell membrane pinches inward until it pinches all the way through and two daughter cells form. Plant cell: a cell plate forms in the middle and extends outward; a new cell wall forms where it was.","src":"p.59","st":"b","sp":[{"pg":59,"g":[[[83.08,55.63,88.87,57.4],[38.41,57.71,88.87,59.47]],[[38.41,59.78,88.87,61.55],[38.41,61.86,42.36,63.62]],[[80.73,66.01,88.88,67.77],[38.41,68.08,82.76,69.84]]]}],"mcq":false},{"id":"U3S3-1","pg":60,"sec":"Unit 3 - Section 3 Review","qn":"Q1","typ":1,"q":"Define: cell cycle, cytokinesis.","steps":["Cell cycle: say what stages of what.","Cytokinesis: say what divides and when."],"ans":"Cell cycle: the life cycle of a cell (the different stages in the life of a cell). Cytokinesis: the division of the cytoplasm of a cell, after division of the nucleus.","src":"p.57, p.59","st":"b","sp":[{"pg":57,"g":[[[11.66,77.99,28.24,79.76]]]},{"pg":59,"g":[[[12.49,60.78,34.29,62.54],[12.49,62.53,34.29,64.29],[12.49,64.27,18.84,66.04]]]}],"mcq":false},{"id":"U3S3-2","pg":60,"sec":"Unit 3 - Section 3 Review","qn":"Q2","typ":2,"q":"Eukaryotic cells: a. do not divide b. undergo binary fission c. undergo mitosis d. have cell walls.","steps":["Binary fission belongs to bacteria.","Not every eukaryotic cell has a cell wall.","Choose the process the book gives for eukaryotic cells."],"ans":"c. undergo mitosis.","src":"p.58, p.60","st":"b","sp":[{"pg":58,"g":[[[10.58,48.67,59.56,50.44],[10.58,50.85,57.39,52.62]]]},{"pg":60,"g":[[[16.91,23.66,63.49,25.42],[16.91,25.73,22.74,27.5]]]}],"mcq":true},{"id":"U3S3-3","pg":60,"sec":"Unit 3 - Section 3 Review","qn":"Q3","typ":4,"q":"Why is it important for chromosomes to be copied before cell division?","steps":["Say what copying ensures.","Say what each new cell receives."],"ans":"Copying the chromosomes ensures that each new cell will be an exact copy of its parent cell, with the same number and types of chromosomes.","src":"p.58","st":"b","sp":[{"pg":58,"g":[[[33.11,26.54,59.56,28.3],[10.58,28.72,50.88,30.49]]]}],"mcq":false},{"id":"U3S3-4","pg":60,"sec":"Unit 3 - Section 3 Review","qn":"Q4","typ":5,"q":"Name the four stages of mitosis.","steps":["Say them in order.","Memory help: the first letters are P, M, A, T (Mine, not from the book)."],"ans":"Prophase, metaphase, anaphase, telophase.","src":"p.58","st":"b","sp":[{"pg":58,"g":[[[10.58,53.44,34.26,55.2],[10.58,56
