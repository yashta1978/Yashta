function dnorm(s){return String(s).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776})}
function nm(s){return dnorm(s).replace(/[ً-ٰٟـ]/g,'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/ه/g,'ە').replace(/[\s\(\)\[\]\.,،:؛!؟?\-–]/g,'')}
function chk(q,v){var n=nm(v);if(!n)return false;
 if(q.eq){return q.eq.some(function(a){return nm(a)===n})}
 return q.keys.every(function(g){return g.some(function(a){return n.indexOf(nm(a))>=0})})}

 return {v:1,book:BOOK,title:D.title,upd:new Date().toISOString(),ext:{units:[],extra:{n:S.xr.n,last:S.xr.last,best:S.xr.best,tot:S.xr.tot},exam:{n:0,best:0,tot:0,last:0}},hw:hw,pos:{done:!!hw.done,label:'Daily homework'},prog:{done:hw.done?1:0,total:1},secs:[],weak:[],days:{}}}
function ghReq(m,p,b){var d=devGet();return fetch((d.api||'https://api.github.com')+'/repos/'+d.repo+'/contents/'+p,{method:m,headers:{'Authorization':'Bearer '+d.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined})}
function markDirty(){if(!canReport())return;SYNC.dirty=true;if(!SYNC.t)SYNC.t=setTimeout(function(){SYNC.t=null;syncNow()},3000)}
async function syncNow(){if(!canReport()||SYNC.busy)return;SYNC.busy=true;SYNC.dirty=false;var fail=false;
 try{var path='reports/'+BOOK+'.json',b64=btoa(unescape(encodeURIComponent(JSON.stringify(buildReport()))));
  for(var tr=0;tr<3;tr++){if(SYNC.sha===null){var g=await ghReq('GET',path);if(g.status===200)SYNC.sha=(await g.json()).sha;else if(g.status===404)SYNC.sha='';else throw new Error('GET '+g.status)}
   var pr=await ghReq('PUT',path,{message:'report '+BOOK,content:b64,sha:SYNC.sha||undefined});
   if(pr.status===200||pr.status===201){SYNC.sha=(await pr.json()).content.sha;break}
   if(pr.status===409||pr.status===422){SYNC.sha=null;continue}throw new Error('PUT '+pr.status)}}
 catch(e){fail=true;SYNC.dirty=true}
 SYNC.busy=false;if(fail&&!SYNC.t)SYNC.t=setTimeout(function(){SYNC.t=null;syncNow()},30000)}
