<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Order of Operations — Interactive Lesson 1-4</title>
<style>
:root{--ink:#1d2433;--gold:#c99a12;--gold2:#f1d21a;--green:#0a7d3b;--green-bg:#e3f6ea;--red:#c62828;--red-bg:#fdeaea;--orange:#d9730d;--orange-bg:#fff1df;--navy:#1b2a49;--paper:#f3efe3}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;padding:8px 12px;border-bottom:3px solid var(--gold2)}
.top .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;max-width:980px;margin:0 auto}
.top h1{font-size:16px;line-height:1.2;margin:0;font-weight:700}
.stat{font-size:14px;line-height:1.3}
.stat b{color:var(--gold2);font-size:16px}
.final{display:none;background:#fff;color:var(--navy);border-radius:8px;padding:2px 10px;font-weight:700}
.final.on{display:inline-block}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-width:980px;margin-left:auto;margin-right:auto}
.nav a,.nav button{background:#2b3d66;color:#fff;border:1px solid #46598a;border-radius:999px;padding:4px 11px;font-size:13px;text-decoration:none;cursor:pointer}
.nav a:hover,.nav button:hover{background:#3a5086}
.nav .rules{background:var(--gold2);color:var(--navy);border-color:var(--gold);font-weight:700}
main{max-width:980px;margin:0 auto;padding:10px 8px 40px}
.pg{margin:16px 0 28px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px}
.bar h2{font-size:15px;margin:0 auto 0 0;color:var(--navy)}
.bar button{background:#fff;border:2px solid var(--gold);color:var(--navy);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer}
.bar button:hover{background:#fff7d1}
.wrap{overflow-x:auto;border-radius:6px}
.page{position:relative;width:100%;max-width:900px;margin:0 auto;aspect-ratio:900/1273;container-type:inline-size;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.22)}
.wrap.zoom .page{width:190%;max-width:none;margin:0}
.page>img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.lines line{stroke:var(--green);stroke-width:3.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.lines line.x{stroke:var(--red)}
.f,.ch,.sym,.bx,.eye,.tp,.dot{position:absolute;transform:translate(-50%,-50%);z-index:4}
.f input{width:100%;height:100%;border:2px dashed #b08a10;border-radius:.9cqw;background:rgba(255,255,250,.96);font:700 max(13px,2.6cqw) Georgia,"Times New Roman",serif;color:#143a8a;text-align:center;padding:0;outline:none;min-width:0}
.f input::placeholder{color:#b9a35a}
.f input:focus{border-style:solid;border-color:var(--navy);box-shadow:0 0 0 3px rgba(241,210,26,.7)}
.f.cir input{border:2px solid #c8323a;border-radius:50%;background:#fff;font-size:max(12px,2.3cqw)}
.f.ok input{border:2px solid var(--green);color:var(--green);background:var(--green-bg)}
.f.sol input{border:2px solid var(--green);color:var(--green);background:var(--green-bg);font-style:italic}
.f.bad input{border:2px solid var(--red);background:var(--red-bg);animation:blink .55s 1}
.f.ok:not(.cir)::after{content:"\2714";position:absolute;right:-1.8cqw;top:-.8cqw;font-size:max(11px,1.9cqw);color:var(--green)}
@keyframes blink{0%,100%{background:#fff}50%{background:#ffbcbc}}
@keyframes blinkb{0%,100%{opacity:1}50%{opacity:.25}}
.fb{display:none;position:absolute;top:calc(100% + 3px);left:0;z-index:9;width:max-content;max-width:34cqw;font:600 max(11px,1.8cqw)/1.3 system-ui,sans-serif;background:var(--orange-bg);border:1.5px solid var(--orange);color:#6b3500;padding:.4cqw .9cqw;border-radius:.8cqw;text-align:left;font-style:normal;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.fb.on{display:block}
.f.r .fb,.ch.r .fb,.sym.r .fb,.bx.r .fb{left:auto;right:0}
.ch,.sym{width:max(22px,4.4cqw);height:max(22px,4.4cqw);border:2px solid transparent;border-radius:50%;background:transparent;cursor:pointer;padding:0;font:700 max(13px,2.5cqw) Georgia,serif;color:var(--navy);line-height:1}
.ch:hover,.sym:hover,.bx:hover{background:rgba(241,210,26,.38)}
.ch:focus-visible,.sym:focus-visible,.bx:focus-visible,.eye:focus-visible,.tp:focus-visible,.dot:focus-visible,.bar button:focus-visible,.nav a:focus-visible,.nav button:focus-visible,.close:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.ch.ok,.sym.ok{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.ch.ok::before{content:"\2714"}
.ch.bad,.sym.bad{background:var(--red-bg);border-color:var(--red);color:var(--red);animation:blinkb .5s 1}
.ch.bad::before{content:"\2718"}
.ch.sol{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.ch.sol::before{content:"\2714"}
.ch.note{background:var(--orange-bg);border-color:var(--orange);color:var(--orange)}
.ch.note::before{content:"?"}
.sym.sol{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.bx{border:3px solid transparent;border-radius:2cqw;background:transparent;cursor:pointer;padding:0;color:var(--navy)}
.bx.pill{background:#fff;border:2px solid var(--gold);border-radius:999px;font-weight:700;font-size:max(11px,2cqw)}
.bx.ok{border-color:var(--green);background:rgba(10,125,59,.14);color:var(--green)}
.bx.pill.ok{background:var(--green-bg)}
.bx.bad{border-color:var(--red);background:rgba(198,40,40,.12);color:var(--red);animation:blinkb .5s 1}
.bx.pill.bad{background:var(--red-bg)}
.bx.sol{border-color:var(--green);background:rgba(10,125,59,.14);color:var(--green)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.eye,.tp{width:max(24px,3.8cqw);height:max(24px,3.8cqw);border-radius:50%;border:2px solid var(--gold);background:#fff;font-size:max(12px,2.1cqw);line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tp{background:var(--gold2)}
.eye.on{background:var(--green-bg);border-color:var(--green)}
.dot{width:max(15px,2cqw);height:max(15px,2cqw);border-radius:50%;background:var(--gold2);border:2px solid #8a6a00;padding:0;cursor:pointer}
.dot.sel{background:#fff;box-shadow:0 0 0 3px var(--navy)}
.dot.on{background:var(--green);border-color:#06562a}
.bub{display:none;position:absolute;z-index:6;background:var(--green-bg);border:1.5px solid var(--green);color:#0b4a25;font:600 max(10px,1.8cqw)/1.35 system-ui,sans-serif;padding:.35cqw .9cqw;border-radius:.8cqw;box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:pointer}
.bub.on{display:block}
.bub .b1{font-weight:700}.bub .b2{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.1em;margin-top:.15em}
.eye.k{font-size:max(9px,1.5cqw);font-weight:800;color:var(--navy);background:var(--gold2)}
.bub.warn{background:var(--orange-bg);border-color:var(--orange);color:#6b3500}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(20,28,45,.62);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal.on{display:flex}
.box{background:#fffdf4;border:3px solid var(--gold);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:16px 18px 18px}
.box h2{margin:0 0 8px;font-size:20px;color:var(--navy)}
.box p{margin:8px 0;font-size:16px;line-height:1.5}
.box ol{margin:8px 0;padding-left:22px;font-size:16px;line-height:1.6}
.eq{background:#fff;border:1px solid #e4d9a8;border-radius:8px;padding:8px 12px;font:600 17px/1.7 Georgia,"Times New Roman",serif;margin:8px 0;overflow-wrap:anywhere}
.box .note{background:var(--orange-bg);border-left:4px solid var(--orange);padding:8px 10px;font-size:14px;line-height:1.45;margin:10px 0 4px}
.close{float:right;margin:-4px -6px 4px 8px;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
#finalBanner{display:none;max-width:900px;margin:8px auto 0;background:#fff;border:3px solid var(--gold);border-radius:14px;padding:14px 18px;text-align:center;font-size:20px;font-weight:700;color:var(--navy)}
#finalBanner.on{display:block}
@media (max-width:600px){.top{padding:6px 10px}.top h1{font-size:13px}.stat{font-size:12px}.stat b{font-size:14px}.nav{flex-wrap:nowrap;overflow-x:auto;margin-top:4px;padding-bottom:2px}.nav a,.nav button{white-space:nowrap;flex:0 0 auto;padding:3px 10px;font-size:12px}html{scroll-padding-top:86px}.bar h2{width:100%}}
@media (prefers-reduced-motion:reduce){.f.bad input,.ch.bad,.sym.bad,.bx.bad{animation:none}html{scroll-behavior:auto}}
</style>
</head>

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function norm(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return String(d.charCodeAt(0)-0x660);}).replace(/[−–—]/g,'-').replace(/\s+/g,'');}
function center(e,x,y,w,h){e.style.left=x+'%';e.style.top=y+'%';if(w!=null)e.style.width=w+'%';if(h!=null)e.style.height=h+'%';}

/* ---------- topics for the 💡 windows (book content only) ---------- */
var TOP={
steps:{t:'Order of operations — the rules',b:[
 {p:'In mathematics, when finding the value of an expression that contains more than one operation, following the rules step by step is called the order of operations.'},
 {ol:['Evaluate the operations inside parentheses.','Evaluate exponents.','Perform multiplication and division from left to right (whichever comes first).','Perform addition and subtraction from left to right (whichever comes first).']},
 {p:'Example from the book:'},{eq:['2 × 4 + 7','8 + 7','15']}]},
discover:{t:'I Discover: Hiwa and Narin',b:[
 {p:'Both wrote 2 × 4 + 7 (two equal groups of 4 balls and one group of 7 balls), but they got different answers.'},
 {p:'Hiwa added first: 4 + 7 = 11, then multiplied the result by 2: 11 × 2 = 22. This is incorrect.'},
 {p:'Narin multiplied first: 2 × 4 = 8, then added 7: 8 + 7 = 15. This is correct.'},
 {p:'Narin’s answer is correct because she followed the order of operations.'}]},
ex1:{t:'Example 1: Soran’s marbles',b:[
 {p:'Soran has 20 marbles. He gives half of them to Aso, then gives 3 more to Ako.'},{eq:['20 ÷ 2 − 3','10 − 3','7']},
 {p:'Divide first, then subtract. Therefore, Soran has 7 marbles now.'}]},
ex2a:{t:'Example 2 (1): 36 ÷ (9 − 5) × 2 + 17',b:[
 {eq:['36 ÷ (9 − 5) × 2 + 17','36 ÷ 4 × 2 + 17','9 × 2 + 17','18 + 17','35']},
 {p:'Parentheses first (9 − 5 = 4). Then × and ÷ from left to right: 36 ÷ 4 = 9, then 9 × 2 = 18. Last, add 17.'},
 {note:'Note: the label printed beside the step 9 × 2 says “Subtract”, but that step is a multiplication.'}]},
ex2b:{t:'Example 2 (2): 3 × 6² + 4',b:[

/* ---------- build ---------- */
function build(){
 var main=document.getElementById('pages');
 for(var n=1;n<=6;n++){(function(n){
  var sec=el('section','pg');sec.id='p'+n;
  var bar=el('div','bar');bar.appendChild(el('h2',null,'Book page '+BOOK[n]));
  var bAll=el('button',null,'Show all solutions');bAll.type='button';
  var bRes=el('button',null,'Reset page');bRes.type='button';
  var bZ=el('button',null,'🔍 Zoom');bZ.type='button';
  if(n===2){bAll.style.display='none';bRes.style.display='none';}
  bar.appendChild(bAll);bar.appendChild(bRes);bar.appendChild(bZ);
  var wrap=el('div','wrap');var pg=el('div','page');
  var img=new Image();img.alt='Textbook page '+BOOK[n];img.src=IMGS[n];img.draggable=false;pg.appendChild(img);
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','lines');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');pg.appendChild(svg);
  wrap.appendChild(pg);sec.appendChild(bar);sec.appendChild(wrap);main.appendChild(sec);
  LAYER[n]={pg:pg,svg:svg,bAll:bAll};
  bZ.addEventListener('click',function(){wrap.classList.toggle('zoom');});
  bAll.addEventListener('click',function(){
   var list=EX.filter(function(e){return e.page===n;});
   var any=list.some(function(e){return e.step<e.n;});
   list.forEach(function(e){setStep(e,any?e.n:0);});
   bAll.textContent=any?'Hide solutions':'Show all solutions';
  });
  bRes.addEventListener('click',function(){
   EX.filter(function(e){return e.page===n;}).forEach(resetEx);
   bAll.textContent='Show all solutions';
  });
 })(n);}
 EX.forEach(buildEx);
 TPS.forEach(buildTp);
 document.getElementById('st').textContent=EX.filter(function(e){return !e.flagged;}).length;
 refreshStats();
}

function buildTp(t){
 var b=el('button','tp','💡');b.type='button';center(b,t.x,t.y);
 b.setAttribute('aria-label','Explanation: '+TOP[t.id].t);
 b.addEventListener('click',function(){openT(t.id,b);});
 LAYER[t.p].pg.appendChild(b);
}

function buildEx(e){
 var L=LAYER[e.page].pg;
 e.items.forEach(function(it){it.ok=false;it.tries=0;it.val='';it.bad=false;it.picked=false;it.i=0;if((it.t==='C'||it.t==='B')&&it.req===undefined)it.req=!!it.good;});
 e.items.forEach(function(it){
  if(it.t==='F')mkF(e,it,L);else if(it.t==='C')mkC(e,it,L);else if(it.t==='S')mkS(e,it,L);else if(it.t==='B')mkB(e,it,L);else if(it.t==='M')mkM(e,it,L);
 });
 var bb=e.bub;var d=el('div','bub'+(bb.warn?' warn':''));var b1=el('div','b1'),b2=el('div','b2');d.appendChild(b1);d.appendChild(b2);
 d.style.left=bb.x+'%';d.style.top=bb.y+'%';d.style.width=bb.w+'%';if(bb.nowrap){d.style.whiteSpace='nowrap';d.style.width='auto';}if(bb.sm)d.style.fontSize='max(9px,1.6cqw)';d.title='Tap to hide';
 d.addEventListener('click',function(){d.classList.remove('on');d.dataset.hid='1';});
 L.appendChild(d);e.bubEl=d;e.b1=b1;e.b2=b2;
 var eye=el('button','eye','👁');eye.type='button';center(eye,e.eye[0],e.eye[1]);
 eye.addEventListener('click',function(){setStep(e,e.step>=e.n?0:e.step+1);});
 L.appendChild(eye);e.eyeEl=eye;
 e.step=0;e.seen=false;e.usedEye=false;
 render(e);
}

function msg(it,text){if(!it.fb)return;it.fb.textContent=text;it.fb.classList.add('on');}
function hideFb(it){if(it.fb)it.fb.classList.remove('on');}
function tryMsg(it){it.tries++;var t=it.tries===1?T1:(it.tries===2?(it.hint||GEN):T3);msg(it,t);}

/* fill-in field */
function mkF(e,it,L){
 var w=el('div','f'+(it.cir?' cir':'')+side(it.x));center(w,it.x,it.y,it.w,it.h);
 var inp=document.createElement('input');inp.type='text';inp.setAttribute('inputmode',it.kb||'numeric');inp.autocomplete='off';inp.spellcheck=false;inp.maxLength=6;
 if(!it.cir)inp.placeholder='?';
 inp.setAttribute('aria-label',e.label+(it.cir?' (circle)':'')+' answer');
 var fb=el('div','fb');w.appendChild(inp);w.appendChild(fb);L.appendChild(w);
 it.w=w;it.inp=inp;it.fb=fb;var timer=null,timer2=null;
 function good(v){return it.ok2?it.ok2(v):it.ans.indexOf(v)>=0;}
 function submit(){
  if(sol(e,it)||it.ok)return;var v=norm(inp.value);it.val=inp.value;if(v===''||v===it.lastV)return;it.lastV=v;
  if(good(v)){it.ok=true;hideFb(it);render(e);}
  else{w.classList.remove('bad');void w.offsetWidth;w.classList.add('bad');tryMsg(it);}
 }
 inp.addEventListener('input',function(){
  if(sol(e,it)||it.ok)return;it.val=inp.value;it.lastV=null;hideFb(it);w.classList.remove('bad');
  clearTimeout(timer);var v=norm(inp.value);
  timer=setTimeout(function(){if(v!==''&&good(v)){submit();}},600);
  clearTimeout(timer2);timer2=setTimeout(submit,2200);
 });
 inp.addEventListener('change',function(){clearTimeout(timer);clearTimeout(timer2);submit();});
 inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();inp.blur();}});
 it.render=function(){
  w.classList.remove('ok','sol');
  if(sol(e,it)){inp.value=it.ans[0];inp.readOnly=true;w.classList.add('sol');w.classList.remove('bad');hideFb(it);}
  else{inp.value=it.val;inp.readOnly=it.ok;if(it.ok){w.classList.add('ok');w.classList.remove('bad');hideFb(it);}}
 };
}

/* circle choice */
function mkC(e,it,L){
 var b=el('button','ch'+side(it.x));b.type='button';center(b,it.x,it.y);
 var fb=el('div','fb');b.appendChild(fb);L.appendChild(b);it.b=b;it.fb=fb;
 var idx=e.items.indexOf(it);b.setAttribute('aria-label',e.label+' option '+(idx+1));
 b.addEventListener('click',function(ev){
  if(sol(e,it))return;
  if(e.items.some(function(x){return x.good&&x.ok;}))return;
  it.picked=true;
  if(it.flag){render(e);return;}
  if(it.good){it.ok=true;e.items.forEach(hideFb);}
  else{it.bad=true;b.classList.remove('bad');void b.offsetWidth;tryMsg(it);}
  render(e);
 });
 it.render=function(){
  b.className='ch'+side(it.x);
  if(sol(e,it)){if(it.good)b.classList.add('sol');if(it.flag)b.classList.add('note');}
  else if(it.flag){if(it.picked)b.classList.add('note');}
  else if(it.ok)b.classList.add('ok');
  else if(it.bad)b.classList.add('bad');
 };
}

/* symbol cell */
function mkS(e,it,L){
 var b=el('button','sym'+side(it.x));b.type='button';center(b,it.x,it.y);
 var fb=el('div','fb');b.appendChild(fb);L.appendChild(b);it.b=b;it.fb=fb;it.sp=document.createTextNode('');b.insertBefore(it.sp,fb);
 b.setAttribute('aria-label',e.label+': tap to choose <, > or =');
 b.addEventListener('click',function(){
  if(sol(e,it)||it.ok)return;
  it.i=(it.i+1)%4;var v=SYMS[it.i];hideFb(it);
  if(v==='')return;
  if(v===it.ans){it.ok=true;}
  else{it.bad=true;it.tries++;if(it.tries>=2)msg(it,it.tries===2?it.hint:T3);}
  render(e);
 });
 it.render=function(){
  b.className='sym'+side(it.x);
  if(sol(e,it)){it.sp.nodeValue=it.ans;b.classList.add('sol');}
  else{it.sp.nodeValue=SYMS[it.i];if(it.ok)b.classList.add('ok');else if(it.i>0)b.classList.add('bad');}
 };
}

function mkB(e,it,L){

 if(it.pill)b.appendChild(document.createTextNode(it.label));else{var s=el('span','vh',it.label);b.appendChild(s);}
 var fb=el('div','fb');b.appendChild(fb);
 L.appendChild(b);it.b=b;it.fb=fb;
 b.addEventListener('click',function(){
  if(sol(e,it))return;
  if(e.items.some(function(x){return x.good&&x.ok;}))return;
  if(it.good){it.ok=true;e.items.forEach(hideFb);}
  else{it.bad=true;b.classList.remove('bad');void b.offsetWidth;tryMsg(it);}
  render(e);
 });
 it.render=function(){
  b.className='bx'+(it.pill?' pill':'')+side(it.x);
  if(sol(e,it)){if(it.good)b.classList.add('sol');}
  else if(it.ok)b.classList.add('ok');else if(it.bad)b.classList.add('bad');
 };
}

/* matching */
function mkM(e,it,L){
 it.conn={};it.sel=null;it.dl=[];it.dr=[];it.tmp=null;
 var svg=LAYER[e.page].svg;
 var fbHost=el('div','f');center(fbHost,it.fx,it.fy,1,1);fbHost.style.pointerEvents='none';var fb=el('div','fb');fbHost.appendChild(fb);L.appendChild(fbHost);it.fb=fb;
 for(var i=0;i<3;i++){(function(i){
  var d=el('button','dot');d.type='button';center(d,it.lx,it.ly[i]);d.setAttribute('aria-label','Left expression '+(i+1));
  d.addEventListener('click',function(){if(e.step>0||it.conn[i]!=null)return;it.sel=(it.sel===i)?null:i;hideFb(it);render(e);});
  L.appendChild(d);it.dl.push(d);
  var r=el('button','dot');r.type='button';center(r,it.rx,it.ry[i]);r.setAttribute('aria-label','Right answer '+(i+1));
  r.addEventListener('click',function(){
   if(e.step>0||it.sel==null)return;
   var taken=false;for(var k in it.conn){if(it.conn[k]===i)taken=true;}
   if(it.pairs[it.sel]===i&&!taken){it.conn[it.sel]=i;it.sel=null;hideFb(it);render(e);}
   else{var s=it.sel;it.sel=null;flash(it,s,i);tryMsg(it);render(e);}
  });
  L.appendChild(r);it.dr.push(r);
 })(i);}
 function line(i,j,cls){var ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('x1',it.lx);ln.setAttribute('y1',it.ly[i]);ln.setAttribute('x2',it.rx);ln.setAttribute('y2',it.ry[j]);if(cls)ln.setAttribute('class',cls);svg.appendChild(ln);return ln;}
 function flash(it,i,j){var ln=line(i,j,'x');setTimeout(function(){if(ln.parentNode)ln.parentNode.removeChild(ln);},700);}
 it.lines=[];
 it.render=function(){
  it.lines.forEach(function(l){if(l.parentNode)l.parentNode.removeChild(l);});it.lines=[];
  for(var i=0;i<3;i++){
   var c=(e.step>i)?it.pairs[i]:it.conn[i];
   if(c!=null)it.lines.push(line(i,c));
   it.dl[i].className='dot'+(c!=null?' on':'')+(it.sel===i?' sel':'');
   it.dr[i].className='dot';
  }
  for(var k=0;k<3;k++){var cj=(e.step>k)?it.pairs[k]:it.conn[k];if(cj!=null)it.dr[cj].className='dot on';}
 };
 Object.defineProperty(it,'ok',{get:function(){return Object.keys(it.conn).length===3;},set:function(v){}});
}

/* ---------- state ---------- */
function allOk(e){return e.items.every(function(it){return !it.req||it.ok;});}
function sol(e,it){return e.step>=(it.revealAt||e.n);}
function render(e){
 e.items.forEach(function(it){if(it.render)it.render();});
 var idx=e.step;if(e.flagged&&idx===0&&e.items.some(function(i){return i.picked;}))idx=1;
 if(idx>0){var st=e.steps[idx-1];e.b1.textContent=(e.bub.pre||'')+idx+'/'+e.n+' · '+st.w;e.b2.textContent=st.x;if(e.bubEl.dataset.hid!=='1')e.bubEl.classList.add('on');}
 else{e.bubEl.classList.remove('on');delete e.bubEl.dataset.hid;}
 var k=e.step>0&&e.step<e.n;
 e.eyeEl.textContent=k?(e.step+'/'+e.n):'👁';
 e.eyeEl.classList.toggle('k',k);e.eyeEl.classList.toggle('on',e.step>=e.n);
 e.eyeEl.setAttribute('aria-label','Show the next step of '+e.label+' ('+e.step+' of '+e.n+' shown). After the last step, press again to hide.');
 refreshStats();
}
function setStep(e,k){
 if(k>0&&e.step===0&&!allOk(e)&&!e.flagged)e.usedEye=true;
 e.step=k;if(k>=e.n)e.seen=true;
 delete e.bubEl.dataset.hid;render(e);
}
function resetEx(e){
 e.items.forEach(function(it){it.ok=false;it.tries=0;it.val='';it.bad=false;it.picked=false;it.i=0;it.lastV=null;if(it.conn){it.conn={};it.sel=null;}hideFb(it);});
 e.step=0;e.seen=false;e.usedEye=false;delete e.bubEl.dataset.hid;render(e);
}
function refreshStats(){
 var X=0,Y=0,N=0;
 EX.forEach(function(e){
  if(e.flagged||!e.items)return;N++;
  var ok=allOk(e);
  if(ok||e.seen)X++;
  if(ok&&!e.usedEye)Y++;
 });
 document.getElementById('sx').textContent=X;document.getElementById('sy').textContent=Y;
 var fin=document.getElementById('finalTop'),fb=document.getElementById('finalBanner');
 if(N>0&&X===N){var t='🎉 Final score: '+Y+' of '+N;fin.textContent=t;fin.classList.add('on');fb.textContent=t+' solved by yourself';fb.classList.add('on');}
 else{fin.classList.remove('on');fb.classList.remove('on');}
}

/* ---------- modal ---------- */
var modal=document.getElementById('modal'),lastFocus=null;
function openT(id,from){
 var t=TOP[id];lastFocus=from||document.activeElement;
 document.getElementById('mTitle').textContent=t.t;
 var body=document.getElementById('mBody');body.textContent='';
 t.b.forEach(function(b){
  if(b.p)body.appendChild(el('p',null,b.p));
  else if(b.note)body.appendChild(el('div','note',b.note));
  else if(b.ol){var ol=el('ol');b.ol.forEach(function(x){ol.appendChild(el('li',null,x));});body.appendChild(ol);}
  else if(b.eq){var d=el('div','eq');b.eq.forEach(function(x,i){if(i)d.appendChild(document.createElement('br'));d.appendChild(document.createTextNode(x));});body.appendChild(d);}
 });
 modal.classList.add('on');document.getElementById('mClose').focus();
}
function closeT(){modal.classList.remove('on');if(lastFocus&&lastFocus.focus)lastFocus.focus();}
document.getElementById('mClose').addEventListener('click',closeT);
modal.addEventListener('click',function(ev){if(ev.target===modal)closeT();});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&modal.classList.contains('on'))closeT();});
document.getElementById('rulesBtn').addEventListener('click',function(){openT('steps',this);});

build();
})();
</script>
