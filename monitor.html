<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>متابعة الدروس</title>
<style>
:root{--g:#1b8a3a;--y:#c58a00;--r:#c0392b;--line:#d9dee5}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Geeza Pro","Noto Naskh Arabic",sans-serif;background:#f4f6f9;color:#1f2933;font-size:17px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:14px}h1{font-size:22px;margin:6px 0}h2{font-size:19px;margin:0 0 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
input,textarea{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;margin:6px 0}
button{font:inherit;padding:10px 16px;border:2px solid var(--line);border-radius:10px;background:#fff;min-height:44px}button.pri{background:#1f6fd1;color:#fff;border-color:#1f6fd1}
.bar{height:14px;background:#e7ebf0;border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:6px;vertical-align:middle}
.g{background:var(--g)}.y{background:var(--y)}.r{background:var(--r)}.n{background:#b8c0cc}
.strip{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.cell{width:30px;height:30px;border-radius:6px;font-size:11px;text-align:center;line-height:30px;color:#fff}
.note{color:#52606d;font-size:15px}.warn{color:var(--r);font-weight:700}.ok{color:var(--g);font-weight:700}
</style></head><body><div class="wrap" id="app"></div>
<script>
// shared: passphrase-protected setup codes (AES-GCM, PBKDF2). Nothing leaves the device.
function bkB64u(b){var s='';new Uint8Array(b).forEach(function(x){s+=String.fromCharCode(x)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function bkUnb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function bkKey(pass,salt){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function bkEncode(obj,pass){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));var k=await bkKey(pass,salt);var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj))));var all=new Uint8Array(28+ct.length);all.set(salt,0);all.set(iv,16);all.set(ct,28);return 'BKS1.'+bkB64u(all)}
async function bkDecode(code,pass){code=String(code||'').trim();if(code.indexOf('BKS1.')!==0)throw new Error('This is not a setup code.');var all=bkUnb64u(code.slice(5));var k=await bkKey(pass,all.slice(0,16));try{var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},k,all.slice(28));return JSON.parse(new TextDecoder().decode(pt))}catch(e){throw new Error('Wrong passphrase or damaged code.')}}

var $=function(s){return document.querySelector(s)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var KEY='bkm-code-v1',CFG=null,TIMER=null;
function p2(n){return (n<10?'0':'')+n}
function fmtDate(k){var p=k.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function dkey(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function ago(iso){if(!iso)return {t:'لا يوجد',h:1e9};var m=Math.round((Date.now()-new Date(iso).getTime())/60000);var t=m<1?'الآن':(m<90?('قبل '+m+' دقيقة'):(m<2880?('قبل '+Math.round(m/60)+' ساعة'):('قبل '+Math.round(m/1440)+' يوم')));return {t:t,h:m/60}}
function stepAr(s){return {reading:'القراءة',questions:'تعلّم الإجابات',definitions:'التعريفات','page check':'فحص الصفحة','section check':'فحص القسم'}[s]||s||''}
var FIRST='0000-00-00';
function verdict(d,isToday,work,key){
  if(key&&key<FIRST)return {c:'n',t:'قبل البدء'};
  if(!d||(d.sec<60&&!d.read.length&&!d.a))return work?(isToday?{c:'n',t:'لم تبدأ بعد اليوم'}:{c:'r',t:'لم تفتح الدرس'}):{c:'n',t:'عطلة'};
  var rate=d.a?d.w/d.a:0;
  if(!d.read.length)return {c:'y',t:'لم تقرأ صفحة (القراءة أقل من الحد)'};
  if((d.a>=5&&rate>0.3)||d.f>=5)return {c:'y',t:'قرأت لكنها تعثّرت'};
  return {c:'g',t:'قرأت وتقدّمت'};
}
async function load(book){
  var r=await fetch((CFG.api||'https://api.github.com')+'/repos/'+CFG.repo+'/contents/reports/'+book.id+'.json?t='+Date.now(),{headers:{'Authorization':'Bearer '+CFG.token,'Accept':'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404)return {none:true};if(!r.ok)throw new Error('GitHub '+r.status);
  var j=await r.json();return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
}
function bookCard(book,rep,err){
  var c=el('div','card');c.appendChild(el('h2',null,book.label||book.id));
  if(err){c.appendChild(el('p','warn','تعذّر جلب التقرير: '+err));return c}
  if(rep.none){c.appendChild(el('p','warn','لا يوجد تقرير بعد. لم يُسجَّل جهاز البنت أو لم تبدأ.'));return c}
  var a=ago(rep.upd);c.appendChild(el('p',a.h>24?'warn':'ok','آخر تقرير: '+a.t+(a.h>24?' (انقطع الإرسال: تحقق من الجهاز)':'')));
  var pos=rep.pos||{};
  c.appendChild(el('p',null,pos.done?'أنهت المسار كاملاً.':('الآن: '+pos.label+(pos.pg?(' — صفحة '+pos.pg+' ('+(pos.pk+1)+' من '+pos.pn+') — '+stepAr(pos.step)):(pos.step?(' — '+stepAr(pos.step)):'')))));
  var pr=rep.prog||{done:0,total:1},pc=Math.round(100*pr.done/pr.total);
  c.appendChild(el('p',null,'التقدّم: '+pr.done+' من '+pr.total+' خطوة متقنة ('+pc+'٪)'));
  var b=el('div','bar'),i=el('i');i.style.width=pc+'%';b.appendChild(i);c.appendChild(b);
  var days=rep.days||{};FIRST=Object.keys(days).sort()[0]||dkey(new Date());var tk=dkey(new Date()),td=days[tk]||{sec:0,read:[],a:0,w:0,f:0,ms:0};
  c.appendChild(el('h3',null,'اليوم'));
  var v=verdict(td,true,true),line=el('p');var dot=el('span','dot '+v.c);line.appendChild(dot);line.appendChild(document.createTextNode(v.t));c.appendChild(line);
  c.appendChild(el('p','note','مدة النشاط: '+Math.round(td.sec/60)+' دقيقة — صفحات قرأتها: '+td.read.length+' — أسئلة أجابت: '+td.a+' (أخطاء '+td.w+') — مرات «نسيت»: '+td.f+' — خطوات أتقنتها: '+td.ms));
  c.appendChild(el('h3',null,'آخر 14 يوماً'));var st=el('div','strip');
  for(var k=13;k>=0;k--){var d=new Date();d.setDate(d.getDate()-k);var key=dkey(d),wd=d.getDay(),work=wd!==5&&wd!==6;var vv=verdict(days[key],k===0,work,key);var cell=el('div','cell '+vv.c,String(d.getDate()));cell.title=fmtDate(key)+' — '+vv.t;st.appendChild(cell)}
  c.appendChild(st);c.appendChild(el('p','note','أخضر: قرأت وتقدّمت. أصفر: قرأت لكنها تعثّرت أو لم تُكمل القراءة. أحمر: لم تفتح (في أيام العمل). رمادي: عطلة أو لم تبدأ بعد. الجمعة والسبت عطلة.'));
  c.appendChild(el('h3',null,'أضعف النقاط'));
  if(!(rep.weak||[]).length)c.appendChild(el('p','note','لا نقاط ضعف مسجلة بعد.'));
  (rep.weak||[]).forEach(function(w){c.appendChild(el('p',null,'• '+w.t+' (صفحة '+w.pg+')'))});
  c.appendChild(el('p','note','هذه إشارات من نشاطها وليست تشخيصاً.'));
  return c;
}
async function render(){
  var app=$('#app');var out=[];
  for(var i=0;i<CFG.books.length;i++){var b=CFG.books[i];try{out.push(bookCard(b,await load(b)))}catch(e){out.push(bookCard(b,null,e.message))}}
  app.textContent='';app.appendChild(el('h1',null,'متابعة الدروس'));
  var top=el('div','note','آخر تحديث للوحة: '+new Date().toLocaleTimeString('ar')+' — تتحدّث تلقائياً كل 30 ثانية');app.appendChild(top);
  out.forEach(function(x){app.appendChild(x)});
}
function lock(msg){
  clearInterval(TIMER);var app=$('#app');app.textContent='';app.appendChild(el('h1',null,'متابعة الدروس'));
  var c=el('div','card');var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  var ta=el('textarea');ta.rows=3;ta.placeholder='رمز الإعداد (مرة واحدة على هذا الجهاز)';ta.value=saved||'';
  var pw=el('input');pw.type='password';pw.placeholder='كلمة السر';pw.autocomplete='off';
  var m=el('p','warn',msg||'');var go=el('button','pri','دخول');
  go.addEventListener('click',async function(){try{var o=await bkDecode(ta.value,pw.value);if(o.role!=='monitor')throw new Error('هذا الرمز ليس رمز مراقب.');CFG=o;try{localStorage.setItem(KEY,ta.value.trim())}catch(e){}pw.value='';await render();TIMER=setInterval(render,30000)}catch(e){m.textContent=e.message==='Wrong passphrase or damaged code.'?'كلمة السر خاطئة أو الرمز تالف.':e.message}});
  c.appendChild(ta);c.appendChild(pw);c.appendChild(go);c.appendChild(m);app.appendChild(c);
}
lock('');
</script></body></html>
