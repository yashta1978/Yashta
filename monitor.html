function bkB64u(b){var s='';new Uint8Array(b).forEach(function(x){s+=String.fromCharCode(x)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

  function ln(d,t,c){var q=rich(el('p',c||null),t);q.style.margin='6px 0';d.appendChild(q)}

    if(pos&&pos.label)ln(W,N(pos.label)+(pos.pg?' — صفحة '+pos.pg:'')+(pos.step?' — '+stepAr(pos.step,pos):''));
    else if(cur)ln(W,N(cur.S.n)+' — صفحة '+cur.P.p+' — '+cur.f.t);else ln(W,'لم تبدأ','note');
    if(hwS.length){var pr=el('p',null,(ex?'الأولوية — اختبار '+ex.sub:'الأولوية — الواجب اليومي'));pr.style.cssText='font-weight:700;margin:8px 0 4px';R.appendChild(pr)}
    hwS.forEach(function(S){var any=false;S.pg.forEach(function(P){var left=pgItems(P).filter(function(x){return !x.ok}).map(function(x){return x.t});if(left.length){any=true;ln(R,N(S.n)+' — صفحة '+P.p+': '+left.join('، '))}});if(!(S.m&&S.m.ok)){any=true;ln(R,N(S.n)+' — فحص الدرس')}if(!any)ln(R,N(S.n)+' ✓ مكتمل','okc')});
    if(oth.length){var rs=el('p',null,'بقية الدروس');rs.style.cssText='font-weight:700;margin:12px 0 4px';R.appendChild(rs)}
    oth.forEach(function(S){var dn=0,tt=0;S.pg.forEach(function(P){var z=stSteps(P);dn+=z[0];tt+=z[1]});var fin=(S.m&&S.m.ok)&&dn===tt;
      if(fin){ln(R,'✓ '+N(S.n)+' — مكتمل','okc');return}

      var dd=el('details');dd.appendChild(rsum('◐ '+N(S.n)+' — '+dn+' من '+tt));
      S.pg.forEach(function(P){var left=pgItems(P).filter(function(x){return !x.ok}).map(function(x){return x.t});if(left.length)ln(dd,'صفحة '+P.p+': '+left.join('، '))});

    var all=el('details');all.appendChild(rsum('كل التفاصيل صفحة بصفحة'));var cc=bookCard({id:'x',label:title},rep);cc.className='';all.appendChild(cc);ov.appendChild(all);
  }else{
    ln(A,'التقرير الحالي لا يحمل تفاصيل الخطوات (كتاب قديم). تظهر عندما تفتح البنت النسخة الجديدة.','note');var dk=Object.keys((rep&&rep.days)||{}).sort().pop();if(dk){var q0=rep.days[dk];ln(A,'آخر نشاط مسجَّل '+fmtDate(dk)+': '+Math.round((q0.sec||0)/60)+' دقيقة — صفحات قرأتها: '+((q0.read||[]).join('، ')||'—')+' — أجابت '+(q0.a||0)+' (أخطاء '+(q0.w||0)+') — «نسيت» '+(q0.f||0)+' — خطوات أتقنتها '+(q0.ms||0))}

  }

}
async function render(){

  var G={f:[],a:[],o:[]};

  det0=null;var byId={};out.forEach(function(x){byId[x.b.id]=x});

      line.appendChild(tx);line.appendChild(btn);c.appendChild(line);c.appendChild(msg)});
    days.forEach(function(dy,di){

        else{box.appendChild(line);box.appendChild(msg)}

    app.appendChild(c)});

function lock(msg){
  clearInterval(TIMER);CFG=null;var app=$('#app');app.textContent='';app.appendChild(el('h1',null,'متابعة الدروس'));
  var c=el('div','card');
  var pw=el('input');pw.type='password';pw.inputMode='numeric';pw.placeholder='رقمك';pw.autocomplete='off';
  var m=el('p','warn',msg||'');var go=el('button','pri','دخول');
  async function enter(num){try{
    var r=await fetch('reports-config.json',{cache:'no-store'});if(!r.ok)throw new Error('ملف الإعداد غير موجود.');var cfg=await r.json();var o=null;
    for(var i=0;i<(cfg.e||[]).length;i++){if(cfg.e[i].k!=='p')continue;try{o=await bkDecode(cfg.e[i].c,num);break}catch(x){}}
    if(!o||o.role!=='monitor')throw new Error('الرقم خاطئ.');
    CFG=o;pw.value='';parSet(o);await render();if(CFG)TIMER=setInterval(render,30000)}catch(e){m.textContent=e.message}}
  go.addEventListener('click',function(){m.textContent='…';enter(bkND(pw.value))});
  c.appendChild(pw);c.appendChild(go);c.appendChild(m);app.appendChild(c);
  var sp=null;try{sp=sessionStorage.getItem('bk-mon-pass');sessionStorage.removeItem('bk-mon-pass')}catch(e){}
  if(sp)enter(bkND(sp));
}
(function(){var c=parGet();if(c){CFG=c;render().then(function(){TIMER=setInterval(render,30000)})}else lock('')})();
